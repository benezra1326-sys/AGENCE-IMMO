<title>Back-office Avishay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : poste de pilotage d'une seule personne. Menu fixe en bas sur téléphone, en haut sur ordinateur ;
   l'accueil montre d'abord ce qui attend Avishay ; tout élément ouvre une fiche (feuille qui monte sur mobile). */
:root {
  --bg: #f2f2ef; --surface: #ffffff; --surface-2: #f7f4ee; --fg: #15181d; --muted: #63666b; --line: #dedcd6;
  --ink: #15181d; --on-ink: #ffffff; --sand: #b89a66; --sand-text: #7a5f33; --sand-soft: #efe6d6;
  --ok: #2c7a4b; --ok-bg: #e3f1e7; --info: #2f5f9e; --info-bg: #e5ecf6; --warn: #96580a; --warn-bg: #f9ecd7;
  --bad: #b03030; --bad-bg: #f7e2e0; --idle: #6b6e72; --idle-bg: #ecebe8; --test: #6a4aa0; --test-bg: #ede7f6;
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111316; --surface: #191c20; --surface-2: #1f2226; --fg: #ece9e3; --muted: #9b9ea3; --line: #2c3035;
  --ink: #ece9e3; --on-ink: #15181d; --sand: #d0b27d; --sand-text: #d8bd8c; --sand-soft: #2b2519;
  --ok: #7fd19c; --ok-bg: #173022; --info: #8fb6ec; --info-bg: #182740; --warn: #efb45c; --warn-bg: #352612;
  --bad: #f08c84; --bad-bg: #3a1a18; --idle: #a5a8ac; --idle-bg: #25282c; --test: #b9a2e6; --test-bg: #2a2140; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111316; --surface: #191c20; --surface-2: #1f2226; --fg: #ece9e3; --muted: #9b9ea3; --line: #2c3035;
  --ink: #ece9e3; --on-ink: #15181d; --sand: #d0b27d; --sand-text: #d8bd8c; --sand-soft: #2b2519;
  --ok: #7fd19c; --ok-bg: #173022; --info: #8fb6ec; --info-bg: #182740; --warn: #efb45c; --warn-bg: #352612;
  --bad: #f08c84; --bad-bg: #3a1a18; --idle: #a5a8ac; --idle-bg: #25282c; --test: #b9a2e6; --test-bg: #2a2140; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); margin: 0; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit }
a { color: var(--sand-text) }
:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px }

/* En-tête et menu */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px }
.marque { display: flex; flex-direction: column; min-width: 0 }
.marque b { font: 600 1.35rem/1.1 var(--f-display); letter-spacing: .01em }
.marque small { color: var(--muted); font-size: .74rem; letter-spacing: .04em }
.etat-base { font-size: .74rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.etat-base::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--idle) }
.etat-base.ok::before { background: var(--ok) }
nav.menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)) }
nav.menu a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--nav-h); text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 500; position: relative }
nav.menu svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
nav.menu a[aria-current="page"] { color: var(--fg) }
nav.menu a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--sand); border-radius: 0 0 2px 2px }
.badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .66rem; font-weight: 600; display: grid; place-items: center }
@media (min-width: 880px) {
  nav.menu { position: static; display: flex; gap: 2px; border: 0; padding: 0; background: none }
  nav.menu a { flex-direction: row; height: 40px; padding: 0 12px; font-size: .88rem; border-radius: 8px; gap: 7px }
  nav.menu a:hover { background: var(--surface-2) }
  nav.menu a[aria-current="page"] { background: var(--sand-soft) }
  nav.menu a[aria-current="page"]::before { display: none }
  nav.menu svg { width: 18px; height: 18px }
  .badge { position: static; margin-left: 2px }
}

main { display: flex; flex-direction: column; gap: 30px; padding-block: 18px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px)) }
@media (min-width: 880px) { main { padding-block: 24px 56px } }
.bandeau { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .84rem; border: 1px solid var(--line) }
.bandeau.alerte { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent) }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.titre-section { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap }
h1 { font: 600 2rem/1.1 var(--f-display); margin: 0; text-wrap: balance }
h2 { font: 600 1.45rem/1.15 var(--f-display); margin: 0; text-wrap: balance }
h3 { font: 600 .98rem/1.3 var(--f-body); margin: 0; overflow-wrap: anywhere }
.compte { font: 500 .78rem var(--f-mono); color: var(--muted) }
.intro { color: var(--muted); margin: 0; max-width: 65ch; font-size: .88rem }
.lien-section { font-size: .84rem; font-weight: 500; color: var(--sand-text); text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer }
.mono { font-family: var(--f-mono); font-size: .76rem }
.meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 3px 12px }
.meta b { color: var(--fg); font-weight: 500 }
.note { font-size: .88rem; margin: 0; overflow-wrap: anywhere }
.vide { color: var(--muted); font-size: .88rem; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; margin: 0 }

/* Pastilles d'état */
.recap ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px }
.recap li { font-size: .9rem } .recap li b { font-size: 1.15rem; margin-right: 4px; font-variant-numeric: lining-nums } .recap li.zero { color: var(--muted) }
.recap .liste { margin-top: 12px }
@media (max-width: 380px) { .recap ul { grid-template-columns: 1fr } }
.projets { display: flex; gap: 6px; overflow-x: auto; margin: 4px 0 18px; padding: 4px; background: var(--surface, #fff); border: 1px solid var(--line, #e5e0d6); border-radius: 999px; width: fit-content; max-width: 100% }
.projets a { padding: 7px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: .85rem; font-weight: 600; white-space: nowrap }
.projets a[aria-current="page"] { background: var(--ink); color: var(--on-ink) }
.pastille { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; white-space: nowrap; letter-spacing: .02em; flex: none }
.pastille::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.s-propose, .s-prevu, .s-en_attente, .s-a_configurer, .s-reporte, .s-liste_preparee, .s-brouillon, .s-en_preparation, .s-remplace { color: var(--idle); background: var(--idle-bg) }
.s-configure, .s-en_cours, .s-partiel, .s-en_lancement { color: var(--info); background: var(--info-bg) }
.s-teste, .s-a_valider, .s-preparee { color: var(--test); background: var(--test-bg) }
.s-actif, .s-confirme, .s-terminee, .s-operationnel, .s-valide, .s-envoyee, .s-publie { color: var(--ok); background: var(--ok-bg) }
.s-recue { color: var(--idle); background: var(--idle-bg) } .s-attribuee { color: var(--info); background: var(--info-bg) } .s-traitee { color: var(--ok); background: var(--ok-bg) } .s-question { color: var(--warn); background: var(--warn-bg) }
.s-bloque, .s-bloquee, .s-modification_demandee, .s-manquant, .s-a_verifier { color: var(--warn); background: var(--warn-bg) }
.s-echec, .s-appel_demande { color: var(--bad); background: var(--bad-bg) }

/* Éléments cliquables */
.cliquable { all: unset; box-sizing: border-box; cursor: pointer; display: flex; min-width: 0 }
.cliquable:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px }
.chevron { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

/* Tuiles de l'accueil */
.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 680px) { .tuiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tuile { flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.tuile:hover { border-color: var(--sand) }
.tuile span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em }
.tuile strong { font: 600 1.6rem/1.2 var(--f-body); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em }
.tuile small { color: var(--muted); font-size: .76rem }

/* Contenus à valider */
.rang-contenus { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 240px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin-inline: -4px; padding-inline: 4px }
.grille-contenus { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px }
.contenu { flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-snap-align: start }
.contenu:hover { border-color: var(--sand) }
.contenu .visuel { position: relative; aspect-ratio: 4 / 5; background: var(--idle-bg); overflow: hidden; max-width: 100% }
.contenu .visuel img, .contenu .visuel video { width: 100%; height: 100%; object-fit: cover; display: block }
.contenu .visuel .format { position: absolute; left: 8px; top: 8px; background: rgb(0 0 0 / .62); color: #fff; font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px }
.contenu .visuel .lecture { position: absolute; inset: auto 8px 8px auto; width: 34px; height: 34px; border-radius: 50%; background: rgb(0 0 0 / .62); display: grid; place-items: center }
.contenu .visuel .lecture::before { content: ""; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px }
.contenu .corps { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px }
.contenu .ouvrir { font-size: .8rem; font-weight: 600; color: var(--sand-text) }

/* Équipe */
.avatars { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px }
.membre { flex-direction: column; align-items: center; gap: 4px; width: 64px; flex: none; text-align: center }
.membre small { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.avatar { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 600 1.15rem/1 var(--f-display); background: var(--sand-soft); color: var(--sand-text); border: 1px solid color-mix(in srgb, var(--sand) 40%, transparent); flex: none }
.avatar.grand { width: 58px; height: 58px; font-size: 1.45rem }
.avatar i { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--surface); background: var(--idle) }
.avatar i.e-teste { background: var(--test) } .avatar i.e-actif { background: var(--ok) } .avatar i.e-configure { background: var(--info) } .avatar i.e-bloque { background: var(--warn) }
.grille-agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px }
.agent { gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.agent:hover { border-color: var(--sand) }
.agent .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 }
.legende-etats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted) }

/* Listes */
.liste { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.rangee { align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100% }
.liste > :last-child { border-bottom: 0 }
.rangee:hover { background: var(--surface-2) }
.rangee .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 }
.rangee .txt .note { color: var(--muted); font-size: .82rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.puce { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle) }
.puce.warn { background: var(--warn) } .puce.bad { background: var(--bad) } .puce.test { background: var(--test) }
.filtres { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.filtres button { flex: none; font-size: .8rem; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.filtres button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink) }

/* Boutons et formulaires */
.btn { font-size: .86rem; font-weight: 500; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; gap: 6px }
.btn.principal { background: var(--ink); border-color: var(--ink); color: var(--on-ink) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.actions { display: flex; gap: 8px; flex-wrap: wrap }
textarea { width: 100%; min-height: 84px; font: inherit; font-size: .92rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); resize: vertical }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.histo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .82rem }
.histo li { border-left: 2px solid var(--line); padding-left: 10px; overflow-wrap: anywhere }

/* Tableaux */
.tableau { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .84rem }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { color: var(--muted); font-weight: 500; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap }
tr:last-child td { border-bottom: 0 }

/* Fiche (feuille) */
dialog.fiche { padding: 0; border: 0; background: var(--surface); color: var(--fg); width: 100%; max-width: 100%; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; overflow: auto; overscroll-behavior: contain }
dialog.fiche::backdrop { background: rgb(0 0 0 / .5) }
@media (min-width: 760px) { dialog.fiche { width: min(760px, calc(100% - 48px)); margin: auto; border-radius: 16px; max-height: 88dvh; border: 1px solid var(--line) } }
@media (prefers-reduced-motion: no-preference) { dialog.fiche[open] { animation: monte .22s ease-out } @keyframes monte { from { transform: translateY(24px); opacity: .6 } } }
.fiche-tete { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px 16px; display: flex; align-items: center; gap: 10px }
.fiche-tete .titre { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.fiche-tete .titre b { font: 600 1.25rem/1.15 var(--f-display); overflow-wrap: anywhere }
.icone-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; place-items: center }
.icone-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.fiche-corps { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px }
.bloc { display: flex; flex-direction: column; gap: 6px }
.bloc > .etiquette { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.puces-texte { display: flex; flex-wrap: wrap; gap: 6px }
.puces-texte span { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line) }
.manque { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.manque li { font-size: .88rem; padding: 8px 10px 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--fg); border-left: 3px solid var(--warn); overflow-wrap: anywhere }
.medias { display: flex; flex-direction: column; gap: 12px; align-items: center }
.medias figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; max-width: 100% }
.medias img, .medias video { max-width: 100%; max-height: 72dvh; border-radius: 10px; background: #000 }
.medias figcaption { font-size: .76rem; color: var(--muted); text-align: center }
.diapos { display: grid; grid-auto-flow: column; grid-auto-columns: 82%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; width: 100% }
.diapos figure { scroll-snap-align: center }
details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2) }
details summary { cursor: pointer; font-weight: 500; font-size: .9rem }
.telecharger { display: inline-block; margin-left: 6px; font-weight: 600; color: var(--fg); text-decoration: underline }
.cal-jour { font-size: .95rem; margin: 18px 0 8px; text-transform: capitalize }
.cal-heure { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 52px }
.li-posts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 10px 0 }
.li-post { min-width: 0; overflow: hidden; border: 1px solid var(--line, #ddd); border-radius: 12px; padding: 14px; background: var(--surface) }
.li-num { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px }
.li-tete { display: flex; gap: 10px; align-items: center; margin-bottom: 10px }
.li-tete small { display: block; color: var(--muted); font-size: .78rem }
.li-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: .85rem; flex: none }
.li-texte { white-space: pre-wrap; margin: 0; font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere }
.li-post details { margin-top: 10px }
.li-image img, .li-post .diapos img { width: 100%; max-width: 100%; border-radius: 8px; margin-top: 10px; display: block }
.texte-brut { white-space: pre-wrap; font: .84rem/1.55 var(--f-body); margin: 10px 0 0; overflow-wrap: anywhere }
.fichiers { margin: 0; padding-left: 18px; font-size: .82rem; overflow-wrap: anywhere }
.decision { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -16px calc(-24px - env(safe-area-inset-bottom, 0px)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px }
.decision .actions .btn { flex: 1; justify-content: center }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 10px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 20 }
.plus-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px }
.plus-item { gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.plus-item:hover { border-color: var(--sand) }
.plus-item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.plus-item .txt small { color: var(--muted); font-size: .8rem }
.retour { align-self: flex-start }
.btn.micro svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round }
.btn.micro[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad) }
.destinataire { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.destinataire select { flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.provisoire { font-style: italic }
.echange { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.echange li { max-width: 88%; padding: 9px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 3px }
.echange li.moi { align-self: flex-end; background: var(--sand-soft); border-bottom-right-radius: 4px }
.echange li.agent { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px }
</style>

  <div class="wrap">
    <div class="marque"><b>Avishay · Back-office</b><small id="genere">Chargement…</small></div>
    <nav class="menu" id="menu" aria-label="Menu principal">
      <a href="#accueil" data-route="accueil"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Accueil</a>
      <a href="#valider" data-route="valider"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>À valider<span class="badge" id="badge-valider" hidden></span></a>
      <a href="#equipe" data-route="equipe"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.6c2.3.1 4 1.7 4.6 4.4"/></svg>Équipe</a>
      <a href="#calendrier" data-route="calendrier"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></svg>Calendrier</a>
      <a href="#plus" data-route="plus"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>Plus</a>
    </nav>
    <span class="etat-base" id="etat-base">aperçu</span>
  </div>

<main class="wrap" id="vue-principale"></main>
<dialog class="fiche" id="fiche" aria-labelledby="fiche-titre"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const STATIQUE = !!window.__ETAT__;
  let E = window.__ETAT__ || null;
  let DB = null, PEUT_ECRIRE = false;           // page publiée : décisions enregistrées dans la base de l'artifact
  const DECISIONS = {}, CONSIGNES = [], CAL = {};  // CAL : calendrier des publications (collection « calendrier »)
  let DICT = null, CIBLE_DICTEE = null, SAMPLE = null, COMMENTS = null, DIRECT = false;  // DIRECT : la consigne réveille Claude (Send to Claude)  // SAMPLE : réponse immédiate de l'agent         // dictée vocale (Chrome et app Claude sur ordinateur)
  const actif = () => !STATIQUE || (DB && PEUT_ECRIRE);
  const filtres = { taches: "a_traiter" };
  const LIB = {
    prevu: "prévu", configure: "configuré", teste: "testé", actif: "actif", bloque: "bloqué",
    en_attente: "en attente", en_cours: "en cours", terminee: "terminée", echec: "échec", bloquee: "bloquée",
    a_valider: "à valider", modification_demandee: "en modification", valide: "validé", publie: "publié", remplace: "remplacé",
    brouillon: "brouillon", en_preparation: "en préparation", operationnel: "opérationnel", partiel: "partiel",
    manquant: "manquant", a_verifier: "à activer ou vérifier", a_configurer: "à configurer", propose: "proposé", confirme: "confirmé", reporte: "reporté", en_lancement: "en lancement",
    recue: "reçue", attribuee: "prise en charge", traitee: "faite", question: "question pour toi",
    liste_preparee: "liste préparée", preparee: "préparée", envoyee: "envoyée", nouveau: "nouveau", appel_demande: "appel demandé"
  };
  const COTE = { serveur: "serveur (Mac éteint)", claude: "sessions Claude", telephone: "ton téléphone", mac: "ton Mac" };
  const FORMATS = { reel: "Reel", carrousel: "Carrousel", animation: "Animation", story: "Story", post: "Post" };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pill = s => `<span class="pastille s-${esc(s)}">${esc(LIB[s] || s)}</span>`;
  const date = s => s ? new Date(s).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }) : "—";
  const jour = s => s ? new Date(s + (s.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short", timeZone: "Europe/Madrid" }) : "à fixer";
  const eur = n => (Number(n) || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
  const CHEVRON = `<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
  const agent = id => E.agents.find(x => x.id === id);
  const nomAgent = id => { const a = agent(id); return a ? (a.prenom ? `${a.prenom} (${a.nom})` : a.nom) : (id || "—"); };
  const initiale = a => esc((a.prenom || a.nom || "?").trim()[0].toUpperCase());
  const avatar = (a, grand) => `<span class="avatar${grand ? " grand" : ""}" aria-hidden="true">${initiale(a)}<i class="e-${esc(a.etat)}"></i></span>`;
  const ouvre = (type, id, inner, cls) => `<button type="button" class="cliquable ${cls}" data-fiche="${type}" data-id="${esc(id)}">${inner}</button>`;
  const titreSection = (titre, compte, lien) => `<div class="titre-section"><h2>${titre}${compte !== null && compte !== undefined ? ` <span class="compte">${compte}</span>` : ""}</h2>${lien || ""}</div>`;

  function lienFichier(x) {
    const f = typeof x === "string" ? x : x.chemin, lib = typeof x === "string" ? x : x.libelle;
    if (/^https?:\/\//.test(f)) return `<a href="${esc(f)}" target="_blank" rel="noopener">${esc(lib)}</a>`;
    if (f.startsWith("/")) return `${esc(lib.split("/").pop())} <span class="meta">(stockage du projet)</span>`;
    return STATIQUE ? `${esc(lib)} <span class="meta">(dépôt)</span>` : `<a href="/fichiers/${esc(f)}" target="_blank" rel="noopener">${esc(lib)}</a>`;
  }

  // ---------- Données dérivées ----------
  function activiteAgent(a) {
    const t = E.taches.filter(x => x.agent === a.id).sort((x, y) => String(y.maj_le).localeCompare(String(x.maj_le)));
    return {
      toutes: t,
      ouvertes: t.filter(x => x.statut === "en_cours" || x.statut === "en_attente"),
      derniere: t.find(x => x.statut === "terminee"),
      bloquees: t.filter(x => x.statut === "bloquee" || x.statut === "echec")
    };
  }
  const aValider = () => E.contenus.filter(c => c.activite === "immo" && c.statut === "a_valider");
  const enModif = () => E.contenus.filter(c => c.activite === "immo" && c.statut === "modification_demandee");
  function rangeeModif(c) {
    const d = DECISIONS[c.id] || {}, demande = d.texte || ((c.retours || []).filter(r => r.decision !== "valide").slice(-1)[0] || {}).texte || "";
    const suivi = d.applique ? "Nouvelle version livrée" : d.transmis_le ? `Prise en charge le ${date(d.transmis_le)}` : "Transmise à l'équipe, prise en charge à venir";
    return ouvre("contenu", c.id, `<span class="puce warn"></span><span class="txt"><h3>${esc(c.titre)}</h3>${demande ? `<span class="note">Ta demande : ${esc(demande)}</span>` : ""}<span class="meta"><span>${esc(suivi)}</span></span></span>${pill(c.statut)}${CHEVRON}`, "rangee");
  }
  const bloquees = () => E.taches.filter(x => x.statut === "bloquee" || x.statut === "echec");
  const connexionsAFaire = () => (E.connexions.connexions || []).filter(c => c.action && c.statut !== "operationnel");
  function visuel(c) {
    const m = (c.apercu && c.apercu.medias) || [];
    const img = m.find(x => x.type === "image") || null, vid = m.find(x => x.type === "video") || null;
    const poster = (vid && vid.poster) || (img && img.url);
    const fond = poster ? `<img src="${esc(poster)}" alt="" loading="lazy">`
      : vid ? `<video src="${esc(vid.url)}#t=0.8" muted playsinline preload="metadata"></video>` : "";
    return `<div class="visuel">${fond}<span class="format">${esc(FORMATS[c.format] || c.format || "contenu")}${c.langue ? " · " + esc(c.langue.toUpperCase()) : ""}</span>${vid ? `<span class="lecture" aria-hidden="true"></span>` : ""}</div>`;
  }
  function postsLinkedin(c) {  // découpe « ## Post N – titre » / **FR** / **EN** en cartes façon LinkedIn
    const tx = ((c.apercu && c.apercu.textes) || [])[0];
    if (!tx || !/linkedin/i.test(c.format || "")) return [];
    return tx.texte.split(/\n## /).slice(1).filter(b => /^Post/i.test(b)).map(b => {
      const titre = b.split("\n")[0].trim(), corps = b.split(/\n---/)[0];
      const fr = (corps.split("**FR**")[1] || "").split("**EN**")[0].trim(), en = (corps.split("**EN**")[1] || "").trim();
      return { titre, fr, en };
    }).filter(x => x.fr);
  }
  const carteLinkedin = (x, i, medias) => { const im = (medias || []).filter(m => m.type === "image" && (m.libelle || "").startsWith(`Post ${i + 1} `));
    return `<article class="li-post"><p class="li-num">${esc(x.titre)}</p>
    <div class="li-tete"><span class="li-av">AB</span><span><b>Avishay Benazra</b><small>Agent immobilier · Levy &amp; Goldman, Marbella</small></span></div>
    <p class="li-texte">${esc(x.fr)}</p>${im.length ? `<div class="${im.length > 1 ? "diapos" : "li-image"}">${im.map(m => `<img src="${esc(m.url)}" alt="${esc(m.libelle)}">`).join("")}</div>${im.length > 1 ? `<span class="meta">Carrousel de ${im.length} images, fais glisser.</span>` : ""}` : ""}${x.en ? `<details><summary>Version anglaise</summary><p class="li-texte">${esc(x.en)}</p></details>` : ""}</article>`; };
  const carteContenu = c => ouvre("contenu", c.id, `${visuel(c)}<div class="corps"><div>${pill(c.statut)}</div><h3>${esc(c.titre)}</h3>
    <div class="meta">${c.bien ? `<span>Bien <b>${esc(c.bien)}</b></span>` : ""}<span>Date <b>${jour(c.date_prevue)}</b></span></div><span class="ouvrir">Voir et décider</span></div>`, "contenu");
  const carteAgent = a => { const x = activiteAgent(a);
    const ligne = x.ouvertes.length ? "En cours : " + x.ouvertes[0].titre : a.etat === "bloque" ? "Il manque : " + ((a.manque || [])[0] || "une connexion") : x.derniere ? "Dernière production : " + x.derniere.titre : "Disponible";
    return ouvre("agent", a.id, `${avatar(a)}<span class="txt"><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>${esc(a.prenom || a.nom)}</h3>${pill(a.etat)}</span><span class="meta">${esc(a.nom)}</span><span class="note" style="color:var(--muted);font-size:.82rem">${esc(ligne)}</span></span>`, "agent"); };
  const puceStatut = s => s === "echec" ? "bad" : (s === "bloquee" || s === "manquant" || s === "a_verifier") ? "warn" : s === "a_valider" ? "test" : "";
  const rangeeTache = t => ouvre("tache", t.id, `<span class="puce ${puceStatut(t.statut)}"></span><span class="txt"><h3>${esc(t.titre)}</h3><span class="meta"><span>${esc(nomAgent(t.agent))}</span><span>${date(t.maj_le)}</span></span>${t.raison_echec ? `<span class="note">${esc(t.raison_echec)}</span>` : ""}</span>${pill(t.statut)}${CHEVRON}`, "rangee");

  // ---------- Vues ----------
  function recapJour() {
    const auj = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" });
    const duJour = x => x && new Date(x).toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" }) === auj;
    const faites = E.taches.filter(t => t.statut === "terminee" && duJour(t.maj_le));
    const valides = Object.values(DECISIONS).filter(d => d.statut === "valide" && duJour(d.quand)).length;
    const questions = CONSIGNES.filter(k => k.statut === "question"), enCours = CONSIGNES.filter(k => k.statut === "recue" || k.statut === "attribuee");
    const leads = E.prospects.filter(p => !p.fictif && ["nouveau", "appel_demande"].includes(p.appel_demande ? "appel_demande" : p.statut));
    const lignes = [
      [aValider().length, "à valider par toi", "#valider"], [questions.length, `question${questions.length > 1 ? "s" : ""} de Victor en attente de ta réponse`, questions[0] ? null : ""],
      [enModif().length, "en modification chez l'équipe", "#valider"], [enCours.length, `consigne${enCours.length > 1 ? "s" : ""} en cours`, ""],
      [faites.length + valides, "terminé ou validé aujourd'hui", "#taches"], [leads.length, `lead${leads.length > 1 ? "s" : ""} chaud${leads.length > 1 ? "s" : ""}`, "#acheteurs"]
    ];
    const li = ([n, t, h]) => `<li${n ? "" : ` class="zero"`}><b>${n}</b> ${esc(t)}</li>`;
    return `<article class="carte recap"><ul>${lignes.map(li).join("")}</ul>${questions.length ? `<div class="liste">${questions.slice(0, 3).map(rangeeConsigne).join("")}</div>` : ""}</article>`;
  }
  function vueAccueil() {
    const av = aValider(), bl = bloquees(), ag = E.agents.filter(a => a.activite === "immo");
    const testes = ag.filter(a => a.etat === "teste" || a.etat === "actif").length;
    const cx = E.connexions.connexions || [], ok = cx.filter(x => x.statut === "operationnel").length;
    const heure = new Date().toLocaleString("fr-FR", { hour: "numeric", hour12: false, timeZone: "Europe/Madrid" });
    const salut = Number(heure) >= 18 ? "Bonsoir Avishay" : "Bonjour Avishay";
    const resume = [av.length ? `${av.length} contenu${av.length > 1 ? "s" : ""} à valider` : "aucun contenu à valider", bl.length ? `${bl.length} tâche${bl.length > 1 ? "s" : ""} bloquée${bl.length > 1 ? "s" : ""}` : "aucun blocage"].join(" · ");
    const tuiles = `<div class="tuiles">
      <a class="cliquable tuile" href="#valider"><span>À valider</span><strong>${av.length}</strong><small>contenus prêts</small></a>
      <a class="cliquable tuile" href="#equipe"><span>Agents testés</span><strong>${testes}/${ag.length}</strong><small>${ag.filter(a => a.etat === "bloque").length} bloqués</small></a>
      <a class="cliquable tuile" href="#taches" data-filtre-lien="bloquee"><span>Blocages</span><strong>${bl.length}</strong><small>à débloquer</small></a>
      <a class="cliquable tuile" href="#connexions"><span>Connexions</span><strong>${ok}/${cx.length}</strong><small>opérationnelles</small></a></div>`;
    const afaire = bl.map(t => rangeeTache(t)).concat(connexionsAFaire().slice(0, 6).map(c => ouvre("connexion", c.id, `<span class="puce ${puceStatut(c.statut)}"></span><span class="txt"><h3>${esc(c.nom)}</h3><span class="note">${esc(c.action)}</span></span>${pill(c.statut)}${CHEVRON}`, "rangee")));
    const equipe = `<div class="avatars">${ag.map(a => ouvre("agent", a.id, `${avatar(a)}<small>${esc(a.prenom || a.nom)}</small>`, "membre")).join("")}</div>
      <div class="legende-etats"><span>● testé : a déjà produit un vrai résultat</span><span>● bloqué : il lui manque un accès</span><span>● actif : tourne seul (serveur)</span></div>`;
    return `<section><h1>${salut}</h1><p class="intro">${esc(resume)}. ${STATIQUE ? `Données du ${date(E.genere_le)}.` : ""}</p></section>`
      + `<section>${titreSection("Récap du jour", null)}${recapJour()}</section>`
      + `<section>${titreSection("Parler à Victor", null)}${blocConsigne()}</section>`
      + `<section>${tuiles}</section>`
      + `<section>${titreSection("Prochaines publications", pubs().length, `<a class="lien-section" href="#calendrier">Calendrier</a>`)}${pubs().length ? `<div class="liste">${pubs().slice(0, 4).map(x => rangeePub(Object.assign({}, x, { note: jourLong(x.quand) }))).join("")}</div>` : `<p class="vide">Rien de planifié. Victor propose les dates dès qu'un contenu est validé.</p>`}</section>`
      + `<section>${titreSection("À valider", av.length, `<a class="lien-section" href="#valider">Tout voir</a>`)}${av.length ? `<div class="rang-contenus">${av.map(carteContenu).join("")}</div>` : `<p class="vide">Rien à valider pour l'instant.</p>`}</section>`
      + (enModif().length ? `<section>${titreSection("En modification", enModif().length, `<a class="lien-section" href="#valider">Tout voir</a>`)}<div class="liste">${enModif().map(rangeeModif).join("")}</div></section>` : "")
      + `<section>${titreSection("Ce qui attend une action", afaire.length)}<p class="intro">Touche une ligne pour voir le détail et ce qu'il faut faire.</p>${afaire.length ? `<div class="liste">${afaire.join("")}</div>` : `<p class="vide">Rien de bloqué.</p>`}</section>`
      + `<section>${titreSection("L'équipe Immobilier", ag.length, `<a class="lien-section" href="#equipe">Détail</a>`)}${equipe}</section>`

      ;
  }

  // Victor propose un agent d'après les mots de la consigne ; Avishay peut changer le destinataire avant d'envoyer.
  const MOTS = [
    ["voix", /\b(voix|voice|doubl|enregistr|vocal)/i], ["montage", /\b(reel|vid[eé]o|montage|monte|coupe|sous-titr)/i],
    ["design", /\b(carrousel|carousel|visuel|design|couverture|animation|canva|logo)/i], ["editorial", /\b(planning|calendrier|l[eé]gende|script|id[eé]e|th[eè]me|caption)/i],
    ["instagram", /\b(instagram|insta|story|stories|musique|son tendance|publi)/i], ["diffusion", /\b(youtube|tiktok|facebook|shorts)/i],
    ["fiches-biens", /\b(fiche|bien|villa|terrain|propri[eé]t|annonce|AB-\d)/i], ["veille", /\b(march[eé]|chiffre|loi|fiscal|prix au m|statisti|tendance du march)/i],
    ["prospection", /\b(linkedin|prospect|apporteur|family office|chasseur)/i], ["partenaires", /\b(partenaire|agence|commission)/i],
    ["acheteurs", /\b(acheteur|lead|client|visite|rendez-vous|rdv|whatsapp)/i], ["qualite", /\b(relis|relire|v[eé]rifi|qualit|corrig)/i]
  ];
  function suggere(texte) {
    const t = texte || ""; let meilleur = null, n = 0;
    MOTS.forEach(([id, re]) => { const k = (t.match(new RegExp(re.source, "gi")) || []).length; if (k > n && agent(id)) { n = k; meilleur = id; } });
    return meilleur;
  }
  const prenom = id => { const a = agent(id); return a ? (a.prenom || a.nom) : "Victor"; };
  function boutonMicro(champ) {
    return DICT ? `<button type="button" class="btn micro" data-micro="${champ}" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Dicter</span></button>`
      : `<span class="meta">Pour dicter sur iPhone, touche le micro du clavier.</span>`;
  }
  function blocConsigne() {
    const off = actif() ? "" : "disabled", id = "consigne";
    const liste = CONSIGNES.slice(0, 4);
    return `<article class="carte consigne-bloc" data-bloc-consigne="${id}"><label class="meta" for="${id}">${DIRECT ? "Dis ou écris ce que tu veux. Ta consigne m'arrive directement, comme dans la conversation, et je te réponds ici." : "Dis ou écris ce que tu veux. Victor te répond tout de suite, transmet au bon agent et te remonte le résultat ici."}</label>
      <textarea id="${id}" data-consigne placeholder="Exemple : prépare un carrousel sur les quartiers d'Estepona pour la semaine prochaine." ${off}></textarea>
      <span class="meta provisoire" id="${id}-provisoire" hidden></span>
      <span class="meta" id="${id}-propose" aria-live="polite"></span>
      <div class="actions">${boutonMicro(id)}<button class="btn principal" data-envoyer-consigne="${id}" ${off}>Envoyer à Victor</button></div>
      ${liste.length ? `<div class="liste">${liste.map(rangeeConsigne).join("")}</div>` : ""}</article>`;
  }
  const destinataire = k => k.pour || k.propose || "coordination";
  function rangeeConsigne(k) {
    const r = (k.reponses || []).filter(x => x.de !== "avishay").slice(-1)[0];
    return ouvre("consigne", k._id, `<span class="puce ${k.statut === "question" ? "warn" : k.statut === "traitee" ? "" : "test"}"></span><span class="txt"><h3>${esc(k.texte)}</h3><span class="meta"><span>${destinataire(k) === "coordination" ? "Victor" : `Victor → <b>${esc(prenom(destinataire(k)))}</b>`}</span><span>${date(k.quand)}</span></span>${r ? `<span class="note">${esc(prenom(r.de))} : ${esc(r.texte)}</span>` : `<span class="note">En attente de réponse…</span>`}</span>${pill(k.statut || "recue")}${CHEVRON}`, "rangee");
  }
  function ficheConsigne(k) {
    const qui = destinataire(k), a = agent(qui);
    const fil = [{ de: "avishay", texte: k.texte, quand: k.quand, canal: k.canal }].concat(k.reponses || []);
    const off = actif() ? "" : "disabled";
    return {
      titre: "Échange avec Victor", sous: qui !== "coordination" ? `Transmis à ${prenom(qui)} (${a ? a.nom : qui})` : "Coordination", avatar: agent("coordination"),
      corps: `<div class="actions">${pill(k.statut || "recue")}</div>

  async function brancherBase() {

    window.claude.use("dictation").then(d => { if (d) brancherDictee(d); }).catch(() => {});
    if (!STATIQUE) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      window.claude.use("sample").then(x => { SAMPLE = x; }).catch(() => {});
      window.claude.use("comments").then(async c => { COMMENTS = c; await verifierDirect(); }).catch(() => {});
      if (!db) return;
      DB = db;
      PEUT_ECRIRE = user ? (user.can ? (await user.can("data.write")) !== false : true) && (user.canEdit ? await user.canEdit() : true) : false;
      const minuteur = setTimeout(() => toast("La base ne répond pas encore : les décisions affichées peuvent dater."), 10000);
      DB.collection("decisions").onSnapshot(snap => {
        clearTimeout(minuteur);
        Object.keys(DECISIONS).forEach(k => delete DECISIONS[k]);

      ouvrirFiche("consigne", docId);
      if (await direct) {
        await DB.doc("consignes/" + docId).update({ direct: true, reponses: [{ de: "coordination", texte: "Reçu. Je m'en occupe maintenant et je te réponds ici.", quand: new Date().toISOString(), auto: true }] });
        toast("Consigne envoyée. Victor s'en occupe tout de suite.");
      } else { toast("Consigne envoyée à Victor."); reponseAgent(docId); }
    }
    catch (e) { toast("Échec de l'envoi de la consigne. Réessaie dans un instant."); }
  }


  // ---------- Mode serveur ----------
  async function charger() {
    if (STATIQUE) return rendre();
    try { const r = await fetch("/api/etat", { cache: "no-store" }); E = await r.json(); rendre(); rafraichirFiche(); }
    catch (e) { document.getElementById("vue-principale").innerHTML = `<div class="bandeau alerte">Le service ne répond pas. Vérifie qu'il tourne sur le serveur.</div>`; }
  }
  async function poster(url, corps) {
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps || {}) });
      const d = await r.json(); toast(d.message || (r.ok ? "Fait." : "Refusé.")); await charger();
    } catch (e) { toast("Échec de l'envoi : le service ne répond pas."); }
  }

  // ---------- Clics ----------
  const fiche = document.getElementById("fiche");
  fiche.addEventListener("close", () => { fiche.querySelectorAll("video").forEach(v => v.pause()); fiche._courant = null; PILE.length = 0; });
  fiche.addEventListener("click", ev => { if (ev.target === fiche) fiche.close(); });
  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-fiche],[data-fermer],[data-retour],[data-filtre],[data-filtre-lien],[data-valider],[data-ouvrir-modif],[data-envoyer],[data-reprendre],[data-envoyer-consigne],[data-micro],[data-repondre]");
    if (!el) return;
    if (el.dataset.fiche) { ev.preventDefault(); return ouvrirFiche(el.dataset.fiche, el.dataset.id); }
    if (el.hasAttribute("data-fermer")) return fiche.close();
    if (el.hasAttribute("data-retour")) { const p = PILE.pop(); if (p) afficherFiche(p.type, p.id); return; }
    if (el.dataset.filtreLien) { filtres.taches = el.dataset.filtreLien; return; }
    if (el.dataset.filtre) { filtres.taches = el.dataset.filtre; return rendre(); }
    if (el.hasAttribute("data-ouvrir-modif")) { const f = document.getElementById("form-modif"); if (f) { f.hidden = !f.hidden; if (!f.hidden) { f.querySelector("textarea").focus(); if (DICT && !DICT.active()) basculerDictee("modif-texte"); } } return; }
    if (el.dataset.micro) return basculerDictee(el.dataset.micro);
    if (el.dataset.repondre) { if (!DB || !PEUT_ECRIRE) return; return repondreConsigne(el.dataset.repondre); }
    if (el.dataset.envoyerConsigne) { if (STATIQUE && (!DB || !PEUT_ECRIRE)) return; return consigneBase(el.dataset.envoyerConsigne); }
    if (STATIQUE) {
      if (!DB || !PEUT_ECRIRE) return;
      if (el.dataset.valider) return deciderBase(el.dataset.valider, "valide");
      if (el.dataset.envoyer) { if (DICT && DICT.active()) DICT.stop().catch(() => {}); const tx = document.getElementById("modif-texte").value.trim(); if (!tx) return toast("Écris ce qu'il faut changer."); return deciderBase(el.dataset.envoyer, "modification", tx); }
      return;
    }
    if (el.dataset.valider) return poster(`/api/contenus/${encodeURIComponent(el.dataset.valider)}/valider`);
    if (el.dataset.envoyer) return poster(`/api/contenus/${encodeURIComponent(el.dataset.envoyer)}/modifier`, { texte: document.getElementById("modif-texte").value });
    if (el.dataset.reprendre) return poster(`/api/taches/${encodeURIComponent(el.dataset.reprendre)}/reprendre`);
  });
  function basculerDictee(champ) {
    if (!DICT) return;
    if (DICT.active()) { DICT.stop().catch(() => {}); return; }
    CIBLE_DICTEE = champ;
    DICT.start().catch(e => {
      if (e.code === "not_granted") toast("Micro refusé pour cette page. Tu peux toujours écrire, ou l'autoriser dans le menu Autorisations.");
      else if (e.code === "unavailable") { toast("La dictée n'est pas disponible ici. Écris la consigne."); DICT = null; rendre(); }
      else if (e.code !== "stopped" && e.code !== "dismissed") toast("La dictée n'a pas démarré. Réessaie.");
    });
  }
  function brancherDictee(d) {
    DICT = d;
    d.onFinal(({ text }) => { const tx = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE); if (!tx) return; tx.value = tx.value ? tx.value + text : text.replace(/^\s+/, ""); tx.dataset.dicte = "1"; majProposition(CIBLE_DICTEE); });
    d.onPartial(({ text }) => { const p = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE + "-provisoire"); if (p) { p.hidden = !text; p.textContent = text; } });
    d.onState(({ state }) => {
      document.querySelectorAll("[data-micro]").forEach(b => { const on = state !== "idle" && b.dataset.micro === CIBLE_DICTEE; b.setAttribute("aria-pressed", on); b.querySelector("span").textContent = on ? (state === "finishing" ? "Je termine…" : "J'écoute… touche pour arrêter") : "Dicter"; });
      if (state === "idle") { const p = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE + "-provisoire"); if (p) p.hidden = true; }
    });
    rendre();
  }
  document.addEventListener("input", ev => { if (ev.target.matches("[data-consigne]")) majProposition(ev.target.id); });
  document.addEventListener("change", ev => { if (ev.target.id && ev.target.id.endsWith("-pour")) majProposition(ev.target.id.slice(0, -5)); });
  window.addEventListener("hashchange", () => { if (fiche.open) fiche.close(); rendre(); window.scrollTo(0, 0); });
  charger();
  brancherBase();
  // Mode serveur : rafraîchit toutes les 30 s, sauf pendant une saisie
  if (!STATIQUE) setInterval(() => { if (![...document.querySelectorAll("textarea")].some(t => t.value)) charger(); }, 30000);
})();
</script>
