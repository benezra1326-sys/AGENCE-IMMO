<title>Back-office Avishay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une colonne lisible sur téléphone, barre d'onglets collante, sections empilées ; l'état réel avant le détail. */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --fg: #16201c; --muted: #5a6761; --line: #d9dfdb; --accent: #1e5a48; --accent-soft: #e3efe9;
  --ok: #2c7a4b; --ok-bg: #e2f2e7; --info: #2f5f9e; --info-bg: #e4ecf7; --warn: #9a5b00; --warn-bg: #fbeed6;
  --bad: #b42f2f; --bad-bg: #f8e1df; --idle: #66706b; --idle-bg: #eceeed; --test: #6a4aa0; --test-bg: #ece6f6;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --fg: #e6ece9; --muted: #98a59f; --line: #29342f; --accent: #74c4a8; --accent-soft: #1c2d27;
  --ok: #7fd19c; --ok-bg: #173022; --info: #8fb6ec; --info-bg: #182740; --warn: #f0b860; --warn-bg: #352712;
  --bad: #f08c84; --bad-bg: #3a1a18; --idle: #a3ada8; --idle-bg: #232b28; --test: #b9a2e6; --test-bg: #2a2140; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --fg: #e6ece9; --muted: #98a59f; --line: #29342f; --accent: #74c4a8; --accent-soft: #1c2d27;
  --ok: #7fd19c; --ok-bg: #173022; --info: #8fb6ec; --info-bg: #182740; --warn: #f0b860; --warn-bg: #352712;
  --bad: #f08c84; --bad-bg: #3a1a18; --idle: #a3ada8; --idle-bg: #232b28; --test: #b9a2e6; --test-bg: #2a2140; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
header.top .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 12px 0 }
.marque { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.marque h1 { font: 600 1.2rem/1.2 var(--f-display); margin: 0; letter-spacing: .01em }
.marque small { color: var(--muted); font-size: .8rem }
nav.onglets { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px }
nav.onglets a { flex: none; padding: 8px 10px 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: .92rem; border-bottom: 2px solid transparent }
nav.onglets a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent) }
nav.onglets a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.bandeau { margin-block: 14px 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: .88rem; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent) }
main { display: flex; flex-direction: column; gap: 28px; padding-block: 18px 48px }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
h2 { font: 600 1.05rem/1.25 var(--f-display); margin: 0; text-wrap: balance; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
h2 .compte { font: 500 .78rem var(--f-mono); color: var(--muted) }
.intro { color: var(--muted); margin: 0; max-width: 65ch; font-size: .9rem }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.carte h3 { font: 600 .98rem/1.3 var(--f-body); margin: 0; overflow-wrap: anywhere }
.ligne { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 12px }
.meta b { color: var(--fg); font-weight: 500 }
.note { font-size: .86rem; margin: 0; overflow-wrap: anywhere }
.mono { font-family: var(--f-mono); font-size: .78rem }
.pastille { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; letter-spacing: .02em }
.pastille::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-prevu, .s-en_attente, .s-a_configurer, .s-liste_preparee, .s-brouillon, .s-en_preparation { color: var(--idle); background: var(--idle-bg) }
.s-configure, .s-en_cours, .s-partiel, .s-a_verifier, .s-en_lancement { color: var(--info); background: var(--info-bg) }
.s-teste, .s-a_valider, .s-preparee { color: var(--test); background: var(--test-bg) }
.s-actif, .s-terminee, .s-operationnel, .s-valide, .s-envoyee, .s-publie { color: var(--ok); background: var(--ok-bg) }
.s-bloque, .s-bloquee, .s-modification_demandee, .s-manquant { color: var(--warn); background: var(--warn-bg) }
.s-echec, .s-appel_demande { color: var(--bad); background: var(--bad-bg) }
.resume { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.chiffre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.chiffre span { display: block; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em }
.chiffre strong { font: 600 1.4rem/1.2 var(--f-display); font-variant-numeric: tabular-nums }
.activite { border-left: 3px solid var(--line) }
.activite.immo { border-left-color: var(--accent) }
.barre { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--idle-bg) }
.barre i { display: block; height: 100% }
.filtres { display: flex; gap: 6px; flex-wrap: wrap }
.filtres button, .btn { font: 500 .84rem var(--f-body); padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.filtres button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.btn.principal { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn:disabled { opacity: .5; cursor: not-allowed }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px }
textarea { width: 100%; min-height: 70px; font: inherit; padding: 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg) }
.fichiers { margin: 0; padding-left: 18px; font-size: .82rem; overflow-wrap: anywhere }
.fichiers a { color: var(--accent) }
.echec { color: var(--bad); font-size: .84rem; margin: 0 }
.vide { color: var(--muted); font-size: .9rem; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; margin: 0 }
.tableau { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .84rem }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { color: var(--muted); font-weight: 500; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap }
tr:last-child td { border-bottom: 0 }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px }
details summary { cursor: pointer; font-weight: 500 }
.histo { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .84rem }
.histo li { border-left: 2px solid var(--line); padding-left: 10px }
.sous-nav { display: flex; gap: 6px; flex-wrap: wrap }
.sous-nav a { font-size: .8rem; color: var(--accent); text-decoration: none; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .88rem; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .carte { transition: border-color .15s } .carte:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)) } }
</style>

<header class="top">
  <div class="wrap">
    <div class="marque"><h1>Back-office Avishay</h1><small id="genere"></small></div>
    <nav class="onglets" id="onglets" aria-label="Espaces">
      <a href="#vue">Vue générale</a><a href="#immo">Immobilier</a><a href="#apps">Applications</a><a href="#reseaux">Réseaux</a><a href="#connexions">Connexions</a><a href="#journal">Historique</a>
    </nav>
  </div>
</header>
<div class="wrap"><div class="bandeau" id="bandeau">Chargement…</div></div>
<main class="wrap" id="vue-principale"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const STATIQUE = !!window.__ETAT__;
  let E = window.__ETAT__ || null;
  const filtres = { taches: "toutes" };
  const LIB = {
    prevu: "prévu", configure: "configuré", teste: "testé", actif: "actif", bloque: "bloqué",
    en_attente: "en attente", en_cours: "en cours", terminee: "terminée", echec: "échec", bloquee: "bloquée",
    a_valider: "à valider", modification_demandee: "modification demandée", valide: "validé", publie: "publié", remplace: "remplacé",
    brouillon: "brouillon", en_preparation: "en préparation", operationnel: "opérationnel", partiel: "partiel",
    manquant: "manquant", a_verifier: "à vérifier", a_configurer: "à configurer", en_lancement: "en lancement",
    liste_preparee: "liste préparée", preparee: "préparée", envoyee: "envoyée", nouveau: "nouveau", appel_demande: "appel demandé"
  };
  const COTE = { serveur: "serveur (Mac éteint)", claude: "session Claude seulement", telephone: "téléphone", mac: "Mac seulement" };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pill = s => `<span class="pastille s-${esc(s)}">${esc(LIB[s] || s)}</span>`;
  const date = s => s ? new Date(s).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }) : "—";
  const jour = s => s ? new Date(s + (s.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short", timeZone: "Europe/Madrid" }) : "sans date";
  const eur = n => (Number(n) || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
  const nomAgent = id => { const a = E.agents.find(x => x.id === id); return a ? (a.prenom ? `${a.prenom} · ${a.nom}` : a.nom) : id; };

  function lienFichier(x) {
    const f = typeof x === "string" ? x : x.chemin, lib = typeof x === "string" ? x : x.libelle;
    if (/^https?:\/\//.test(f)) return `<a href="${esc(f)}" target="_blank" rel="noopener">${esc(lib)}</a>`;
    if (f.startsWith("/")) return `${esc(lib.split("/").pop())} <span class="meta">(stockage du projet, hors dépôt)</span>`;
    return STATIQUE ? `${esc(lib)} <span class="meta">(dépôt)</span>` : `<a href="/fichiers/${esc(f)}" target="_blank" rel="noopener">${esc(lib)}</a>`;
  }

  function carteTache(t) {
    const fichiers = (t.fichiers || []).length ? `<ul class="fichiers">${t.fichiers.map(f => `<li>${lienFichier(f)}</li>`).join("")}</ul>` : "";
    const reprise = (t.statut === "echec" || t.statut === "bloquee") && t.origine !== "depot" ? `<div class="actions"><button class="btn" data-reprendre="${esc(t.id)}" ${STATIQUE ? "disabled" : ""}>Relancer</button></div>` : "";
    return `<article class="carte">
      <div class="ligne"><h3>${esc(t.titre)}</h3>${pill(t.statut)}</div>
      <div class="meta"><span>Responsable <b>${esc(nomAgent(t.agent))}</b></span><span>Mis à jour <b>${date(t.maj_le)}</b></span>
        <span>Coût <b>${eur(t.cout_eur)}</b></span>${t.tentatives ? `<span>Essais <b>${t.tentatives}/${t.max_tentatives}</b></span>` : ""}</div>
      ${t.source ? `<p class="note"><span class="meta">Source :</span> ${esc(t.source)}</p>` : ""}
      ${t.resultat ? `<p class="note">${esc(t.resultat)}</p>` : ""}
      ${t.raison_echec ? `<p class="echec">Raison : ${esc(t.raison_echec)}</p>` : ""}
      ${fichiers}${reprise}
      <span class="mono meta">${esc(t.id)} · ${esc(t.origine === "depot" ? "écrit dans le dépôt" : "créé par le serveur")}</span>
    </article>`;
  }

  function carteAgent(a) {
    const n = a.taches || {};
    return `<article class="carte">
      <div class="ligne"><h3>${a.prenom ? `${esc(a.prenom)} <span class="meta">${esc(a.nom)}</span>` : esc(a.nom)}</h3>${pill(a.etat)}</div>
      ${a.prenom && !a.prenom_valide ? `<p class="note meta">Prénom proposé, à valider par toi.</p>` : ""}
      <div class="meta"><span>Exécution <b>${esc(a.execution || "—")}</b></span></div>
      ${a.roles ? `<p class="note">${esc(a.roles.join(" · "))}</p>` : ""}
      ${a.note ? `<p class="note meta">${esc(a.note)}</p>` : ""}
      ${a.preuve ? `<p class="note meta">Preuve : ${esc(a.preuve)} (état déclaré : ${esc(LIB[a.etat_declare])})</p>` : ""}
      <div class="meta"><span>${n.en_attente || 0} en attente</span><span>${n.en_cours || 0} en cours</span><span>${n.terminee || 0} terminées</span><span>${(n.echec || 0) + (n.bloquee || 0)} en échec ou bloquées</span></div>
    </article>`;
  }

  function carteContenu(c) {
    const editable = c.statut === "a_valider" || c.statut === "modification_demandee";
    const retours = (c.retours || []).map(r => `<li>${date(r.cree_le)} · ${r.decision === "valide" ? "validé" : "modification : " + esc(r.texte)} (${esc(r.canal)})</li>`).join("");
    return `<article class="carte" id="contenu-${esc(c.id)}">
      <div class="ligne"><h3>${esc(c.titre)}</h3>${pill(c.statut)}</div>
      <div class="meta"><span>Format <b>${esc(c.format || "—")}</b></span><span>Langue <b>${esc((c.langue || "—").toUpperCase())}</b></span>
        <span>Date prévue <b>${c.date_prevue ? jour(c.date_prevue) : "à fixer"}</b></span>${c.bien ? `<span>Bien <b>${esc(c.bien)}</b></span>` : ""}</div>
      ${(c.fichiers || []).length ? `<ul class="fichiers">${c.fichiers.map(f => `<li>${lienFichier(f)}</li>`).join("")}</ul>` : ""}
      ${retours ? `<ul class="histo">${retours}</ul>` : ""}
      ${editable ? `<div class="actions"><button class="btn principal" data-valider="${esc(c.id)}" ${STATIQUE ? "disabled" : ""}>Valider</button>
        <button class="btn" data-ouvrir="${esc(c.id)}" ${STATIQUE ? "disabled" : ""}>Demander une modification</button></div>
        <div data-form="${esc(c.id)}" hidden><label class="meta" for="modif-${esc(c.id)}">Ce qu'il faut changer</label>
        <textarea id="modif-${esc(c.id)}"></textarea><div class="actions"><button class="btn principal" data-envoyer="${esc(c.id)}">Envoyer la demande</button></div></div>` : ""}
    </article>`;
  }

  function section(id, titre, compte, intro, corps) {
    return `<section id="${id}"><h2>${titre}${compte !== null ? `<span class="compte">${compte}</span>` : ""}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${corps}</section>`;
  }
  const grille = (items, f, vide) => items.length ? `<div class="grille">${items.map(f).join("")}</div>` : `<p class="vide">${vide}</p>`;

  function vueGenerale() {
    const t = E.taches, c = E.connexions.connexions || [];
    const comptes = s => t.filter(x => x.statut === s).length;
    const ok = c.filter(x => x.statut === "operationnel").length;
    const resume = `<div class="resume">
      <div class="chiffre"><span>Contenus à valider</span><strong>${E.contenus.filter(x => x.statut === "a_valider").length}</strong></div>
      <div class="chiffre"><span>Tâches ouvertes</span><strong>${comptes("en_attente") + comptes("en_cours")}</strong></div>
      <div class="chiffre"><span>Échecs et blocages</span><strong>${comptes("echec") + comptes("bloquee")}</strong></div>
      <div class="chiffre"><span>Prospects</span><strong>${E.prospects.length}</strong></div>
      <div class="chiffre"><span>Connexions opérationnelles</span><strong>${ok}/${c.length}</strong></div>
      <div class="chiffre"><span>Coûts du mois</span><strong>${eur(E.couts.mois_eur)}</strong></div></div>`;
    const acts = E.activites.map(a => {
      const ta = t.filter(x => x.activite === a.id), ag = E.agents.filter(x => x.activite === a.id);
      const parEtat = ["actif", "teste", "configure", "prevu", "bloque"].map(s => [s, ag.filter(x => x.etat === s).length]);
      const couleurs = { actif: "var(--ok)", teste: "var(--test)", configure: "var(--info)", prevu: "var(--idle)", bloque: "var(--warn)" };
      const barre = ag.length ? `<div class="barre" role="img" aria-label="Répartition des états des agents">${parEtat.map(([s, n]) => n ? `<i style="width:${100 * n / ag.length}%;background:${couleurs[s]}" title="${LIB[s]} : ${n}"></i>` : "").join("")}</div>
        <div class="meta">${parEtat.filter(([, n]) => n).map(([s, n]) => `<span>${n} ${LIB[s]}</span>`).join("")}</div>` : "";
      return `<article class="carte activite ${esc(a.id)}"><div class="ligne"><h3>${esc(a.nom)}</h3>${pill(a.etat)}</div>
        <p class="note">${esc(a.mission)}</p>${barre}
        <div class="meta"><span>${ag.length} agents</span><span>${ta.filter(x => x.statut !== "terminee").length} tâches ouvertes</span><span>${ta.filter(x => x.statut === "terminee").length} terminées</span></div>
        <div class="actions"><a class="btn" href="#${esc(a.id)}">Ouvrir l'espace</a></div></article>`;
    }).join("");
    const m = E.maitre || {};
    const decisions = E.contenus.filter(x => x.statut === "a_valider").map(x => `<li><a href="#immo" data-aller="contenu-${esc(x.id)}">${esc(x.titre)}</a> : à valider</li>`)
      .concat(t.filter(x => x.statut === "bloquee" || x.statut === "echec").map(x => `<li>${esc(x.titre)} : ${esc(x.raison_echec || "bloquée")}</li>`));
    return section("resume", "Aujourd'hui", null, "", resume)
      + section("maitre", "Agent maître", null, "", `<article class="carte"><div class="ligne"><h3>${esc(m.nom)}</h3>${pill(m.etat)}</div><p class="note">${esc(m.mission)}</p><p class="note meta">${esc(m.note)}</p></article>`)
      + section("activites", "Les trois activités", null, "", `<div class="grille">${acts}</div>`)
      + section("decisions", "À traiter par toi", decisions.length, "", decisions.length ? `<article class="carte"><ul class="histo">${decisions.join("")}</ul></article>` : `<p class="vide">Rien en attente.</p>`);
  }

  function vueImmo() {
    const ag = E.agents.filter(a => a.activite === "immo");
    const t = E.taches.filter(x => x.activite === "immo");
    const ft = filtres.taches === "toutes" ? t : t.filter(x => x.statut === filtres.taches);
    const boutons = ["toutes", "en_attente", "en_cours", "terminee", "echec", "bloquee"].map(s =>
      `<button data-filtre="${s}" aria-pressed="${filtres.taches === s}">${s === "toutes" ? "toutes" : LIB[s]} (${s === "toutes" ? t.length : t.filter(x => x.statut === s).length})</button>`).join("");
    const contenus = E.contenus.filter(c => c.activite === "immo");
    const parJour = {};
    contenus.forEach(c => { const k = c.date_prevue || "~"; (parJour[k] = parJour[k] || []).push(c); });
    const cal = Object.keys(parJour).sort().map(k => `<tr><td>${k === "~" ? "à planifier" : jour(k)}</td><td>${parJour[k].map(c => `${esc(c.titre)} ${pill(c.statut)}`).join("<br>")}</td><td>${parJour[k].map(c => esc(c.format || "")).join("<br>")}</td></tr>`).join("");
    const biens = E.biens.map(b => `<article class="carte"><div class="ligne"><h3><span class="mono">${esc(b.ref)}</span> <span class="meta">${esc(b.type || "")}</span></h3>${pill(b.prix && b.prix.verifie ? "valide" : "a_verifier")}</div>
      <div class="meta"><span>Zone <b>${esc(b.zone)}</b></span><span>Prix <b>${b.prix && b.prix.verifie && b.prix.montant ? eur(b.prix.montant) : "à confirmer"}</b></span><span>Disponibilité <b>${b.disponibilite_verifiee ? "vérifiée" : "à confirmer"}</b></span></div>
      <div class="meta"><span>Publier les médias <b>${esc(LIB[b.autorisation_medias] || b.autorisation_medias)}</b></span><span>Tournage <b>${esc((b.autorisation_tournage || "").replace("a_demander", "à demander"))}</b></span></div>
      ${b.caracteristiques ? `<p class="note">${Object.entries(b.caracteristiques).map(([k, v]) => `${esc(k.replace(/_/g, " "))} : ${esc(v)}`).join(" · ")}</p>` : ""}
      <p class="note meta">Source : ${esc(b.source_caracteristiques || "—")} (${esc(b.date_caracteristiques || "?")})${b.caracteristiques_recoupees === false ? " · non recoupé" : ""}</p>
      ${(b.restrictions || []).length ? `<ul class="fichiers">${b.restrictions.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}</article>`);
    const prospects = E.prospects.map(p => `<details><summary>${esc(p.nom || p.id)} ${p.fictif ? '<span class="mono meta">[fictif]</span>' : ""} ${pill(p.appel_demande ? "appel_demande" : p.statut)}</summary>
      <div class="meta"><span>Source <b>${esc(p.source)}</b></span><span>Pays <b>${esc(p.pays || "?")}</b></span><span>Langue <b>${esc(p.langue || "?")}</b></span><span>Budget <b>${esc(p.budget || "?")}</b></span><span>Zone <b>${esc(p.zone || "?")}</b></span><span>Projet <b>${esc((p.projet || "?").replace(/_/g, " "))}</b></span><span>Délai <b>${esc(p.delai || "?")}</b></span></div>
      <ul class="histo">${p.historique.map(h => `<li>${date(h.cree_le)} · ${esc(h.canal)} · ${esc(h.texte)}</li>`).join("")}</ul>
      <p class="note meta">Alertes : ${p.alertes.map(a => `${esc(a.type.replace(/_/g, " "))} ${esc(a.canal)} (${esc(LIB[a.statut])})`).join(", ") || "aucune"}</p></details>`).join("");
    const partenaires = E.partenaires.length ? `<div class="tableau"><table><thead><tr><th>Société</th><th>Ville</th><th>Type</th><th>Personne</th><th>Statut</th></tr></thead><tbody>${E.partenaires.map(p => `<tr><td>${esc(p.societe)}</td><td>${esc(p.ville)}</td><td>${esc(p.type)}</td><td>${esc(p.personne)}</td><td>${pill(p.statut)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="vide">Aucun partenaire pour l'instant. Ajoute-les ici dès que tu travailles avec une agence ou un apporteur.</p>`;
    const M = (E.marche && E.marche.chiffres) || [];
    const marche = M.length ? `<div class="tableau"><table><thead><tr><th>Zone</th><th>Indicateur</th><th>Valeur</th><th>Période</th><th>Source</th></tr></thead><tbody>${M.map(m => `<tr><td>${esc(m.zone)}</td><td>${esc(m.indicateur)}</td><td><b>${esc(m.valeur)}</b></td><td>${esc(m.periode)}</td><td>${/^https:\/\//.test(m.url || "") ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.source)}</a>` : esc(m.source)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="vide">Aucun chiffre sourcé.</p>`;
    const alertes = E.alertes.length ? `<div class="tableau"><table><thead><tr><th>Préparée</th><th>Type</th><th>Canal</th><th>Statut</th><th>Contenu</th></tr></thead><tbody>${E.alertes.map(a => `<tr><td>${date(a.cree_le)}</td><td>${esc(a.type.replace(/_/g, " "))}</td><td>${esc(a.canal)}${a.destinataire ? "<br><span class=\"meta\">" + esc(a.destinataire) + "</span>" : ""}</td><td>${pill(a.statut)}</td><td style="white-space:pre-wrap;min-width:240px">${esc(a.corps)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="vide">Aucune alerte préparée.</p>`;
    const couts = `<div class="resume"><div class="chiffre"><span>24 dernières heures</span><strong>${eur(E.couts.jour_eur)}</strong></div><div class="chiffre"><span>Mois en cours</span><strong>${eur(E.couts.mois_eur)}</strong></div></div>`
      + (E.erreurs.length ? `<div class="tableau"><table><thead><tr><th>Quand</th><th>Qui</th><th>Erreur</th><th>Détail</th></tr></thead><tbody>${E.erreurs.map(e => `<tr><td>${date(e.quand)}</td><td>${esc(e.acteur)}</td><td>${esc(e.action)}</td><td>${esc(e.details || e.objet || "")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="vide">Aucune erreur enregistrée.</p>`);
    const consigne = `<article class="carte"><label class="meta" for="consigne">Nouvelle consigne pour la coordination Immo</label><textarea id="consigne" ${STATIQUE ? "disabled" : ""}></textarea><div class="actions"><button class="btn principal" id="envoyer-consigne" ${STATIQUE ? "disabled" : ""}>Enregistrer la consigne</button></div></article>`;
    const nav = `<nav class="sous-nav" aria-label="Sections Immobilier">${[["valider", "À valider"], ["calendrier", "Calendrier"], ["taches", "Tâches"], ["agents", "Agents"], ["biens", "Biens"], ["prospects", "Acheteurs"], ["partenaires", "Partenaires B2B"], ["marche", "Marché"], ["alertes", "Alertes"], ["couts", "Coûts et erreurs"]].map(([i, l]) => `<a href="#immo" data-aller="${i}">${l}</a>`).join("")}</nav>`;
    return nav
      + section("valider", "Contenus à valider", contenus.filter(c => c.statut === "a_valider").length, "Valider ne publie rien : la publication automatique n'est pas activée.", grille(contenus.filter(c => ["a_valider", "modification_demandee", "valide", "en_preparation"].includes(c.statut)), carteContenu, "Aucun contenu."))
      + section("calendrier", "Calendrier éditorial", null, "", cal ? `<div class="tableau"><table><thead><tr><th>Date</th><th>Contenu</th><th>Format</th></tr></thead><tbody>${cal}</tbody></table></div>` : `<p class="vide">Aucun contenu planifié.</p>`)
      + section("taches", "Tâches", t.length, "", `<div class="filtres">${boutons}</div>` + grille(ft, carteTache, "Aucune tâche dans cette catégorie.") + consigne)
      + section("agents", "Agents et responsabilités", ag.length, "Un agent n'est « actif » que s'il tourne seul sur le serveur. Aucun ne l'est encore.", grille(ag, carteAgent, ""))
      + section("biens", "Biens et droits", E.biens.length, "Zone uniquement, jamais l'adresse. Prix publié seulement après vérification.", E.biens.length ? `<div class="grille">${biens.join("")}</div>` : `<p class="vide">Aucune fiche bien.</p>`)
      + section("prospects", "Acheteurs", E.prospects.length, "", prospects || `<p class="vide">Aucun prospect.</p>`)
      + section("partenaires", "Partenaires B2B", E.partenaires.length, "Seulement les partenaires avec qui tu travailles déjà.", partenaires)
      + section("marche", "Marché (chiffres sourcés)", M.length, "Prix demandés (annonces) et prix signés (notaires) sont deux mesures différentes. À revérifier avant publication." + (E.marche && E.marche.maj_le ? " Mis à jour le " + esc(E.marche.maj_le) + "." : ""), marche)
      + section("alertes", "Alertes Telegram et email", E.alertes.length, E.mode_envoi === "reel" ? "" : "Mode test : les alertes sont préparées, aucune n'est envoyée.", alertes)
      + section("couts", "Coûts et erreurs", null, "", couts);
  }

  function vueAConfigurer(id) {
    const a = E.activites.find(x => x.id === id) || {};
    return section(id, esc(a.nom), null, "", `<article class="carte activite"><div class="ligne"><h3>${esc(a.nom)}</h3>${pill(a.etat)}</div><p class="note">${esc(a.mission)}</p><p class="note meta">Espace prêt à recevoir ses agents, tâches et résultats. Rien n'y tourne.</p></article>`);
  }

  function vueConnexions() {
    const c = E.connexions.connexions || [];
    const ordre = { operationnel: 0, partiel: 1, a_verifier: 2, manquant: 3 };
    return section("connexions", "Connexions", c.length, `Vérifiées le ${esc(E.connexions.verifie_le)}. « Serveur » signifie utilisable Mac éteint.`,
      `<div class="tableau"><table><thead><tr><th>Connexion</th><th>Statut</th><th>Où</th><th>Détail</th><th>À faire</th></tr></thead><tbody>${[...c].sort((a, b) => ordre[a.statut] - ordre[b.statut]).map(x => `<tr><td>${esc(x.nom)}</td><td>${pill(x.statut)}</td><td>${esc(COTE[x.cote] || x.cote)}</td><td>${esc(x.note || "")}</td><td>${esc(x.action || "")}</td></tr>`).join("")}</tbody></table></div>`);
  }

  function vueJournal() {
    return section("journal", "Historique des échanges et actions", E.journal.length, "", E.journal.length ? `<div class="tableau"><table><thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Objet</th><th>Détail</th></tr></thead><tbody>${E.journal.map(j => `<tr><td>${date(j.quand)}</td><td>${esc(j.acteur)}</td><td>${j.niveau === "erreur" ? pill("echec") + " " : ""}${esc(j.action)}</td><td class="mono">${esc(j.objet || "")}</td><td>${esc(j.details || "")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="vide">Aucune action enregistrée.</p>`);
  }

  function rendre() {
    if (!E) return;
    const vue = (location.hash || "#vue").slice(1);
    document.querySelectorAll("#onglets a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + vue ? "page" : "false"));
    const m = document.getElementById("vue-principale");
    m.innerHTML = vue === "immo" ? vueImmo() : vue === "apps" || vue === "reseaux" ? vueAConfigurer(vue) : vue === "connexions" ? vueConnexions() : vue === "journal" ? vueJournal() : vueGenerale();
    document.getElementById("genere").textContent = "État au " + date(E.genere_le);
    const b = document.getElementById("bandeau");
    b.textContent = STATIQUE
      ? "Aperçu figé des données du " + date(E.genere_le) + ". Aucun service ne tourne derrière cette page : les boutons sont désactivés. Le prospect affiché est fictif."
      : (E.mode_envoi === "reel" ? "Service actif, envois réels." : "Service en mode test : alertes préparées, rien n'est envoyé.")
        + (E.service.telegram ? "" : " Bot Telegram non configuré.") + (E.service.email ? "" : " Email non configuré.");
  }

  function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 3500); }

  async function charger() {
    if (STATIQUE) return rendre();
    try { const r = await fetch("/api/etat", { cache: "no-store" }); E = await r.json(); rendre(); }
    catch (e) { document.getElementById("bandeau").textContent = "Le service ne répond pas. Vérifie qu'il tourne sur le serveur."; }
  }
  async function poster(url, corps) {
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps || {}) });
      const d = await r.json(); toast(d.message || (r.ok ? "Fait." : "Refusé.")); await charger();
    } catch (e) { toast("Échec de l'envoi : le service ne répond pas."); }
  }

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-filtre],[data-valider],[data-ouvrir],[data-envoyer],[data-reprendre],[data-aller],#envoyer-consigne");
    if (!el) return;
    if (el.dataset.aller) { ev.preventDefault(); if (location.hash !== "#immo") { location.hash = "immo"; rendre(); } const c = document.getElementById(el.dataset.aller); if (c) c.scrollIntoView({ block: "start" }); return; }
    if (el.dataset.filtre) { filtres.taches = el.dataset.filtre; rendre(); document.getElementById("taches").scrollIntoView({ block: "start" }); return; }
    if (STATIQUE) return;
    if (el.dataset.valider) return poster(`/api/contenus/${encodeURIComponent(el.dataset.valider)}/valider`);
    if (el.dataset.ouvrir) { const f = document.querySelector(`[data-form="${CSS.escape(el.dataset.ouvrir)}"]`); f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus(); return; }
    if (el.dataset.envoyer) { const tx = document.getElementById("modif-" + el.dataset.envoyer).value; return poster(`/api/contenus/${encodeURIComponent(el.dataset.envoyer)}/modifier`, { texte: tx }); }
    if (el.dataset.reprendre) return poster(`/api/taches/${encodeURIComponent(el.dataset.reprendre)}/reprendre`);
    if (el.id === "envoyer-consigne") return poster("/api/consigne", { texte: document.getElementById("consigne").value });
  });
  window.addEventListener("hashchange", rendre);
  charger();
  // Rafraîchit toutes les 30 s, sauf pendant la saisie d'une consigne ou d'une demande de modification
  if (!STATIQUE) setInterval(() => { const a = document.activeElement; if (!(a && a.tagName === "TEXTAREA") && ![...document.querySelectorAll("textarea")].some(t => t.value)) charger(); }, 30000);
})();
</script>
