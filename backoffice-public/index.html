/* Éléments cliquables */
.cliquable { all: unset; box-sizing: border-box; cursor: pointer; display: flex; min-width: 0 }
.cliquable:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px }
.chevron { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

/* Tuiles de l'accueil */
.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 680px) { .tuiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tuile { flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.tuile:hover { border-color: var(--sand) }
.tuile span { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em }
.tuile strong { font: 600 1.6rem/1.2 var(--f-body); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em }
.tuile small { color: var(--muted); font-size: .76rem }

/* Contenus à valider */
.rang-contenus { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 240px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin-inline: -4px; padding-inline: 4px }
.grille-contenus { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px }
.contenu { flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-snap-align: start }
.contenu:hover { border-color: var(--sand) }
.contenu .visuel { position: relative; aspect-ratio: 4 / 5; background: var(--idle-bg); overflow: hidden; max-width: 100% }
.contenu .visuel img, .contenu .visuel video { width: 100%; height: 100%; object-fit: cover; display: block }
.contenu .visuel .format { position: absolute; left: 8px; top: 8px; background: rgb(0 0 0 / .62); color: #fff; font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px }
.contenu .visuel .lecture { position: absolute; inset: auto 8px 8px auto; width: 34px; height: 34px; border-radius: 50%; background: rgb(0 0 0 / .62); display: grid; place-items: center }
.contenu .visuel .lecture::before { content: ""; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px }
.contenu .corps { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px }
.contenu .ouvrir { font-size: .8rem; font-weight: 600; color: var(--sand-text) }

/* Équipe */
.avatars { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px }
.membre { flex-direction: column; align-items: center; gap: 4px; width: 64px; flex: none; text-align: center }
.membre small { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.avatar { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 600 1.15rem/1 var(--f-display); background: var(--sand-soft); color: var(--sand-text); border: 1px solid color-mix(in srgb, var(--sand) 40%, transparent); flex: none }
.avatar.grand { width: 58px; height: 58px; font-size: 1.45rem }
.avatar i { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--surface); background: var(--idle) }
.avatar i.e-teste { background: var(--test) } .avatar i.e-actif { background: var(--ok) } .avatar i.e-configure { background: var(--info) } .avatar i.e-bloque { background: var(--warn) }
.grille-agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px }
.agent { gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.agent:hover { border-color: var(--sand) }
.agent .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 }
.legende-etats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted) }

/* Listes */
.liste { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.rangee { align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100% }
.liste > :last-child { border-bottom: 0 }
.rangee:hover { background: var(--surface-2) }
.rangee .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 }
.rangee .txt .note { color: var(--muted); font-size: .82rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.puce { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle) }
.puce.warn { background: var(--warn) } .puce.bad { background: var(--bad) } .puce.test { background: var(--test) }
.filtres { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.filtres button { flex: none; font-size: .8rem; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.filtres button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink) }

/* Boutons et formulaires */
.btn { font-size: .86rem; font-weight: 500; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; gap: 6px }
.btn.principal { background: var(--ink); border-color: var(--ink); color: var(--on-ink) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.actions { display: flex; gap: 8px; flex-wrap: wrap }
textarea { width: 100%; min-height: 84px; font: inherit; font-size: .92rem; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); resize: vertical }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.histo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .82rem }
.histo li { border-left: 2px solid var(--line); padding-left: 10px; overflow-wrap: anywhere }

/* Tableaux */
.tableau { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .84rem }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { color: var(--muted); font-weight: 500; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap }
tr:last-child td { border-bottom: 0 }

/* Fiche (feuille) */
dialog.fiche { padding: 0; border: 0; background: var(--surface); color: var(--fg); width: 100%; max-width: 100%; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; overflow: auto; overscroll-behavior: contain }
dialog.fiche::backdrop { background: rgb(0 0 0 / .5) }
@media (min-width: 760px) { dialog.fiche { width: min(760px, calc(100% - 48px)); margin: auto; border-radius: 16px; max-height: 88dvh; border: 1px solid var(--line) } }
@media (prefers-reduced-motion: no-preference) { dialog.fiche[open] { animation: monte .22s ease-out } @keyframes monte { from { transform: translateY(24px); opacity: .6 } } }
.fiche-tete { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px 16px; display: flex; align-items: center; gap: 10px }
.fiche-tete .titre { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.fiche-tete .titre b { font: 600 1.25rem/1.15 var(--f-display); overflow-wrap: anywhere }
.icone-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; place-items: center }
.icone-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.fiche-corps { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px }
.bloc { display: flex; flex-direction: column; gap: 6px }
.bloc > .etiquette { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.puces-texte { display: flex; flex-wrap: wrap; gap: 6px }
.puces-texte span { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line) }
.prog { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden }
.prog > i { display: block; height: 100%; background: var(--a-apps); border-radius: 999px }
.prog.petite { height: 5px }
.etapes { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; overflow-x: auto }
.etapes li { flex: 1 0 auto; font-size: .68rem; color: var(--muted); padding-top: 6px; border-top: 3px solid var(--line); white-space: nowrap }
.etapes li.faite { border-top-color: var(--a-apps) }
.etapes li.ici { border-top-color: var(--a-apps); color: var(--fg); font-weight: 600 }
.chantier { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .85rem }
.chantier .prog { grid-column: 1 / -1 }
.manque { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.manque li { font-size: .88rem; padding: 8px 10px 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--fg); border-left: 3px solid var(--warn); overflow-wrap: anywhere }
.medias { display: flex; flex-direction: column; gap: 12px; align-items: center }
.medias figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; max-width: 100% }
.medias img, .medias video { max-width: 100%; max-height: 72dvh; border-radius: 10px; background: #000 }
.medias figcaption { font-size: .76rem; color: var(--muted); text-align: center }
.diapos { display: grid; grid-auto-flow: column; grid-auto-columns: 82%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; width: 100% }
.diapos figure { scroll-snap-align: center }
details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2) }
details summary { cursor: pointer; font-weight: 500; font-size: .9rem }
.telecharger { display: inline-block; margin-left: 6px; font-weight: 600; color: var(--fg); text-decoration: underline }
.banniere { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin: 12px 0; display: grid; gap: 10px }
.banniere p { margin: 0 }
.cal-jour { font-size: .95rem; margin: 18px 0 8px; text-transform: capitalize }
.cal-heure { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 52px }
.li-posts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 10px 0 }
.li-post { min-width: 0; overflow: hidden; border: 1px solid var(--line, #ddd); border-radius: 12px; padding: 14px; background: var(--surface) }
.li-num { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px }
.li-tete { display: flex; gap: 10px; align-items: center; margin-bottom: 10px }
.li-tete small { display: block; color: var(--muted); font-size: .78rem }
.li-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: .85rem; flex: none }
.li-texte { white-space: pre-wrap; margin: 0; font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere }
.li-post details { margin-top: 10px }
.li-image img, .li-post .diapos img { width: 100%; max-width: 100%; border-radius: 8px; margin-top: 10px; display: block }
.texte-brut { white-space: pre-wrap; font: .84rem/1.55 var(--f-body); margin: 10px 0 0; overflow-wrap: anywhere }
.fichiers { margin: 0; padding-left: 18px; font-size: .82rem; overflow-wrap: anywhere }
.decision { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -16px calc(-24px - env(safe-area-inset-bottom, 0px)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px }
.decision .actions .btn { flex: 1; justify-content: center }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 10px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 20 }
.plus-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px }
.plus-item { gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.plus-item:hover { border-color: var(--sand) }
.plus-item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.plus-item .txt small { color: var(--muted); font-size: .8rem }
.retour { align-self: flex-start }
.btn.micro svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round }
.btn.micro[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad) }
.destinataire { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.destinataire select { flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.provisoire { font-style: italic }
.echange { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.echange li { max-width: 88%; padding: 9px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 3px }
.echange li.moi { align-self: flex-end; background: var(--sand-soft); border-bottom-right-radius: 4px }
.echange li.agent { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px }
/* Couleur et mouvement (12/11) : couleurs des réseaux, tuiles teintées, entrée douce des pages */
:root { --ig: #d6246e; --li: #0a66c2; --fb: #1877f2; --tt: #111111; --yt: #e62117; --accent-grad: linear-gradient(135deg, #1f5a7d 0%, #2a6f97 100%) }
:root[data-theme="dark"] { --tt: #e8e8e8 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tt: #e8e8e8 } }
.haut-droite { display: flex; align-items: center; gap: 10px }
.btn-rafraichir { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .78rem; font-weight: 500; cursor: pointer }
.btn-rafraichir svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.btn-rafraichir:hover { border-color: var(--sand) }
.btn-rafraichir.tourne svg { animation: tourne .6s linear infinite } @keyframes tourne { to { transform: rotate(360deg) } }
@media (max-width: 520px) { .btn-rafraichir span { display: none } .btn-rafraichir { padding: 7px } .etat-base { display: none } }

.tuile { position: relative; overflow: hidden; transition: transform .18s ease, box-shadow .18s ease }
.tuile::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--t, var(--sand)) }
.tuile strong { color: var(--t, var(--fg)) }
.tuiles .tuile:nth-child(1) { --t: var(--sand-text); background: linear-gradient(160deg, var(--sand-soft), var(--surface) 70%) }
.tuiles .tuile:nth-child(2) { --t: var(--ok); background: linear-gradient(160deg, var(--ok-bg), var(--surface) 70%) }
.tuiles .tuile:nth-child(3) { --t: var(--bad); background: linear-gradient(160deg, var(--bad-bg), var(--surface) 70%) }
.tuiles .tuile:nth-child(4) { --t: var(--info); background: linear-gradient(160deg, var(--info-bg), var(--surface) 70%) }
.tuile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08) }
.btn.principal { background: var(--sand); border-color: var(--sand); color: #fff }
details.historique { border-top: 1px solid var(--line); padding-top: 8px }
details.historique summary { cursor: pointer; color: var(--muted); font-size: .84rem; padding: 4px 0 }
details.historique[open] summary { margin-bottom: 8px }
.rs { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sand); flex: none }
.rs-instagram { background: var(--ig) } .rs-linkedin { background: var(--li) } .rs-facebook { background: var(--fb) } .rs-tiktok { background: var(--tt) } .rs-youtube { background: var(--yt) }
.semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.sem-jour { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); min-width: 0 }
.sem-jour small { color: var(--muted); font-size: .68rem; text-transform: capitalize }
.sem-jour b { font-size: 1.05rem }
.sem-jour.auj { background: var(--sand); border-color: transparent; color: #fff } .sem-jour.auj small { color: rgba(255,255,255,.85) }
.sem-jour.pleine:not(.auj) { border-color: var(--sand) }
.sem-points { display: flex; gap: 3px; min-height: 8px }
.cal-mois { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0 }
.cal-tete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px }
.cal-tete h2 { margin: 0; font: 600 1.3rem/1.2 var(--f-display); text-transform: capitalize }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.cal-jsem { text-align: center; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 2px 0 }
.cal-case { min-height: 74px; border-radius: 8px; background: var(--surface-2); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden }
.cal-case.vide-case { background: none } .cal-case.passe { opacity: .55 }
.cal-case.auj { box-shadow: inset 0 0 0 2px var(--sand) }
.cal-num { font-size: .72rem; color: var(--muted); font-weight: 600 }
.cal-case.auj .cal-num { color: var(--sand-text) }
.chip-pub { display: flex; align-items: center; gap: 4px; font-size: .66rem; line-height: 1.25; padding: 3px 5px; border-radius: 6px; border: 0; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--fg); background: var(--surface) }
.rs-fond-instagram { background: color-mix(in srgb, var(--ig) 16%, var(--surface)) } .rs-fond-linkedin { background: color-mix(in srgb, var(--li) 16%, var(--surface)) }
.rs-fond-facebook { background: color-mix(in srgb, var(--fb) 16%, var(--surface)) } .rs-fond-youtube { background: color-mix(in srgb, var(--yt) 16%, var(--surface)) }
@media (max-width: 600px) { .cal-case { min-height: 52px } .chip-pub { font-size: 0; padding: 4px; justify-content: center } .chip-pub .rs { width: 9px; height: 9px } }
.cal-legende { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: .74rem; color: var(--muted) }
.cal-legende > span { display: inline-flex; align-items: center; gap: 5px }
@media (prefers-reduced-motion: no-preference) {
  main.entree > section, main.entree > .banniere { animation: apparait .45s cubic-bezier(.2,.7,.2,1) both }
  main.entree > section:nth-of-type(2) { animation-delay: .05s } main.entree > section:nth-of-type(3) { animation-delay: .1s }
  main.entree > section:nth-of-type(4) { animation-delay: .15s } main.entree > section:nth-of-type(5) { animation-delay: .2s }
  main.entree > section:nth-of-type(n+6) { animation-delay: .25s }
  @keyframes apparait { from { opacity: 0; transform: translateY(12px) } }
  .sem-jour.pleine .rs, .cal-case.auj .cal-num { animation: pulse 2.4s ease-in-out infinite } @keyframes pulse { 50% { opacity: .55 } }
}
.avis { border-left: 3px solid var(--sand); padding-left: 12px; display: flex; flex-direction: column; gap: 6px }
.avis-tete { display: flex; align-items: center; gap: 10px }
.avis-note { font: 600 1.6rem/1 var(--f-body) } .avis-note small { font-size: .8rem; color: var(--muted); font-weight: 500 }
/* ===== Refonte 18/11 : tableau de bord pro, thème ardoise, barre latérale ===== */
:root { --f-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --a-immo: #1f8a9b; --a-apps: #7a66d9; --a-contenu: #d0603f; --side-w: 252px; --barre-h: 56px }
:root[data-theme="dark"] {
  --bg: #1d232b; --surface: #262e38; --surface-2: #2e3742; --fg: #edf1f5; --muted: #a7b1bc; --line: #38424e;
  --ink: #edf1f5; --on-ink: #1d232b; --sand: #5ea8e0; --sand-text: #8cc4ef; --sand-soft: #24374a;
  --ok: #6fd09a; --ok-bg: #1f3a2c; --info: #8db8f0; --info-bg: #23344d; --warn: #f0a35e; --warn-bg: #43301f;
  --bad: #f27a70; --bad-bg: #4a2422; --idle: #aab3bd; --idle-bg: #333c47; --test: #b9a6ef; --test-bg: #352d4e;
  --a-immo: #2a9fb0; --a-apps: #8b78e6; --a-contenu: #e0704f; --tt: #e8e8e8; color-scheme: dark }
body { font-size: 14.5px }
h1 { font: 650 1.6rem/1.2 var(--f-body); letter-spacing: -.01em }
h2 { font: 620 1.08rem/1.3 var(--f-body); letter-spacing: -.005em }
.marque b, .fiche-tete .titre b, .cal-tete h2, .avatar { font-family: var(--f-body) }
.fiche-tete .titre b { font-size: 1.08rem; font-weight: 650 }

/* Mise en page : barre latérale fixe + zone principale */
.app { display: flex; min-height: 100dvh }
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; padding-top: env(safe-area-inset-top, 0px) }
.side-tete { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px }
.side-logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--a-immo), var(--sand)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .95rem; flex: none }
.side-tete b { display: block; font-size: .98rem; font-weight: 650 }
.side-tete small { display: block; color: var(--muted); font-size: .72rem }
.side nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 1px }
.side .groupe { font-size: .66rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 14px 10px 6px; font-weight: 600 }
.side a.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; position: relative }
.side a.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none }
.side a.nav:hover { background: var(--surface-2); color: var(--fg) }
.side a.nav[aria-current="page"], .side a.nav.parent-actif { color: var(--fg); background: var(--sand-soft) }
.side a.nav[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--sand) }
.side a.nav .pt { width: 8px; height: 8px; border-radius: 50%; flex: none }
.side a.sous { padding: 6px 10px 6px 38px; font-size: .84rem }
.side a.sous[aria-current="page"] { background: var(--surface-2) }
.side a.sous[aria-current="page"]::before { left: 26px; top: 50%; bottom: auto; width: 5px; height: 5px; border-radius: 50%; transform: translateY(-50%) }
.side .nb { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: .7rem; font-weight: 700; display: grid; place-items: center }
.side .nb.doux { background: var(--surface-2); color: var(--muted) }
.side-pied { border-top: 1px solid var(--line); padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; font-size: .74rem; color: var(--muted) }
.side-pied .ligne { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.principal { flex: 1; min-width: 0; margin-left: var(--side-w); display: flex; flex-direction: column }
.barre { position: sticky; top: 0; z-index: 20; height: calc(var(--barre-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line) }
.barre .wrap { height: var(--barre-h); display: flex; align-items: center; gap: 12px; max-width: 1320px }
.barre .fil { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--muted); white-space: nowrap; overflow: hidden }
.barre .fil b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis }
.btn-menu { display: none; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; place-items: center; flex: none }
.btn-menu svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round }
main.wrap { max-width: 1320px; width: 100%; padding-block: 22px 60px; gap: 26px }
.voile { display: none }
nav.bas { display: none }
body::before { display: none }
.bandeau { font-size: .82rem }

@media (max-width: 999px) {
  .side { transform: translateX(-104%); transition: transform .22s ease; box-shadow: 0 0 40px rgb(0 0 0 / .4) }
  body.menu-ouvert .side { transform: none }
  body.menu-ouvert .voile { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 25 }
  .principal { margin-left: 0 }
  .btn-menu { display: grid }
  main.wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) }
  nav.bas { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; background: var(--surface); border-top: 1px solid var(--line); padding: 0 4px env(safe-area-inset-bottom, 0px) }
  nav.bas a, nav.bas button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 60px; color: var(--muted); font-size: .68rem; font-weight: 500; position: relative }
  nav.bas svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
  nav.bas [aria-current="page"] { color: var(--fg) }
  nav.bas [aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; background: var(--sand); border-radius: 0 0 2px 2px }
  nav.bas .badge { top: 6px }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)) }
}
@media (max-width: 520px) { .barre .etat-base, .barre .maj { display: none } }

/* Cartes, indicateurs */
.grille-kpi { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; text-decoration: none; color: var(--fg); position: relative; overflow: hidden }
a.kpi:hover, button.kpi:hover { border-color: var(--sand) }
.kpi .lib { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; display: flex; align-items: center; gap: 6px }
.kpi .val { font: 650 1.75rem/1.1 var(--f-body); font-variant-numeric: tabular-nums; letter-spacing: -.02em }
.kpi .val small { font-size: .9rem; color: var(--muted); font-weight: 500 }
.kpi .sous { font-size: .78rem; color: var(--muted) }
.kpi .det { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--muted) }
.kpi .det b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums }
.kpi.accent::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--k, var(--sand)) }
.nd { color: var(--muted); font-style: italic; font-size: .86em; font-weight: 500 }
.kpi .val .nd { font-size: .95rem; font-style: italic }
.src { display: inline-flex; align-items: center; gap: 4px; font-size: .66rem; font-weight: 600; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-transform: none }
.src::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.src-sync { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent) }
.src-calc { color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, transparent) }
.src-manuel { color: var(--test); border-color: color-mix(in srgb, var(--test) 35%, transparent) }
.src-estim { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent) }
.src-nd { color: var(--muted) } .src-nd::before { background: none; border: 1px solid currentColor }
.src-reel { color: var(--sand-text); border-color: color-mix(in srgb, var(--sand) 35%, transparent) }
.grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px }
.univers-carte { border-top: 3px solid var(--k) } .univers-carte:hover { border-color: var(--k) }
section.univers { border-left: 3px solid var(--k); padding-left: 14px; gap: 18px }
@media (max-width: 600px) { section.univers { padding-left: 10px } }
.grille-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px }
.panneau { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.panneau > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.panneau > header h2 { font-size: 1rem }
.panneau > header p { margin: 2px 0 0; color: var(--muted); font-size: .8rem }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .74rem; color: var(--muted) }
.legende span { display: inline-flex; align-items: center; gap: 6px }
.legende i { width: 12px; height: 10px; border-radius: 3px; display: inline-block }
.page-tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.page-tete p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; max-width: 70ch }

/* Filtres */
.barre-filtres { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: .8rem; font-weight: 500; color: var(--muted); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .25) }
.barre-filtres select, .barre-filtres input, .champ select, .champ input, .champ textarea { font: inherit; font-size: .82rem; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-width: 0 }
.barre-filtres input[type=search] { flex: 1 1 180px }
.barre-filtres .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px }
.onglets { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 0 }
.onglets button { flex: none; border: 0; background: none; padding: 9px 12px; font-size: .85rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center }
.onglets button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--sand) }
.onglets .c { font-size: .72rem; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 0 7px }

/* Registre */
.reg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.reg-ligne { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 2.4fr) 1fr 1fr .9fr 1fr .9fr 18px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); width: 100% }
.reg-ligne:hover { background: var(--surface-2) }
.reg-ligne:focus-visible { outline: 2px solid var(--sand); outline-offset: -2px }
.reg > :last-child { border-bottom: 0 }
.reg-tete { display: grid; grid-template-columns: 52px minmax(0, 2.4fr) 1fr 1fr .9fr 1fr .9fr 18px; gap: 12px; padding: 9px 14px; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface-2) }
.mini { width: 52px; height: 52px; border-radius: 8px; background: var(--surface-2) center/cover no-repeat; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: .62rem; overflow: hidden }
.mini img { width: 100%; height: 100%; object-fit: cover }
.reg-ligne .t { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.reg-ligne .t b { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.reg-ligne .t small, .reg-ligne .c { font-size: .78rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
@media (max-width: 860px) {
  .reg-tete { display: none }
  .reg-ligne { grid-template-columns: 52px minmax(0, 1fr) auto; grid-template-areas: "m t s" "m p p"; row-gap: 4px }
  .reg-ligne > :nth-child(1) { grid-area: m } .reg-ligne > :nth-child(2) { grid-area: t } .reg-ligne > :nth-child(6) { grid-area: s }
  .reg-ligne > :nth-child(3) { grid-area: p } .reg-ligne > :nth-child(4), .reg-ligne > :nth-child(5), .reg-ligne > :nth-child(7), .reg-ligne > :nth-child(8) { display: none }
}
.act { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; white-space: nowrap }
.act::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--k) }
.act-immo { --k: var(--a-immo) } .act-apps { --k: var(--a-apps) } .act-reseaux { --k: var(--a-contenu) }
.plats { display: inline-flex; gap: 4px; flex-wrap: wrap }
.plat { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font: 700 .62rem/1 var(--f-body); flex: none }
.plat svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.2 }
.plat-instagram { background: linear-gradient(45deg, #f09433, #dc2743 50%, #bc1888) } .plat-facebook { background: #1877f2 } .plat-linkedin { background: #0a66c2 }
.plat-tiktok { background: #111; box-shadow: inset 0 0 0 1px #444 } .plat-youtube { background: #e62117 } .plat-whatsapp { background: #25d366 } .plat-meta_ads { background: #0866ff } .plat-autre { background: var(--idle) }

/* Pastilles des nouveaux statuts */
.s-en_creation, .s-a_auditer, .s-a_corriger, .s-audit_manquant, .s-en_pause, .s-connecte_non_lu, .s-modifier { color: var(--warn); background: var(--warn-bg) }
.s-programme, .s-sponsorise, .s-ok, .s-continuer, .s-developper { color: var(--info); background: var(--info-bg) }
.s-publie, .s-termine, .s-valide { color: var(--ok); background: var(--ok-bg) }
.s-archive, .s-non_connecte, .s-en_cours_test { color: var(--idle); background: var(--idle-bg) }
.s-echoue, .s-arreter, .s-erreur { color: var(--bad); background: var(--bad-bg) }

/* Graphiques */
.graph { width: 100%; height: auto; display: block; overflow: visible }
.graph text { fill: var(--muted); font: 500 10.5px var(--f-body) }
.graph .grille-g { stroke: var(--line); stroke-width: 1 }
.graph .barre-g { transition: opacity .15s }
.graph .barre-g:hover { opacity: .8 }
.graph-vide { color: var(--muted); font-size: .84rem; padding: 26px 12px; text-align: center; border: 1px dashed var(--line); border-radius: 10px }
.barres-h { display: flex; flex-direction: column; gap: 8px }
.bh { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: .8rem }
.bh .nom { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bh .piste { height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; position: relative }
.bh .rempli { height: 100%; border-radius: 0 4px 4px 0; background: var(--k, var(--sand)) }
.bh .rempli.manuel { background: repeating-linear-gradient(45deg, var(--k, var(--sand)) 0 4px, transparent 4px 7px); border: 1px solid var(--k, var(--sand)) }
.bh .v { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; min-width: 34px; text-align: right }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); font-size: .78rem; padding: 6px 9px; border-radius: 7px; max-width: 260px; box-shadow: 0 6px 18px rgb(0 0 0 / .3) }

/* Listes d'actions */
.actions-liste { display: flex; flex-direction: column }
.actions-liste .rangee { border-bottom: 1px solid var(--line); padding: 10px 2px }
.actions-liste > :last-child { border-bottom: 0 }
.qui { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }

/* Formulaires */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px }
.champ { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted) }
.champ.large { grid-column: 1 / -1 }
.champ textarea { min-height: 70px }
.form-note { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); margin: 0 }

/* Bibliothèque */
.galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px }
.galerie figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column }
.galerie .img { aspect-ratio: 4 / 5; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: .72rem; position: relative }
.galerie .img img { width: 100%; height: 100%; object-fit: cover; display: block }
.galerie figcaption { padding: 6px 8px; font-size: .72rem; color: var(--muted); line-height: 1.35 }
.galerie .tag-video { position: absolute; left: 6px; top: 6px; background: rgb(0 0 0 / .6); color: #fff; font-size: .62rem; padding: 2px 6px; border-radius: 5px }
.droit { font-size: .74rem; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap }
.droit.oui { color: var(--ok) } .droit.non { color: var(--bad) } .droit.av { color: var(--warn) }
.tags-nuage { display: flex; flex-wrap: wrap; gap: 6px }
.tag { all: unset; cursor: pointer; font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center }
.tag[aria-pressed="true"] { border-color: var(--sand); color: var(--sand-text) }
.tag .n { color: var(--muted); font-size: .72rem }
.tag.alerte { border-color: color-mix(in srgb, var(--warn) 50%, transparent) }
.integr { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px }
.integr .panneau h3 { display: flex; align-items: center; gap: 8px }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .8rem }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
.semaine-v { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.semaine-v .col { background: var(--surface-2); border-radius: 10px; min-height: 160px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.semaine-v .col.auj { box-shadow: inset 0 0 0 2px var(--sand) }
.semaine-v .col.vide-j { background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, color-mix(in srgb, var(--surface-2) 60%, var(--bg)) 8px 16px) }
.semaine-v .jt { font-size: .7rem; color: var(--muted); font-weight: 600; text-transform: capitalize }
@media (max-width: 700px) { .semaine-v { grid-template-columns: 1fr } .semaine-v .col { min-height: 0 } }
.signal { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: .84rem }
.signal i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn) }
.signal.bad i { background: var(--bad) } .signal.info i { background: var(--info) }
.tuiles-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px }
.tuile-nav { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--fg) }
.tuile-nav:hover { border-color: var(--sand) }
.tuile-nav .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--sand-soft); color: var(--sand-text); display: grid; place-items: center; flex: none }
.tuile-nav .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.tuile-nav span { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.tuile-nav small { color: var(--muted); font-size: .78rem }
.tableau td .nd { white-space: nowrap }
.avis-ligne { display: grid; grid-template-columns: minmax(0, 2fr) 1.2fr .9fr .6fr 1fr 18px; gap: 10px; align-items: center }
@media (max-width: 760px) { .avis-ligne { grid-template-columns: minmax(0, 1fr) auto } .avis-ligne > :nth-child(2), .avis-ligne > :nth-child(3), .avis-ligne > :nth-child(4), .avis-ligne > :nth-child(6) { display: none } }
/* correctifs 18/11 */
.bh .rempli { display: block }
.kpi .lib { flex-wrap: wrap; row-gap: 4px }
.kpi .lib .src { text-transform: none; letter-spacing: 0; font-weight: 500; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.side-pied .ligne { flex-wrap: wrap }
.side-pied .btn-rafraichir { max-width: 100% }
@media (max-width: 560px) {
  .grille-kpi { grid-template-columns: 1fr 1fr; gap: 8px }
  .kpi { padding: 12px }
  .kpi .val { font-size: 1.4rem }
  .kpi .lib .src { display: none }
  .barre-filtres select { flex: 1 1 45% }
}

.s-a_faire { color: var(--idle); background: var(--idle-bg) } .s-fait { color: var(--ok); background: var(--ok-bg) } .s-en_modification { color: var(--warn); background: var(--warn-bg) }

/* ===== Thème « verre violet » (inspiré de la référence d'Avishay), 18/11 ===== */
:root[data-theme="nova"] {
  --bg: #f3f0fb; --surface: rgb(255 255 255 / .66); --surface-solide: #fdfcff; --surface-2: #f0ebfc; --fg: #1c1733; --muted: #676281; --line: rgb(108 76 214 / .13);
  --ink: #1c1733; --on-ink: #ffffff; --sand: #7c3aed; --sand-text: #6d28d9; --sand-soft: #ede5ff;

/dc80b60423bcc074a066c1ed474f9d54", "libelle": "Vidéo FR 26 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu 1 : qui achète sur la Costa del Sol ? (à valider, rien n'est publié)\nVidéo : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-1-etrangers-malaga/video-FR-sans-musique.mp4 (30 s, 9:16, FR, sans musique : 3 musiques à proposer avant publication).\nDéroulé : question d'accroche → carte d'Espagne, 16 % des ventes à des étrangers (record) → province de Málaga 38,8 %, presque 4 achats sur 10 → classement des provinces (Alicante 46,5 · Málaga 38,8 · Baléares 37,2 · Santa Cruz de Tenerife 29,0) → nationalités (Britanniques 7,5 · Marocains 6,4 · Néerlandais 5,8 · Allemands 5,7 · Français 4,2) → « Écrivez MARBELLA en message » → carte Levy & Goldman.\nSource : Colegio de Registradores, Estadística Registral Inmobiliaria 3e trimestre 2026, via idealista 05/11/2026 (https://www.idealista.com/news/inmobiliario/vivienda/2026/11/05/922744-los-extranjeros-siguen-comprando-casas-en-espana-superan-el-16-de-las-transacciones). Fond de carte © OpenStreetMap.\n\n## Légende (FR)\nPresque 4 logements sur 10 vendus dans la province de Málaga ont été achetés par des étrangers cet été.\nEn Espagne, c'est 16 % : un record.\nBritanniques, Marocains, Néerlandais, Allemands et Français en tête.\n\nVous cherchez à Marbella ? Écrivez « MARBELLA » en message.\n\nSource : Colegio de Registradores, 3e trimestre 2026. Carte © OpenStreetMap.\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~27 s, ton premium sobre)\nQui achète sur la Costa del Sol ? En Espagne, 16 % des logements sont désormais achetés par des étrangers : un record. Dans la province de Málaga, c'est 38,8 % : presque quatre achats sur dix. En tête : les Britanniques, les Marocains, les Néerlandais, les Allemands et les Français. Vous cherchez à Marbella ? Écrivez « MARBELLA » en message.\n"}]}}, {"id": "C-2026-11-18-actu-2-elections-29-novembre", "tache_id": "2026-11-18-actu-2-elections-29-novembre", "activite": "immo", "titre": "Actu animée : élections du 29 novembre et taxe 100 %", "format": "reel", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-actu-2-elections-29-novembre/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-2-elections-29-novembre/", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-2-elections-29-novembre/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-2-elections-29-novembre/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-22T19:30:00Z", "retours": [], "apercu": {"medias": [{"type": "video", "url": "/_blob/e52aa56a194c117e4580bd2b8a0c12aa", "poster": "/_blob/302ac3518830474f8bafc72fd23123e8", "libelle": "Vidéo FR 30 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi. Priorité basse : publication pas encore décidée."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu 2 : élections du 29 novembre et taxe « jusqu'à 100 % » (à valider, rien n'est publié)\nVidéo : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-2-elections-29-novembre/video-FR-sans-musique.mp4 (28 s, 9:16, FR, sans musique).\nÀ publier AVANT le 29/11/2026, sinon à refaire.\nDéroulé : « 29 novembre, l'Espagne vote » → « Et la taxe jusqu'à 100 % sur les acheteurs hors UE ? » → chronologie (janv. 2025 annoncée ; jamais votée ; oct. 2026 Cortes dissoutes, le projet tombe ; 29 nov. élections, il pourrait être redéposé) → qui était visé (non-résidents hors UE : Royaume-Uni, Maroc, États-Unis ; résidents UE pas visés) → « Aujourd'hui cette taxe n'existe pas » → « Écrivez VOTE en message ».\nSources : idealista 15/01/2025 (annonce, non-résidents hors UE, jusqu'à 100 %) ; El Confidencial 05/10/2026 (élections 29-N) ; dissolution par Real Decreto 806/2026, la proposition de loi caduque (bravosestate.com, vicox.legal). Mention « Pas un conseil fiscal ».\n\n## Légende (FR)\nLe 29 novembre, l'Espagne vote.\nLa taxe « jusqu'à 100 % » sur les acheteurs hors UE n'a jamais été votée : le projet est tombé avec la dissolution des Cortes. Il pourrait revenir après les élections.\nNous suivons le sujet pour vous.\n\nUne question sur votre projet ? Écrivez « VOTE » en message.\n\nSources : idealista, El Confidencial. Ceci n'est pas un conseil fiscal.\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~25 s, ton premium sobre, pas un conseil fiscal)\nLe 29 novembre, l'Espagne vote. En janvier 2025, le gouvernement avait annoncé une taxe pouvant aller jusqu'à 100 % sur les achats des non-résidents hors Union européenne. Elle n'a jamais été votée, et le projet est tombé avec la dissolution des Cortes. Mais il pourrait revenir après le vote. Britanniques, Marocains, Américains seraient concernés ; pas les Français, les Belges ou les Italiens. Pour en parler, écrivez « VOTE » en message.\n"}]}}, {"id": "C-2026-11-18-actu-3-prix-ventes", "tache_id": "2026-11-18-actu-3-prix-ventes", "activite": "immo", "titre": "Actu animée : à Marbella les prix montent, les ventes baissent", "format": "reel", "langue": "fr", "statut": "remplace", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-actu-3-prix-ventes/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-3-prix-ventes/", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-3-prix-ventes/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-3-prix-ventes/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-23T11:40:00Z", "retours": [{"decision": "note", "texte": "Retiré à la demande d'Avishay (23/11) : ne sera pas publié.", "canal": "équipe", "cree_le": "2026-11-23T11:40:00Z"}], "apercu": {"medias": [{"type": "video", "url": "/_blob/aad3c9372c683ab7fb286ad73ef63ccc", "poster": "/_blob/0a078d0f289f3d8d0a7e370cf32ffb39", "libelle": "Vidéo FR 25 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu animée : à Marbella les prix montent, les ventes baissent (en modification : voix off + musique à ajouter, rien n'est publié)\nVidéo muette : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-3-prix-ventes/video-FR-sans-son.mp4 (27 s, 9:16, FR). Ne pas mettre en « À valider » avant voix off + musique.\nDéroulé : accroche → valeur d'expertise 3 916 → 4 528 €/m² (+15,6 %) → ventes 1 159 → 873 au 1er trim. (−24,7 %) → « Moins de ventes, des prix plus hauts. Quand le bon bien arrive, il faut être prêt. » → « Écrivez PRIX » → carte Levy & Goldman.\nSources : Ministère du Logement (MIVAU), valeur d'expertise et transactions, cité par justrealestate.es 03/11/2026. Le fichier MIVAU n'a pas pu être téléchargé directement : à revérifier sur mivau.gob.es avant publication.\n\n## Légende (FR)\nÀ Marbella, les prix montent… et les ventes baissent.\nValeur d'expertise moyenne : 4 528 €/m² au 2e trimestre 2026, +15,6 % sur un an.\nVentes au 1er trimestre : 873, contre 1 159 un an plus tôt.\n\nQuand le bon bien arrive, il faut être prêt. Écrivez « PRIX » en message.\n\nSource : Ministère du Logement (MIVAU).\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~24 s, ton premium sobre, à caler sur les scènes)\nÀ Marbella, les prix montent… et les ventes baissent. En un an, la valeur d'expertise moyenne est passée de 3 916 à 4 528 euros le mètre carré : plus 15,6 %. Dans le même temps, les ventes ont reculé de près d'un quart. Moins de ventes, des prix plus hauts : quand le bon bien arrive, il faut être prêt. Écrivez « PRIX » en message.\n"}]}}, {"id": "C-2026-11-18-actu-4-neuf-rare", "tache_id": "2026-11-18-actu-4-neuf-rare", "activite": "immo", "titre": "Actu animée : le neuf se fait rare à Marbella", "format": "reel", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-actu-4-neuf-rare/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-4-neuf-rare/", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-4-neuf-rare/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-4-neuf-rare/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-22T19:30:00Z", "retours": [], "apercu": {"medias": [{"type": "video", "url": "/_blob/44b75fe6eff3699b919268021eaba08f", "poster": "/_blob/5297e0952c38a7fc046b4c7ebc526c88", "libelle": "Vidéo FR 25 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu animée : le neuf se fait rare à Marbella (en modification : voix off + musique à ajouter, rien n'est publié)\nVidéo muette : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-4-neuf-rare/video-FR-sans-son.mp4 (26 s, 9:16, FR). Ne pas mettre en « À valider » avant voix off + musique.\nDéroulé : accroche → part du neuf dans les ventes T2 2026 : Marbella 6,2 % vs Estepona 18,0 % (≈ 1 vente sur 16) → ventes neuves 2 108 (2004) → 450 (2025) → « Le neuf se fait rare à Marbella. −79 % entre 2004 et 2025 » → « Écrivez NEUF » → carte L&G.\nSources : Ministère du Logement (MIVAU), transactions par commune, 2004-2026 (calcul −78,7 % arrondi à −79 %). À revérifier sur mivau.gob.es avant publication.\n\n## Légende (FR)\nVous voulez du neuf à Marbella ?\nAu 2e trimestre 2026, le neuf ne pèse que 6,2 % des ventes à Marbella, contre 18 % à Estepona.\nEn 2004 : 2 108 ventes neuves. En 2025 : 450.\n\nVous cherchez du neuf ? Écrivez « NEUF » en message.\n\nSource : Ministère du Logement (MIVAU).\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~23 s, ton premium sobre, à caler sur les scènes)\nVous voulez du neuf à Marbella ? Au deuxième trimestre, le neuf ne représente que 6,2 % des ventes, contre 18 % à Estepona. En 2004, il s'était vendu 2 108 logements neufs à Marbella. En 2025, seulement 450. Le neuf se fait rare. Vous cherchez du neuf ? Écrivez « NEUF » en message.\n"}]}}, {"id": "C-2026-11-18-actu-5-americains", "tache_id": "2026-11-18-actu-5-americains", "activite": "immo", "titre": "Actu animée : qui paie le plus cher en Espagne ?", "format": "reel", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-actu-5-americains/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-5-americains/", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-5-americains/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-5-americains/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-22T19:30:00Z", "retours": [], "apercu": {"medias": [{"type": "video", "url": "/_blob/eaef0afec01861825a36b0dc42bfee8c", "poster": "/_blob/d6eb45398f51a83f354503d464ae32c2", "libelle": "Vidéo FR 22 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu animée : qui paie le plus cher en Espagne ? (en modification : voix off + musique à ajouter, rien n'est publié)\nVidéo muette : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-5-americains/video-FR-sans-son.mp4 (26 s, 9:16, FR). Ne pas mettre en « À valider » avant voix off + musique.\nDéroulé : accroche → prix moyen payé par origine (Amérique du Nord 4 469, UE 3 221, Océanie 3 215, reste de l'Europe 2 948, Asie 2 709 €/m²) → « À Marbella, selon idealista, les acheteurs américains sont de plus en plus nombreux » → « Un marché de plus en plus international » → « Écrivez MARBELLA » → carte L&G.\nSources : Colegio de Registradores, 3e trimestre 2026 (prix au m² par origine) ; idealista 12/11/2026 (hausse des acheteurs américains à Marbella, citant DM Properties).\n\n## Légende (FR)\nQui paie le plus cher pour acheter en Espagne ?\nLes acheteurs d'Amérique du Nord : 4 469 €/m² en moyenne, devant l'Union européenne (3 221 €/m²).\nEt à Marbella, ils sont de plus en plus nombreux.\n\nEt vous, quel est votre projet ? Écrivez « MARBELLA » en message.\n\nSources : Colegio de Registradores (3e trim. 2026), idealista (12/11/2026).\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~23 s, ton premium sobre, à caler sur les scènes)\nQui paie le plus cher pour acheter en Espagne ? Les acheteurs d'Amérique du Nord : 4 469 euros le mètre carré en moyenne, loin devant l'Union européenne. Et selon idealista, ils sont de plus en plus nombreux à Marbella. Un marché de plus en plus international. Et vous, quel est votre projet ? Écrivez « MARBELLA » en message.\n"}]}}, {"id": "C-2026-11-18-actu-6-urbanisme", "tache_id": "2026-11-18-actu-6-urbanisme", "activite": "immo", "titre": "Actu animée : Marbella a un nouveau plan d'urbanisme", "format": "reel", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-actu-6-urbanisme/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-6-urbanisme/", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-6-urbanisme/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-actu-6-urbanisme/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-22T19:30:00Z", "retours": [], "apercu": {"medias": [{"type": "video", "url": "/_blob/afa000962b8382cc1f53b050e5264d96", "poster": "/_blob/049a809e805445f3b116e181ac9943db", "libelle": "Vidéo FR 27 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Actu animée : Marbella a un nouveau plan d'urbanisme (en modification : voix off + musique à ajouter, rien n'est publié)\nVidéo muette : /mnt/project-files/agence-immo/contenus/2026-11-18-actu-6-urbanisme/video-FR-sans-son.mp4 (27 s, 9:16, FR). Ne pas mettre en « À valider » avant voix off + musique.\nDéroulé : accroche → frise : 1986 ancien plan / 2010 nouveau plan annulé / 18/09/2026 approuvé / 14/11/2026 en vigueur → 53 M m² de terrain urbain → « Avant d'acheter, nous vérifions la situation urbanistique du bien avec vous » → « Écrivez PLAN » → carte L&G.\nSources : BOP de Málaga n° 219 du 13/11/2026 (entrée en vigueur le 14/11/2026), alerte EY ; approbation 18/09/2026 ; BOJA 09/10/2026 ; 53 M m² : Ayuntamiento de Marbella.\n\n## Légende (FR)\nMarbella a enfin un nouveau plan d'urbanisme.\nDepuis 2010 et l'annulation du précédent, la ville vivait sur le plan de 1986. Le nouveau plan est en vigueur depuis le 14 novembre 2026.\n\nAvant d'acheter, nous vérifions avec vous la situation urbanistique du bien. Un projet ? Écrivez « PLAN » en message.\n\nSource : BOP de Málaga n° 219 (13/11/2026), Ayuntamiento de Marbella.\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~24 s, ton premium sobre, à caler sur les scènes)\nMarbella a enfin un nouveau plan d'urbanisme. Depuis l'annulation du plan de 2010, la ville vivait sur celui de 1986. Le nouveau plan a été approuvé le 18 septembre, et il est en vigueur depuis le 14 novembre. Ce que ça change pour vous : avant d'acheter, nous vérifions avec vous la situation urbanistique du bien. Un projet à Marbella ? Écrivez « PLAN » en message.\n"}]}}, {"id": "C-2026-11-18-animation-vrai-cout-achat-1M", "tache_id": "2026-11-18-animation-vrai-cout-achat-1M", "activite": "immo", "titre": "Animation : le vrai coût d'achat d'une villa à 1 M€", "format": "reel", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-18-animation-vrai-cout-achat-1M/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-18-animation-vrai-cout-achat-1M/", "/mnt/project-files/agence-immo/contenus/2026-11-18-animation-vrai-cout-achat-1M/video-FR-voix-hugo-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-18-animation-vrai-cout-achat-1M/apercu-FR-voix-hugo-720p.mp4"], "maj_le": "2026-11-23T11:45:00Z", "retours": [{"decision": "note", "texte": "Tests avec ta voix clonée retirés (23/11) : la voix ne te plaît pas. On refera les tests quand ton nouveau clone sera prêt.", "canal": "équipe", "cree_le": "2026-11-23T11:58:00Z"}], "apercu": {"medias": [{"type": "video", "url": "/_blob/d5ff100619a7212bd902e979831d9042", "poster": "/_blob/69b9c61cf2c37d40b79675cd590964eb", "libelle": "Vidéo FR 36 s, voix off Hugo (ElevenLabs). Valide d'abord la voix : la musique sera ajoutée ensuite par toi."}], "textes": [{"titre": "Légende, sources et note interne", "texte": "# Animation « Le vrai coût d'achat d'une villa à 1 M€ » (remplace « Holiday home or rental », en modification : voix off + musique à ajouter)\nVidéo muette : /mnt/project-files/agence-immo/contenus/2026-11-18-animation-vrai-cout-achat-1M/video-FR-sans-son.mp4 (30 s, 9:16, FR). Ne pas mettre en « À valider » avant voix off + musique.\nPourquoi ce sujet : Avishay (18/11) veut un contenu plus qualitatif qui génère des leads. En ligne, les Reels immo qui convertissent ancrent un prix dès l'accroche et éduquent l'acheteur, avec un mot-clé en DM lié à une aide concrète (Luxury Presence, Superdirector, The Close, 2026). Ici, « FRAIS » amène l'acheteur à donner son budget, ce qui le qualifie.\nDéroulé : villa à 1 M€, combien coûte vraiment l'achat ? → revente : ITP 7 % = 70 000 € → neuf : TVA 10 % + AJD 1,2 % = 112 000 € (42 000 € d'écart) → 2027 : la Junta annonce un ITP à 6,75 % (−2 500 € sur 1 M€), pas encore voté → + notaire, registre, avocat : le prix affiché n'est jamais le prix final → « Écrivez FRAIS » → carte Levy & Goldman.\nSources : ITP 7 % et AJD 1,2 % : Ley 5/2021 de Andalucía (art. 49), Junta de Andalucía (juntadeandalucia.es/temas/vivienda-consumo/compra/impuestos.html) ; TVA 10 % : Ley 37/1992 art. 91 ; annonce ITP 6,75 % en 2027 : note officielle Junta de Andalucía 24/09/2026, dépend de la loi de budget 2027 ; notaire et registre : barèmes RD 1426/1989 et RD 1427/1989. Base de l'ITP : prix ou valeur de référence du Catastro si elle est supérieure (RDLeg 1/1993 art. 10). Pas un conseil fiscal.\n\n## Légende (FR)\nUne villa à 1 M€ à Marbella : combien coûte vraiment l'achat ?\nEn revente : 7 % d'impôt de transmission, soit 70 000 €.\nEn neuf : 10 % de TVA et 1,2 % de droits, soit 112 000 €.\nSans compter le notaire, le registre et l'avocat.\n\nVous voulez le calcul pour votre budget ? Écrivez « FRAIS » en message.\n\nSources : Junta de Andalucía, loi 37/1992. Information générale, pas un conseil fiscal.\nEn collaboration avec Levy & Goldman.\n\n## Script voix off (FR, ~27 s, ton premium sobre)\nUne villa à un million d'euros à Marbella. Combien coûte vraiment l'achat ? En revente, vous payez 7 % d'impôt de transmission : 70 000 euros, en plus du prix. En neuf, c'est 10 % de TVA et 1,2 % de droits d'enregistrement : 112 000 euros. Pour 2027, la Junta d'Andalousie annonce un impôt à 6,75 %, pas encore voté. Ajoutez le notaire, le registre et l'avocat : le prix affiché n'est jamais le prix final. Écrivez « FRAIS » en message, nous calculons pour votre budget.\n"}]}}, {"id": "C-2026-11-18-reel-projet-villa-benahavis", "tache_id": "2026-11-18-reel-projet-villa-benahavis", "activite": "immo", "titre": "Reel projet de villa, Benahavís", "format": "reel", "langue": "en", "statut": "a_valider", "date_prevue": null, "bien": "AB-0004", "fichiers": ["/mnt/project-files/agence-immo/contenus/2026-11-18-reel-projet-villa-benahavis/", "contenus/2026-11-18-reel-projet-villa-benahavis/legende-et-note.md"], "maj_le": "2026-11-23T11:40:00Z", "retours": [{"decision": "note", "texte": "Tests avec ta voix clonée retirés (23/11) : la voix ne te plaît pas. On refera les tests quand ton nouveau clone sera prêt.", "canal": "équipe", "cree_le": "2026-11-23T11:58:00Z"}], "apercu": {"medias": [{"type": "video", "url": "/_blob/6d3f8306dbe815bedccf4e938e9fad2e", "poster": "/_blob/62fa492eee9beba4fd50d7e594f929f9", "libelle": "Musique 1, cinématique (Drawing the Sky) : version proposée. À confirmer par toi : le prix 3 995 000 € (construction incluse ?), le droit d'utiliser les images du site, le mot-clé DM « ESTATE ». Voix off de travail (OpenAI), remplacée ensuite par la voix choisie."}, {"type": "video", "url": "/_blob/4cb6321f4b4723c45f1ba49b991c56e0", "poster": "/_blob/62fa492eee9beba4fd50d7e594f929f9", "libelle": "Musique 2, élégante (Majestic). Dis-moi le numéro choisi."}, {"type": "video", "url": "/_blob/c19784d3473c9502c9bde7f358078d39", "poster": "/_blob/62fa492eee9beba4fd50d7e594f929f9", "libelle": "Musique 3, dynamique (Focus on Yourself). Dis-moi le numéro choisi."}, {"type": "image", "url": "/_blob/62fa492eee9beba4fd50d7e594f929f9", "libelle": "Couverture"}], "textes": [{"titre": "Le bien, le déroulé, la voix et les légendes EN/FR/ES", "texte": "# Reel « Projet de villa, Benahavís » (AB-0004) – 18/11/2026, à valider par Avishay\n\nRemplace le Reel programme neuf New Golden Mile (AB-0002), renvoyé le 18/11 : « je ne comprends pas de quel projet on parle », « présente-moi des produits que j'ai… mets-toi à la place du client », « la musique, c'est une catastrophe ».\n\n## Le bien (catalogue Levy & Goldman, réf. LG104 sur le site)\n- Source : https://levygoldman.com/property/villa-project-elysium-la-zagaleta-benahavis-%c2%b7-costa-del-sol/?lang=fr (lue le 18/11/2026, page modifiée le 29/09/2026).\n- Ce qu'on achète : un terrain prêt à bâtir (allée privée et plateau déjà faits, exposition sud), vendu avec le projet d'une villa d'environ 1 600 m² (spa, salle de sport, cinéma, simulateur de golf, cave à vin, galerie de voitures), en première ligne d'un golf, dans un domaine privé fermé de Benahavís (deux golfs privés, centre équestre, héliport, sécurité 24 h/24).\n- Prix affiché : 3 995 000 €. À l'image : « just under €4M » (le prix exact permet de retrouver l'annonce).\n- La singularité : on ne montre pas une villa à vendre, on montre une villa déjà dessinée, prête à être construite, à un endroit où les terrains libres sont rares.\n\n## Ce qu'on ne montre pas\nNom du projet, nom du domaine, nom de l'architecte, surface exacte du terrain, prix exact. Zone : Benahavís seulement.\n\n## Déroulé (40 s, 9:16, images de synthèse du promoteur)\n| Temps | Image | Texte à l'écran | Voix off (EN) |\n| --- | --- | --- | --- |\n| 0-7 s | Villa dans les collines, vue aérienne | BENAHAVÍS · PRIVATE GATED ESTATE / A PLOT READY TO BUILD | In the hills of Benahavís, inside one of Europe's most private gated estates, a plot is ready to build. |\n| 7-13 s | Salon, cuisine | SOLD WITH A COMPLETE VILLA DESIGN / AROUND 1,600 M² | It comes with a complete villa design. Around sixteen hundred square metres. |\n| 13-19 s | Spa, simulateur de golf, cave | SPA · GYM · CINEMA / Golf simulator · Wine cellar | A spa and a gym. A cinema, a golf simulator, a wine cellar. |\n| 19-23 s | Façade, golf | FRONTLINE GOLF / Open views · South-facing | Frontline golf, open views, facing south. |\n| 23-30 s | Terrasse, piscine | INSIDE THE ESTATE / 2 PRIVATE GOLF COURSES / Equestrian centre · 24h security | Around you: two private golf courses, an equestrian centre, and security around the clock. |\n| 30-34 s | Villa au crépuscule | PLOT WITH VILLA PROJECT / JUST UNDER €4M | The plot with its villa project: just under four million euros. |\n| 34-40 s | Écran final noir Levy & Goldman, DM “ESTATE” | | Send us a message. We'll walk you through every step. |\nMention « Computer-generated images · Villa project » pendant toutes les images.\n\n## Voix off\nVoix de travail (OpenAI, voix masculine posée), en attendant la voix choisie (ElevenLabs Starter ou Avi Voice). Elle sera remplacée sans changer le montage.\nUne voix de synthèse doit être signalée comme telle (règle d'usage OpenAI) : à mentionner dans la légende tant qu'on la garde.\n\n## Musique (3 options, jamais utilisées sur ses autres vidéos)\nToutes Mixkit, licence gratuite (réseaux sociaux et publicité autorisés, mixkit.co/license).\n1. **Drawing the Sky** (Eugenio Mininni), cinématographique avec montée progressive : version principale. C'est la recommandation (domaine spectaculaire + narration).\n2. **Majestic** (Diego Nava), élégante et discrète, piano électrique.\n3. **Focus on Yourself** (Eugenio Mininni), plus rythmée.\nMusique baissée automatiquement sous la voix.\n\n## Légende (EN)\nA villa that is already designed, on a plot that is ready to build.\nIn the hills of Benahavís, inside a private gated estate: frontline golf, open views, around 1,600 m² of villa project with spa, cinema, golf simulator and wine cellar.\nPlot with villa project: just under €4M.\nWe guide you from the first call to the keys, with independent lawyers and mortgage brokers at your side.\nDM “ESTATE” for the plans, the price and the next steps.\nComputer-generated images. AI voice-over. Price and availability subject to change.\n#Benahavis #Marbella #LuxuryRealEstate #VillaProject #CostaDelSol\n\n## FR\nUne villa déjà dessinée, sur un terrain prêt à bâtir. Dans les collines de Benahavís, au sein d'un domaine privé fermé : première ligne de golf, vue dégagée, environ 1 600 m² de projet avec spa, cinéma, simulateur de golf et cave à vin. Terrain avec projet de villa : un peu moins de 4 M€. Nous vous accompagnons du premier appel aux clés. Écrivez « ESTATE » en message privé. Images de synthèse. Voix off de synthèse. Prix et disponibilité susceptibles d'évoluer.\n\n## ES\nUna villa ya diseñada, en una parcela lista para construir. En las colinas de Benahavís, dentro de una urbanización privada cerrada: primera línea de golf, vistas abiertas, unos 1.600 m² de proyecto con spa, cine, simulador de golf y bodega. Parcela con proyecto de villa: poco menos de 4 M€. Le acompañamos desde la primera llamada hasta las llaves. Escríbanos «ESTATE» por mensaje privado. Imágenes generadas por ordenador. Voz en off sintética. Precio y disponibilidad sujetos a cambios.\n\n## À confirmer par Avishay\n1. Le prix (3 995 000 €) et ce qu'il comprend : terrain + projet seulement, ou construction incluse ? Le Reel dit « plot with villa project », sans parler du coût de construction.\n2. Le droit d'utiliser les images du site Levy & Goldman.\n3. Le mot-clé DM “ESTATE”.\n"}]}}, {"id": "C-2026-11-09-animation-holiday-or-rental", "tache_id": "2026-11-09-animation-holiday-or-rental", "activite": "immo", "titre": "Holiday home or rental investment? Start with your goal.", "format": "animation", "langue": "en", "statut": "remplace", "date_prevue": null, "bien": null, "fichiers": ["/mnt/project-files/agence-immo/contenus/2026-11-09-animation-holiday-or-rental/animation-holiday-or-rental-EN.mp4", "contenus/2026-11-09-animation-holiday-or-rental/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-11-animation-holiday-or-rental-v2/animation-holiday-or-rental-V2-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-11-animation-holiday-or-rental-v2/animation-holiday-or-rental-V3-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-11-animation-holiday-or-rental-v2/animation-holiday-or-rental-V4-sans-musique.mp4"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [{"decision": "note", "texte": "Remplacé par Animation : le vrai coût d'achat d'une villa à 1 M€ (22/11).", "canal": "équipe", "cree_le": "2026-11-22T19:30:00Z"}], "apercu": {"medias": [{"type": "video", "url": "/_blob/887249af62c577733d9877daf2b51edf", "libelle": "Deep house 1 : Autofahren (Mauro Urbina), deep house · Mixkit, libre de droits. Dis-moi le numéro choisi."}, {"type": "video", "url": "/_blob/218245d6845429593364d6a3cf518f91", "libelle": "Deep house 2 : Deep Urban (Eugenio Mininni), deep house · Mixkit, libre de droits. Dis-moi le numéro choisi."}, {"type": "video", "url": "/_blob/6e94209c26226255bb3abb9c516cc4fb", "libelle": "Deep house 3 : Winter Breeze (Arulo), house douce · Mixkit, libre de droits. Dis-moi le numéro choisi."}], "textes": [{"titre": "Légende et note interne", "texte": "# Animation « Holiday home or rental investment? » – statut : à valider par Avishay\n\nFichiers (hors git, stockage du projet) : `/mnt/project-files/agence-immo/contenus/2026-11-09-animation-holiday-or-rental/`\n- `animation-holiday-or-rental-EN.mp4` : 1080 × 1920, 18 s, H.264 + AAC, fond musical sobre composé par synthèse (aucun droit tiers).\n- `animation-holiday-or-rental-EN-sans-musique.mp4` : même vidéo muette, pour ajouter un son de la bibliothèque Instagram à la publication (recommandé).\nSource modifiable : `animation.html` (fonction render(t)), rendu par `outils/rendu-animation.js` puis ffmpeg.\n\n## Déroulé\n| Temps | Texte à l'écran |\n| --- | --- |\n| 0 – 3 s | Holiday home / or rental investment? |\n| 3,3 – 6,5 s | Start with your goal. |\n| 6,6 – 11 s | Two different searches : Holiday home (the area you love, the comfort you want, the time you will spend there) / Rental investment (rules, demand and total costs, checked property by property) |\n| 11 – 14 s | Your goal shapes the area, the property and the budget. |\n| 14,2 – 18 s | Send me your budget and project. Private message @avishay.marbella. Mention : no rental income or tourist licence is assumed. |\n\n## Légende anglaise\nHoliday home or rental investment? In Marbella, the answer changes everything: the area, the type of property, the rules to check and the real budget.\n\nStart with your goal. Send me your budget and your project in a private message and I will come back with a clear plan, between Cabopino and Casares.\n\n#Marbella #MarbellaRealEstate #CostaDelSol #PropertyInSpain #HolidayHome #NuevaAndalucia\n\n## Note interne\nAucun chiffre, aucun rendement, aucune promesse de licence touristique : rien à sourcer. La mention « checked property by property » renvoie au Decreto 28/2016 (Junta de Andalucía) sans le citer à l'écran.\n"}]}, "remplace_par": "C-2026-11-18-animation-vrai-cout-achat-1M"}, {"id": "C-2026-11-09-carrousel-buying-marbella", "tache_id": "2026-11-09-carrousel-buying-marbella", "activite": "immo", "titre": "Buying in Marbella: 5 questions to ask before choosing a property", "format": "carrousel", "langue": "en", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-09-carrousel-buying-marbella/slide-1.png", "contenus/2026-11-09-carrousel-buying-marbella/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-11-carrousel-buying-marbella-v2/"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [], "apercu": {"medias": [{"type": "image", "url": "/_blob/b9b7aef317b774ba910e49091ffae36a", "libelle": "Diapositive 1 (V3)"}, {"type": "image", "url": "/_blob/adab0d43c693272de04048828a04e0a2", "libelle": "Diapositive 2 (V3)"}, {"type": "image", "url": "/_blob/3caa898ec2be78d19d7a76522ef38edb", "libelle": "Diapositive 3 (V3)"}, {"type": "image", "url": "/_blob/71e8ae67c2a46235465b8e097763325f", "libelle": "Diapositive 4 (V3)"}, {"type": "image", "url": "/_blob/953e9ab369ff03423e47841fe75aa653", "libelle": "Diapositive 5 (V3)"}, {"type": "image", "url": "/_blob/bd8aa095af867c4b939adf35c1956a4f", "libelle": "Diapositive 6 (V3)"}, {"type": "image", "url": "/_blob/a77d4f19d359f4a9e1adef690d30de19", "libelle": "Diapositive 7 (V3)"}, {"type": "image", "url": "/_blob/7616c438a64627327c4d36031ffcb181", "libelle": "Diapositive 8 (V3)"}], "textes": [{"titre": "Légende et note interne", "texte": "# Carrousel « Buying in Marbella: 5 questions » – statut : à valider par Avishay\n\nVisuels : `slide-1.png` à `slide-6.png` (1080 × 1350, format portrait Instagram). Source modifiable : `carrousel.html` (rendu par `outils/capture.js`).\nIdentité provisoire (encre, ivoire, sable ; Cormorant Garamond + Inter, polices libres OFL). Aucun logo d'agence : « Levy & Goldman » apparaît en texte seulement sur la dernière diapositive.\n\n## Légende anglaise (à publier en collaboration avec Levy & Goldman)\n\nBuying in Marbella starts with the right questions, not with the first beautiful view.\n\nBefore you choose a property, be clear on five points:\n1. How will you use it: holiday home, rental, renovation or a plot?\n2. Which area fits your way of life, all year round?\n3. What is your total budget, including taxes and fees?\n4. How will you finance it, and has a bank pre-approved you?\n5. Have the legal checks been done by an independent lawyer?\n\nSave this for your search. If you are planning a purchase between Cabopino and Casares, send me your project in a private message and I will guide you through each step, with our partner banks and lawyers.\n\nGeneral information, not legal or tax advice.\n\n#Marbella #MarbellaRealEstate #CostaDelSol #NuevaAndalucia #Estepona #Benahavis #BuyingInSpain #PropertyInSpain\n\n## Note interne (français) – sources et vérifications\n\n| Affirmation sur les visuels | Source | Statut |\n| --- | --- | --- |\n| Revente en Andalousie : ITP 7 % (taux général) | Agencia Tributaria de Andalucía, loi 5/2021 art. 43 (taux général 7 %, réductions 6 % / 3,5 % pour résidence habituelle sous plafonds) ; recoupé par hipotecalc.com/itp/andalucia (23/08/2026) et solprop.es (03/03/2026) | Vérifié, taux en vigueur 2026 |\n| Neuf : TVA 10 % + AJD 1,2 % | Loi 37/1992 sur la TVA, art. 91 (10 % logement) ; AJD Andalousie 1,2 % (ATA) ; recoupé par expatandalucia.com (12/03/2026) et wesellhomes.es (06/10/2026) | Vérifié |\n| « Notary, land registry and legal fees » en plus | Punto de Acceso General (administracion.gob.es, mise à jour 30/03/2026) | Vérifié, aucun montant affiché volontairement |\n| Les banques prêtent aux non-résidents, plafond fixé par chaque banque, généralement plus bas que pour les résidents | Banco de España, guide client (prêt hypothécaire) ; loi 5/2019 crédit immobilier ; exemple Bankinter jusqu'à 60 % pour un non-résident en résidence secondaire (cité par advisorsinspain.com, 24/08/2026) | Formulé sans chiffre : les 60-70 % souvent cités viennent de sources secondaires |\n| NIE, nota simple (propriétaire, hypothèques, charges), licences, IBI et charges de copropriété à jour, avocat indépendant | Punto de Acceso General (nota simple : titulaire, cargas) ; Colegio de Registradores (sede.registradores.org) ; checklist property-lawyers.com (05/2026) | Vérifié, liste de bon sens sans conseil juridique personnalisé |\n| La location touristique exige un enregistrement à vérifier bien par bien | Junta de Andalucía, Decreto 28/2016 (viviendas con fines turísticos, inscription au registre RTA) | Formulé sans promesse ; ne pas dire qu'une villa en est dispensée |\n\nPoints volontairement absents : aucun rendement, aucun taux d'emprunt, aucun délai, rien sur la fiscalité des non-résidents (trop dépendante du pays), rien sur le Golden Visa (supprimé en 2025).\n\nRègle : revérifier les taux ITP/AJD avant chaque republication (le taux ITP andalou est fixé par la région ; une baisse à 6,75 % a été annoncée pour 2027, non en vigueur au 9 novembre 2026).\n\n## Déclinaisons prévues\n- FR : même maquette, texte traduit (« Acheter à Marbella : 5 questions à se poser »), après validation de la version EN.\n- ES : idem, plus tard.\n"}]}}, {"id": "C-2026-11-09-reel-AB-0001", "tache_id": "2026-11-09-reel-AB-0001", "activite": "immo", "titre": "AB-0001 – villa, Nueva Andalucía", "format": "reel", "langue": "en", "statut": "remplace", "date_prevue": null, "bien": "AB-0001", "fichiers": ["/mnt/project-files/agence-immo/contenus/2026-11-09-reel-AB-0001/AB-0001-reel-EN-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-09-reel-AB-0001/AB-0001-reel-EN-fond-musical.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-09-reel-AB-0001/AB-0001-couverture.jpg", "contenus/2026-11-09-reel-AB-0001/brouillon-textes.md", "contenus/2026-11-09-reel-AB-0001/plan-montage.json"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [], "apercu": {"medias": [], "textes": [{"titre": "Textes et légende", "texte": "# Reel AB-0001 (AB-0001) – version de travail 1,
