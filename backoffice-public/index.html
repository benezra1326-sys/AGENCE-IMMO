project/chan_01YV25RD4NMbS9mVTQvDETNJ?thread=cmsg_01YV25RD4NMbS9mVTQvDETNJ6ZthQh5BzKqubwDv7TTiw9", "liens": [{"libelle": "Démo", "url": "https://motek-demo.vercel.app"}, {"libelle": "PR #25 correctifs", "url": "https://github.com/benezra1326-sys/KAPARA/pull/25"}], "maj_le": "2026-11-23T12:50:00Z", "nom": "Tests & qualité", "prochaine_etape": "Fusion de la PR #25 par Avishay, puis nouveau passage de tests après chaque republication de la démo.", "projet": "kapara", "role": "Teste la démo en ligne au format iPhone, corrige les petits bugs par PR, liste les bugs par priorité", "specialite": "qualite", "statut": "a_valider"}}, "contenu_videos": {}, "contenu_agents": {"design": {"avancement": 0, "maj_le": "2026-11-23T12:30", "nom": "Malo · Design", "prenom": "Malo", "prochaine_etape": "Améliorer encore le design du hublot V2 (ton retour du 23/11).", "role": "Direction artistique et animations : identité du compte, une idée visuelle forte par plan, contrôle image par image.", "statut": "en_cours"}, "montage": {"avancement": 0, "maj_le": "2026-11-23T12:30", "nom": "Sacha · Montage", "prenom": "Sacha", "prochaine_etape": "Monter le hublot V3 dès que la voix et le design sont prêts.", "role": "Cale les animations sur la voix, musique, bruitages, mixage, sous-titres, export, puis dépose la vidéo dans « À valider ».", "statut": "en_cours"}, "sujet": {"avancement": 0, "maj_le": "2026-11-23T12:30", "nom": "Jeanne · Sujet (recherche et script)", "prenom": "Jeanne", "prochaine_etape": "Reprendre le hublot, le code-barres et les oignons selon tes retours.", "role": "Vérifie chaque fait (2 sources fiables minimum), met ton script en forme sans le réécrire, découpe par plan et minute le storyboard.", "statut": "en_cours"}, "voix": {"avancement": 0, "maj_le": "2026-11-23T12:30", "nom": "Inès · Voix", "prenom": "Inès", "prochaine_etape": "Refaire la voix du hublot, beaucoup plus fluide (ton retour du 23/11).", "role": "Narration ElevenLabs fluide et naturelle : phrases entières, rythme travaillé, réglages testés, réécoute complète avant transmission.", "statut": "en_cours"}}, "contenu_a_valider": {"CUR-E001": {"ajoute_le": "2026-11-23", "alerte": "v3 : design v2 + voix provisoire en prise continue (plus fluide) + textes dans les zones sûres des réseaux. La vraie voix ElevenLabs remplacera celle-ci dès que la clé est au bon endroit.", "compte": "Curiosités du quotidien", "duree": "21 s", "fichier": "videos/comptes/curiosites/rubriques/objets-et-mecanismes/E001-trou-du-hublot/final/CUR-E001-hublot.mp4", "ordre": 1, "poster": "/_blob/21e04bea2f54500c7bbc8c44d11e9ddd", "publication": "# Publication · CUR-E001 hublot\n\n**Titre** : Pourquoi il y a un petit trou dans le hublot ?\n\n**Légende** : Ce minuscule trou n'est pas un défaut. Il fait passer la pression de la cabine entre les panneaux pour que le panneau extérieur encaisse l'effort. Sources : Smithsonian (How Things Fly), Airbus Safety First.\n\n**Commentaire épinglé (proposé)** : Bonus : le panneau du milieu sert aussi de secours si le panneau extérieur cède.\n\n**Hashtags** : #avion #hublot #commentcamarche #curiosites #lesavaistu\n", "script": "# CUR-E001 · Le petit trou du hublot\n\nRubrique : Objets et mécanismes · durée 25.6 s · 69 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\n\n## Accroches\n\n- **A (retenue, texte approuvé)** : « Tu as déjà remarqué ce minuscule trou au bas du hublot ? Ce n’est pas un défaut. »\n- **B (variante proposée, à valider, non montée)** : « Ce petit trou dans ton hublot ? Il est là exprès. »\n\n## Texte exact (mot pour mot)\n\nTu as déjà remarqué ce minuscule trou au bas du hublot ? Ce n’est pas un défaut.\nUn hublot comporte plusieurs panneaux,\net ce petit évent laisse la pression de la cabine passer dans l’espace entre eux.\nRésultat : le panneau extérieur supporte la plus grande partie de la différence de pression avec l’extérieur. Il est conçu pour ça.\nUn détail presque invisible, mais essentiel au fonctionnement du hublot.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image | Son |\n|---|---|---|---|\n| 00,35–04,35 s | Tu as déjà remarqué ce minuscule trou au bas du hublot ? Ce n’est pas un défaut. | Plan serré sur le trou au bas du hublot, anneau citron vert qui pulse, dézoom vers le hublot entier. Titre « Ce trou est volontaire. » | souffle doux |\n| 04,63–06,42 s | Un hublot comporte plusieurs panneaux, | Bascule en vue en coupe : les panneaux s'écartent (intérieur, milieu, extérieur). Titre « Plusieurs panneaux » | souffle + 3 tics |\n| 06,50–10,66 s | et ce petit évent laisse la pression de la cabine passer dans l’espace entre eux. | Le trou du panneau du milieu s'allume ; l'air de la cabine (points) passe par le trou et remplit l'espace entre les panneaux. Titre « Un petit évent » | — |\n| 10,94–18,10 s | Résultat : le panneau extérieur supporte la plus grande partie de la différence de pression avec l’extérieur. Il est conçu pour ça. | Flèches citron vert sur le panneau extérieur, petites flèches côté extérieur ; le panneau extérieur s'allume puis contour pointillé. Titre « Le panneau extérieur encaisse » | pop |\n| 18,38–22,17 s | Un détail presque invisible, mais essentiel au fonctionnement du hublot. | Retour sur le hublot vu de face ; carton : « Un détail presque invisible, mais essentiel. » + « Enregistre-la pour ton prochain vol. » | souffle, motif de fin |\n| 22,17–25,65 s | (silence) | carton final reste à l'écran | motif musical de fin |\n", "serie": "Objets et mécanismes", "sources": "# Sources · CUR-E001 hublot\n\nVérifié le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| Le hublot comporte plusieurs panneaux ; le trou (« bleed hole ») est dans le panneau du milieu | Smithsonian National Air and Space Museum, How Things Fly : https://howthingsfly.si.edu/ask-an-explainer/why-dont-windows-planes-shatter-due-pressure-difference-inside-and-outside-cabin |\n| L'évent fait passer la pression de la cabine entre les panneaux ; le panneau extérieur supporte la différence de pression | Même source + Airbus Safety First (lien fourni par Avishay) : https://safetyfirst.airbus.com/under-the-spotlights/?airbus-iframe=true&airbus-post=2055 |\n\n## Nuances\n- Le nombre de panneaux varie selon l'avion (souvent trois, dont un panneau intérieur anti-rayures qui ne participe pas à la structure). Le texte dit « plusieurs », ce qui reste exact.\n- Le panneau du milieu sert de secours si le panneau extérieur cède. Non dit dans la vidéo, utile en commentaire épinglé.\n", "titre": "Ép. 1 · Pourquoi y a-t-il un petit trou dans le hublot ? (v3)", "type": "video", "video": "/_blob/dc0c6e69ba46c7d525741e609cebfff9"}, "CUR-E003": {"ajoute_le": "2026-11-23", "alerte": "Voix provisoire (synthèse locale). Elle sera remplacée par la voix ElevenLabs, avec le même texte.", "compte": "Curiosités du quotidien", "duree": "26 s", "fichier": "videos/comptes/curiosites/rubriques/corps-perception-nature/E003-oignons-larmes/final/CUR-E003-oignons.mp4", "ordre": 3, "poster": "/_blob/8079f0d7ea3db6567f2b225b3f7500fe", "publication": "# Publication · CUR-E003 oignons\n\n**Titre** : Pourquoi l'oignon fait pleurer ?\n\n**Légende** : Ce n'est pas l'oignon qui t'attaque : en le coupant, tu déclenches une réaction chimique qui libère une molécule irritante pour les yeux. Astuce : refroidis-le avant. Sources : American Chemical Society.\n\n**Commentaire épinglé (proposé)** : Le froid réduit les larmes, mais ne les supprime pas complètement : il ralentit la réaction.\n\n**Hashtags** : #oignon #cuisine #chimie #curiosites #lesavaistu\n", "script": "# CUR-E003 · Pourquoi les oignons font pleurer\n\nRubrique : Corps, perception et nature · durée 26.1 s · 73 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\n\n## Accroches\n\n- **A (retenue, texte approuvé)** : « Quand tu coupes un oignon, tu abîmes ses cellules. »\n- **B (variante proposée, à valider, non montée)** : « Ce n'est pas l'oignon qui te fait pleurer. C'est ce que tu lui fais. »\n\n## Texte exact (mot pour mot)\n\nQuand tu coupes un oignon, tu abîmes ses cellules.\nUne réaction chimique libère alors une molécule volatile\nqui remonte jusqu’à tes yeux.\nIls l’irritent, et tes glandes lacrymales se mettent à produire des larmes pour évacuer cette substance.\nCe n’est pas l’oignon qui “attaque” tes yeux : c’est sa chimie qui se déclenche au moment où tu le découpes.\nEt oui, le refroidir avant de le couper peut aider à réduire les larmes.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image | Son |\n|---|---|---|---|\n| 00,35–02,66 s | Quand tu coupes un oignon, tu abîmes ses cellules. | Une lame tranche un demi-oignon ; une larme apparaît aussitôt à l'œil. Titre « Pourquoi l'oignon fait pleurer ? » | souffle, déchirure |\n| 02,94–06,11 s | Une réaction chimique libère alors une molécule volatile | Vue stylisée des cellules qui s'ouvrent ; deux composés séparés se rencontrent ; la molécule volatile (citron vert) se forme et monte. Titre « Des cellules abîmées » | pops |\n| 06,19–07,63 s | qui remonte jusqu’à tes yeux. | Un petit nuage citron vert remonte de l'oignon jusqu'à l'œil. Titre « Un nuage vers tes yeux » | souffle |\n| 07,91–13,27 s | Ils l’irritent, et tes glandes lacrymales se mettent à produire des larmes pour évacuer cette substance. | Irritation (traits citron vert), la glande lacrymale s'allume, les larmes coulent et emportent le nuage. Titre « L'œil se rince » | gouttes |\n| 13,55–18,51 s | Ce n’est pas l’oignon qui “attaque” tes yeux : c’est sa chimie qui se déclenche au moment où tu le découpes. | Oignon entier : rien ne se passe, « attaque ? » barré. Oignon coupé : la réaction démarre au moment de la coupe. Titre « Une réaction chimique » | souffle, pop |\n| 18,79–22,60 s | Et oui, le refroidir avant de le couper peut aider à réduire les larmes. | Oignon refroidi (flocons), coupé : nuage plus petit. Titre « Le froid aide » | tic, souffle |\n| 22,60–26,08 s | (silence) | carton : « Une réaction chimique, pas un mystère. » + « Enregistre-la pour ton prochain repas. » | tampon, motif de fin |\n", "serie": "Corps, perception et nature", "sources": "# Sources · CUR-E003 oignons\n\nVérifié le 23/11/2026 (sources fournies par Avishay).\n\n| Affirmation | Source |\n|---|---|\n| Couper l'oignon abîme ses cellules ; une réaction enzymatique libère une molécule volatile irritante (syn-propanethial-S-oxyde) qui atteint les yeux et déclenche les larmes | American Chemical Society, Molecule of the Week : https://www.acs.org/molecule-of-the-week/archive/p/syn-propanethial-s-oxide.html |\n| Refroidir l'oignon avant de le couper peut réduire les larmes | ACS, C&EN Newscripts : https://pubs.acs.org/doi/10.1021/cen-09044-newscripts |\n\n## Nuances\n- Texte conservé tel qu'approuvé : « Ils l'irritent » renvoie à la molécule (singulier). Je n'ai rien changé, comme demandé ; à corriger seulement si tu le souhaites (« Elle les irrite »).\n- Le froid ralentit la réaction et la volatilité : il réduit les larmes sans les supprimer.\n", "titre": "Ép. 3 · Pourquoi les oignons font pleurer", "type": "video", "video": "/_blob/50a3536cf143905bc329c313a8acc409"}, "CUR-E004": {"ajoute_le": "2026-11-23", "alerte": "Voix provisoire (prise continue). La voix ElevenLabs la remplacera, même texte.", "compte": "Curiosités du quotidien", "duree": "22 s", "fichier": "videos/comptes/curiosites/rubriques/science-du-quotidien/E004-cuillere-metal-bois/final/", "ordre": 4, "poster": "/_blob/cbc11efa4f6c6926492bd4ec9b459310", "publication": "# Publication · CUR-E004\n\n**Titre** : Pourquoi la cuillère en métal paraît plus froide ?\n\n**Légende** : Même température, sensation différente : le métal emporte la chaleur de ta peau bien plus vite que le bois. Sources : American Physical Society, Exploratorium, BBC Bitesize.\n\n**Hashtags** : #curiosites #lesavaistu #science #commentcamarche\n", "script": "# CUR-E004 · Pourquoi la cuillère en métal paraît plus froide que celle en bois ?\n\nRubrique : Science du quotidien · durée 21.9 s · statut : approuvé par Avishay le 23/11/2026 (propositions de réserve) — texte mot pour mot\n\n## Accroches\n\n- **A** : Ces deux cuillères sont à la même température. Pourtant…\n- **B** : Ta main est un mauvais thermomètre.\n\n## Texte exact (mot pour mot)\n\nCes deux cuillères sont posées dans la même cuisine, à la même température.\nPourtant, celle en métal paraît plus froide.\nTa main est plus chaude que la pièce, donc la chaleur passe de ta peau vers l'objet.\nLe métal conduit très bien la chaleur :\nil l'emporte vite, ta peau se refroidit, et tu sens du froid.\nLe bois conduit mal : ta peau reste presque à sa température.\nCe que tu sens, ce n'est pas la température de l'objet, c'est la chaleur que tu perds.\n\n## Storyboard validé\n\n0–3 s deux cuillères, deux thermomètres identiques ; 3–9 s main, flèches de chaleur ; 9–16 s métal : flèches rapides, peau qui bleuit ; 16–22 s bois : flèches lentes ; 22–26 s conclusion.\n\n## Minutage (voix provisoire)\n\n| Temps | Texte dit |\n|---|---|\n| 00,15–03,54 s | Ces deux cuillères sont posées dans la même cuisine, à la même température. |\n| 03,64–05,50 s | Pourtant, celle en métal paraît plus froide. |\n| 05,60–08,78 s | Ta main est plus chaude que la pièce, donc la chaleur passe de ta peau vers l'objet. |\n| 08,88–11,50 s | Le métal conduit très bien la chaleur : |\n| 11,60–13,42 s | il l'emporte vite, ta peau se refroidit, et tu sens du froid. |\n| 13,52–16,47 s | Le bois conduit mal : ta peau reste presque à sa température. |\n| 16,57–20,34 s | Ce que tu sens, ce n'est pas la température de l'objet, c'est la chaleur que tu perds. |\n", "serie": "Science du quotidien", "sources": "# Sources · CUR-E004\n\nVérifié le 23/11/2026.\n\n- American Physical Society https://www.aps.org/learning-resources/getting-warmer-colder\n- Exploratorium https://www.exploratorium.edu/snacks/cold-metal\n- BBC Bitesize https://www.bbc.co.uk/bitesize/articles/zh63ydm\n\n## Nuances\n- Aucune.\n", "titre": "Ép. 4 · Pourquoi la cuillère en métal paraît plus froide que celle en bois ?", "type": "video", "video": "/_blob/9c930355c1d6e0706c2e59794739b5a7"}, "CUR-E005": {"ajoute_le": "2026-11-23", "alerte": "Voix provisoire (prise continue). La voix ElevenLabs la remplacera, même texte.", "compte": "Curiosités du quotidien", "duree": "23 s", "fichier": "videos/comptes/curiosites/rubriques/technologie-du-quotidien/E005-qr-code-abime/final/", "ordre": 5, "poster": "/_blob/dc3173811a3a6ddd25e41441e58f3015", "publication": "# Publication · CUR-E005\n\n**Titre** : Pourquoi un QR code abîmé se lit encore ?\n\n**Légende** : Il lui manque un coin, et ton téléphone le lit quand même. Ce n'est pas de la chance : c'est prévu dès sa création.\n\n**Hashtags** : #curiosites #lesavaistu #science #commentcamarche\n", "script": "# CUR-E005 · Pourquoi un QR code abîmé fonctionne encore ?\n\nRubrique : Technologie du quotidien · durée 23.3 s · statut : approuvé par Avishay le 23/11/2026 (propositions de réserve) — texte mot pour mot\n\n## Accroches\n\n- **A** : Il manque un coin à ce QR code. Et il marche quand même.\n- **B** : Un QR code peut perdre jusqu'à environ 30 % de lui-même.\n\n## Texte exact (mot pour mot)\n\nIl manque un morceau à ce QR code, et ton téléphone le lit quand même.\nCe n'est pas de la chance.\nUn QR code contient tes données, plus des données de secours calculées à partir d'elles.\nSi une partie est sale ou déchirée, le lecteur reconstruit ce qui manque.\nSelon le niveau choisi à la création, on peut récupérer environ 7 à 30 % des données.\nLe QR code se répare tout seul, dans une certaine limite.\n\n## Storyboard validé\n\n0–3 s QR code déchiré, scan réussi ; 3–9 s le carré se sépare en données + données de secours ; 9–16 s on efface des modules, le lecteur les recolore ; 16–22 s jauge 7 % / 15 % / 25 % / 30 % ; 22–26 s trop abîmé : échec, limite.\n\n## Minutage (voix provisoire)\n\n| Temps | Texte dit |\n|---|---|\n| 00,15–03,45 s | Il manque un morceau à ce QR code, et ton téléphone le lit quand même. |\n| 03,55–04,59 s | Ce n'est pas de la chance. |\n| 04,81–08,43 s | Un QR code contient tes données, plus des données de secours calculées à partir d'elles. |\n| 08,67–11,81 s | Si une partie est sale ou déchirée, le lecteur reconstruit ce qui manque. |\n| 12,24–16,67 s | Selon le niveau choisi à la création, on peut récupérer environ 7 à 30 % des données. |\n| 16,96–20,07 s | Le QR code se répare tout seul, dans une certaine limite. |\n", "serie": "Technologie du quotidien", "sources": "# Sources · CUR-E005\n\nVérifié le 23/11/2026.\n\n- DENSO WAVE (inventeur du QR code), page Error correction https://www.qrcode.com/en/about/error_correction.html\n- DENSO WAVE, spécification https://www.qrcode.com/en/about/standards.html\n\n## Nuances\n- les pourcentages portent sur les « mots de code », pas exactement sur la surface. Les trois carrés de repérage doivent rester lisibles.\n", "titre": "Ép. 5 · Pourquoi un QR code abîmé fonctionne encore ?", "type": "video", "video": "/_blob/accd9a6c415e48ae58d46c77c62841d3"}, "CUR-E009": {"ajoute_le": "2026-11-23", "alerte": "voix provisoire (Kokoro, une seule prise, débit posé, sous-titres mot à mot). La voix ElevenLabs la remplacera dès que la clé fonctionne.", "compte": "Curiosités du quotidien", "duree": "23 s", "fichier": "videos/comptes/curiosites/rubriques/science-du-quotidien/E009-bulles-paroi/final/CUR-E009-bulles.mp4", "ordre": 9, "poster": "/_blob/534ddf94f5beda09cf05538fd5cc7e4e", "publication": "# Publication · CUR-E009\n\n**Titre** : D'où viennent les bulles sur la paroi de ton verre d'eau ?\n\n**Légende** : Ces petites bulles dans ton verre d'eau plate ne viennent pas du verre : c'est l'air dissous dans l'eau qui sort et s'accroche aux minuscules rayures de la paroi. Sources : BBC Science Focus, Hong Kong Observatory.\n\n**Commentaire épinglé (proposé)** : Bonus : c'est le même principe qui fait monter des colonnes de bulles toujours au même endroit dans une coupe de champagne.\n\n**Hashtags** : #science #eau #bulles #curiosites #lesavaistu\n", "script": "# CUR-E009 · D'où viennent les bulles sur la paroi de ton verre d'eau ?\n\nRubrique : Science du quotidien · durée 23.4 s · 85 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\nVoix : provisoire (Kokoro ff_siwis, une seule prise, minutage mot à mot). Elle sera remplacée par ElevenLabs dès que la clé fonctionne.\n\n## Accroches\n- **A (retenue)** : Pourquoi des bulles apparaissent dans un verre d'eau plate ? (retenue : c'est la première phrase du texte approuvé)\n- **B** : Ton eau plate contient de l'air. La preuve est collée au verre. (variante, non montée)\n\n## Texte exact (mot pour mot)\n\nPourquoi des bulles apparaissent dans un verre d'eau plate laissé sur la table ?\nL'eau du robinet contient de l'air dissous, invisible.\nQuand elle se réchauffe, elle en garde moins, et cet air doit sortir.\nMais une bulle a du mal à naître en plein liquide.\nElle se forme là où c'est plus facile :\nsur les minuscules rayures, poussières ou fibres de la paroi.\nOn appelle ces points des sites de nucléation.\nLes bulles ne viennent pas du verre : elles viennent de l'eau.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image |\n|---|---|---|\n| 00,12–03,33 s | Pourquoi des bulles apparaissent dans un verre d'eau plate laissé sur la table ? | Verre d'eau sur la table, des bulles poussent sur la paroi en accéléré (petit cadran qui tourne). Titre « Des bulles dans l'eau plate ? » |\n| 03,65–06,01 s | L'eau du robinet contient de l'air dissous, invisible. | Plongée dans l'eau : molécules d'eau ivoire, l'air dissous apparaît en citron vert. Étiquette « air dissous » |\n| 06,31–09,33 s | Quand elle se réchauffe, elle en garde moins, et cet air doit sortir. | Thermomètre qui monte, l'air s'agite puis remonte (flèches) |\n| 09,63–11,65 s | Mais une bulle a du mal à naître en plein liquide. | Une bulle tente de naître au milieu du liquide et s'effondre ; « en plein liquide » barré |\n| 11,95–13,70 s | Elle se forme là où c'est plus facile : | Paroi vue en coupe : une bulle grossit dans une rayure |\n| 13,70–16,45 s | sur les minuscules rayures, poussières ou fibres de la paroi. | Apparition de la rayure, de la poussière, de la fibre ; une bulle sur chacune |\n| 16,75–18,79 s | On appelle ces points des sites de nucléation. | Les trois points s'allument : « sites de nucléation » |\n| 19,09–21,66 s | Les bulles ne viennent pas du verre : elles viennent de l'eau. | Retour au verre (même composition qu'au début) ; carton de fin |\n| 21,66–23,36 s | (fin) | Carton : Les bulles ne viennent pas du verre : elles viennent de l'eau. · Envoie-la à un buveur d'eau plate. |\n", "serie": "Science du quotidien", "sources": "# Sources · CUR-E009\n\nVérifiées le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| L'eau du robinet contient de l'air dissous ; les bulles se forment sur des imperfections de la paroi | BBC Science Focus : https://www.sciencefocus.com/science/what-are-the-small-bubbles-that-form-in-a-glass-of-water |\n| Nucléation : les bulles naissent plus facilement sur des rayures, poussières ou fibres | Hong Kong Observatory : https://www.hko.gov.hk/en/education/earth-science/physics-in-daily-life/00395-bubbles-in-a-soft-drink-part-i.html |\n| États de la matière (ressource éducative) | CERN : https://educational-resources.web.cern.ch/states-of-matter |\n\n## Nuances\n- « Plus chaude, l'eau garde moins d'air » relève de la physique standard (solubilité des gaz), sans source dédiée citée dans la vidéo.\n", "titre": "Ép. 9 · D'où viennent les bulles sur la paroi de ton verre d'eau ?", "type": "video", "video": "/_blob/0acaaf7329e8638c625245469421485b"}, "CUR-E010": {"ajoute_le": "2026-11-23", "alerte": "voix provisoire (Kokoro, une seule prise, débit posé, sous-titres mot à mot). La voix ElevenLabs la remplacera dès que la clé fonctionne.", "compte": "Curiosités du quotidien", "duree": "24 s", "fichier": "videos/comptes/curiosites/rubriques/histoire-mots-et-culture/E010-prix-en-9/final/CUR-E010-prix-en-9.mp4", "ordre": 10, "poster": "/_blob/6f0866b46a0afd6bd81f0f27596c107b", "publication": "# Publication · CUR-E010\n\n**Titre** : Pourquoi tant de prix finissent par 9 ?\n\n**Légende** : 2,99 € paraît bien moins cher que 3 €, pour un seul centime. On lit les prix de gauche à droite et le premier chiffre pèse plus que les autres. Sources : Journal of Consumer Research (2005), Journal of Marketing Research (2020).\n\n**Commentaire épinglé (proposé)** : L'effet est plus faible quand le premier chiffre ne change pas : 2,49 contre 2,50, presque rien.\n\n**Hashtags** : #prix #psychologie #consommation #curiosites #lesavaistu\n", "script": "# CUR-E010 · Pourquoi tant de prix finissent par 9 ?\n\nRubrique : Histoire, mots et culture · durée 23.8 s · 78 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\nVoix : provisoire (Kokoro ff_siwis, une seule prise, minutage mot à mot). Elle sera remplacée par ElevenLabs dès que la clé fonctionne.\n\n## Accroches\n- **A (retenue)** : 2,99 € au lieu de 3 €. (retenue : première phrase du texte approuvé, étiquettes visibles dès l'image 0)\n- **B** : Ton cerveau lit les prix de gauche à droite, et ça compte. (variante, non montée)\n\n## Texte exact (mot pour mot)\n\n2,99 € au lieu de 3 €.\nUn seul centime d'écart, mais ce prix paraît nettement moins cher.\nLes chercheurs appellent ça l'effet du chiffre de gauche.\nOn lit un prix de gauche à droite, et le premier chiffre pèse plus que les autres.\n2,99 commence par 2, donc on le range dans les « deux euros ».\nL'effet joue surtout quand le premier chiffre change.\nLe 9 n'est pas magique :\nil exploite la manière dont on lit.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image |\n|---|---|---|\n| 00,12–02,74 s | 2,99 € au lieu de 3 €. | Deux étiquettes qui se balancent : 2,99 € (le 2 en citron vert) et 3,00 €. Titre « 1 centime qui change tout » |\n| 03,04–05,98 s | Un seul centime d'écart, mais ce prix paraît nettement moins cher. | Deux jauges : écart réel (1 centime, minuscule) et écart ressenti (grande barre citron vert) |\n| 06,28–08,55 s | Les chercheurs appellent ça l'effet du chiffre de gauche. | Gros plan sur 2,99 ; le 2 passe en citron vert. Titre « L'effet du chiffre de gauche » |\n| 08,85–12,34 s | On lit un prix de gauche à droite, et le premier chiffre pèse plus que les autres. | Un curseur lit de gauche à droite ; le 2 grossit, les 9 rétrécissent ; poids sous chaque chiffre |\n| 12,64–15,98 s | 2,99 commence par 2, donc on le range dans les « deux euros ». | Deux bacs « deux euros » / « trois euros » : 2,99 tombe dans « deux euros » |\n| 16,28–18,58 s | L'effet joue surtout quand le premier chiffre change. | Comparaison : 2,99/3,00 (premier chiffre ≠, effet fort) et 2,49/2,50 (premier chiffre =, effet faible) |\n| 18,90–20,18 s | Le 9 n'est pas magique : | Un 9 entouré d'étincelles qui disparaissent ; carton de fin |\n| 20,40–22,07 s | il exploite la manière dont on lit. | Carton de fin |\n| 22,07–23,77 s | (fin) | Carton : Le 9 n'est pas magique : il exploite la manière dont on lit. · Envoie-la à un fan de promos. |\n", "serie": "Histoire, mots et culture", "sources": "# Sources · CUR-E010\n\nVérifiées le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| Effet du chiffre de gauche ; il joue surtout quand le premier chiffre change | Thomas & Morwitz (2005), Journal of Consumer Research : https://academic.oup.com/jcr/article/32/1/54/1796360 |\n| L'effet varie selon les produits et les études | Sokolova, Seenivasan & Thomas (2020), Journal of Marketing Research : https://journals.sagepub.com/doi/full/10.1177/0022243720932532 |\n\n## Nuances\n- L'effet existe mais son ampleur varie selon les produits et les études ; aucun chiffre de hausse des ventes n'est donné.\n- La comparaison 2,49 / 2,50 illustre le cas où le premier chiffre ne change pas (effet faible selon Thomas & Morwitz).\n", "titre": "Ép. 10 · Pourquoi tant de prix finissent par 9 ?", "type": "video", "video": "/_blob/a975d466df02d1014b4f70acf4a1f853"}, "CUR-E011": {"ajoute_le": "2026-11-23", "alerte": "voix provisoire (Kokoro, une seule prise, débit posé, sous-titres mot à mot). La voix ElevenLabs la remplacera dès que la clé fonctionne.", "compte": "Curiosités du quotidien", "duree": "24 s", "fichier": "videos/comptes/curiosites/rubriques/corps-perception-nature/E011-gecko-plafond/final/CUR-E011-gecko-plafond.mp4", "ordre": 11, "poster": "/_blob/cb42ae1100b5e6b6d1887d78bd6827eb", "publication": "# Publication · CUR-E011\n\n**Titre** : Comment le gecko tient au plafond ?\n\n**Légende** : Ni colle, ni ventouse : sous les doigts du gecko, des millions de poils se divisent en pointes ultra-fines. Des milliards de minuscules attractions entre molécules le tiennent au plafond. Sources : Nature (2000), PNAS (2002).\n\n**Commentaire épinglé (proposé)** : Ces travaux ont inspiré des adhésifs « secs » réutilisables, testés en robotique.\n\n**Hashtags** : #gecko #nature #science #curiosites #lesavaistu\n", "script": "# CUR-E011 · Comment le gecko tient au plafond ?\n\nRubrique : Corps, perception et nature · durée 23.9 s · 76 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\nVoix : provisoire (Kokoro ff_siwis, une seule prise, minutage mot à mot). Elle sera remplacée par ElevenLabs dès que la clé fonctionne.\n\n## Accroches\n- **A (retenue)** : Le gecko marche au plafond sans colle et sans ventouse. (retenue : première phrase du texte approuvé, gecko qui marche dès l'image 0)\n- **B** : Le secret du gecko tient dans des poils minuscules. (variante, non montée)\n\n## Texte exact (mot pour mot)\n\nLe gecko marche au plafond sans colle et sans ventouse.\nLe secret est sous ses doigts.\nIls sont couverts de millions de poils microscopiques, qui se divisent encore en pointes des centaines de fois plus fines qu'un cheveu.\nCes pointes touchent la surface de si près que de minuscules forces d'attraction entre molécules s'additionnent.\nUne seule est négligeable, des milliards suffisent à le tenir.\nEt pour décoller, il lui suffit de changer l'angle de son doigt.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image |\n|---|---|---|\n| 00,12–02,94 s | Le gecko marche au plafond sans colle et sans ventouse. | Gecko vu d'en dessous qui marche sur un plafond ; « colle » et « ventouse » apparaissent puis sont barrés |\n| 03,29–04,40 s | Le secret est sous ses doigts. | Zoom sur une patte, puis sur un doigt collé au plafond : lamelles citron vert |\n| 04,70–10,36 s | Ils sont couverts de millions de poils microscopiques, qui se divisent encore en pointes des centaines de fois plus fines qu'un cheveu. | Des millions de poils sous les lamelles, puis un poil qui se divise en pointes ; comparaison cheveu / pointe |\n| 10,70–15,52 s | Ces pointes touchent la surface de si près que de minuscules forces d'attraction entre molécules s'additionnent. | Trois pointes qui s'approchent de la surface ; petites attractions entre molécules qui se multiplient |\n| 15,82–18,75 s | Une seule est négligeable, des milliards suffisent à le tenir. | « × 1 » (négligeable) puis « × des milliards » |\n| 19,07–22,20 s | Et pour décoller, il lui suffit de changer l'angle de son doigt. | Le doigt pivote et se décolle, arc citron vert « angle » ; carton de fin |\n| 22,20–23,90 s | (fin) | Carton : Pour décoller, il change l'angle de son doigt. · Envoie-la à un fan de reptiles. |\n", "serie": "Corps, perception et nature", "sources": "# Sources · CUR-E011\n\nVérifiées le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| Poils (soies) et pointes, attraction de van der Waals | Autumn et al. (2000), Nature : https://www.nature.com/articles/35015073 |\n| L'adhérence vient des forces entre molécules ; décollement par changement d'angle | Autumn et al. (2002), PNAS : https://www.pnas.org/doi/10.1073/pnas.192252799 |\n\n## Nuances\n- Des travaux plus récents montrent que l'humidité et d'autres interactions jouent aussi ; le texte dit « forces d'attraction entre molécules », ce qui reste exact.\n- Pointes de 0,2 à 0,5 µm (Nature 2000) contre ~70 µm pour un cheveu : « des centaines de fois plus fines ».\n", "titre": "Ép. 11 · Comment le gecko tient au plafond ?", "type": "video", "video": "/_blob/c578fed7ad09771614e3fa88a5cd453b"}, "CUR-E012": {"ajoute_le": "2026-11-23", "alerte": "voix provisoire (Kokoro, une seule prise, débit posé, sous-titres mot à mot). La voix ElevenLabs la remplacera dès que la clé fonctionne.", "compte": "Curiosités du quotidien", "duree": "25 s", "fichier": "videos/comptes/curiosites/rubriques/science-du-quotidien/E012-rideau-de-douche/final/CUR-E012-rideau-de-douche.mp4", "ordre": 12, "poster": "/_blob/ed2d24f61faa9449da8d4d611d4db183", "publication": "# Publication · CUR-E012\n\n**Titre** : Pourquoi le rideau de douche vient se coller à toi ?\n\n**Légende** : Le rideau de douche qui vient se coller à tes jambes ? En 2001, une simulation a montré que le jet crée un tourbillon d'air couché, avec une basse pression en son centre. Sources : Scientific American, Museum of Science Boston.\n\n**Commentaire épinglé (proposé)** : Cette simulation a valu à son auteur un prix Ig Nobel en 2001.\n\n**Hashtags** : #douche #physique #science #curiosites #lesavaistu\n", "script": "# CUR-E012 · Pourquoi le rideau de douche vient se coller à toi ?\n\nRubrique : Science du quotidien · durée 25.2 s · 80 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\nVoix : provisoire (Kokoro ff_siwis, une seule prise, minutage mot à mot). Elle sera remplacée par ElevenLabs dès que la clé fonctionne.\n\n## Accroches\n- **A (retenue)** : Tu ouvres la douche, et le rideau vient se coller à tes jambes. (retenue : première phrase du texte approuvé, rideau déjà en mouvement à l'image 0 ; titre « Le rideau t'attaque ? »)\n- **B** : Ce rideau a valu un prix à un chercheur. (variante, non montée)\n\n## Texte exact (mot pour mot)\n\nTu ouvres la douche, et le rideau vient se coller à tes jambes.\nPendant longtemps, personne n'était d'accord sur la raison.\nEn 2001, un chercheur a simulé une douche sur ordinateur.\nSon résultat : le jet entraîne l'air et crée un tourbillon couché, comme une petite tornade horizontale.\nAu centre de ce tourbillon, la pression baisse, et le rideau léger est aspiré.\nIl existe d'autres explications, comme l'air chaud qui monte.\nMais le rideau bouge aussi avec de l'eau froide.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image |\n|---|---|---|\n| 00,12–02,95 s | Tu ouvres la douche, et le rideau vient se coller à tes jambes. | Douche en coupe : pommeau, jet, jambes ; le rideau gonfle vers l'intérieur. Titre « Le rideau t'attaque ? » |\n| 03,25–05,53 s | Pendant longtemps, personne n'était d'accord sur la raison. | Scène atténuée, hypothèses « air chaud ? » « effet Bernoulli ? » et un grand « ? » |\n| 05,83–08,69 s | En 2001, un chercheur a simulé une douche sur ordinateur. | La scène devient un écran de simulation (cadre + maillage). Titre « 2001 : la simulation » |\n| 08,99–13,82 s | Son résultat : le jet entraîne l'air et crée un tourbillon couché, comme une petite tornade horizontale. | Flèche d'air entraîné par le jet, puis tourbillon couché citron vert qui tourne |\n| 14,12–17,68 s | Au centre de ce tourbillon, la pression baisse, et le rideau léger est aspiré. | Centre du tourbillon : « − » (basse pression) ; flèches, le rideau est aspiré jusqu'aux jambes |\n| 18,03–20,92 s | Il existe d'autres explications, comme l'air chaud qui monte. | Ondulations d'air chaud qui montent, étiquette « air chaud » |\n| 21,32–23,50 s | Mais le rideau bouge aussi avec de l'eau froide. | Thermomètre froid, eau bleutée, étiquette « eau froide » : le rideau bouge quand même ; carton de fin |\n| 23,50–25,20 s | (fin) | Carton : Le suspect n°1 : un tourbillon d'air. · Envoie-la à quelqu'un en guerre avec son rideau. |\n", "serie": "Science du quotidien", "sources": "# Sources · CUR-E012\n\nVérifiées le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| Simulation de David Schmidt (UMass Amherst) : tourbillon horizontal et basse pression | Scientific American : https://www.scientificamerican.com/article/why-does-the-shower-curta/ |\n| Autres explications et débat | Museum of Science Boston : https://www.mos.org/video/scientific-mystery-behind-shower-curtain-effect |\n\n## Nuances\n- Sujet encore discuté : la vidéo dit « un chercheur a simulé », pas « la science a prouvé ». Le carton de fin parle de « suspect n°1 ».\n", "titre": "Ép. 12 · Pourquoi le rideau de douche vient se coller à toi ?", "type": "video", "video": "/_blob/985d7befbda9ce2855be921df9c445bf"}, "CUR-E013": {"ajoute_le": "2026-11-23", "alerte": "voix provisoire (Kokoro, une seule prise, débit posé, sous-titres mot à mot). La voix ElevenLabs la remplacera dès que la clé fonctionne. Point à trancher : le sens d'origine de l'expression concernait la prostitution (client qui ne payait pas). Le texte approuvé ne le dit pas et les images restent neutres.", "compte": "Curiosités du quotidien", "duree": "23 s", "fichier": "videos/comptes/curiosites/rubriques/histoire-mots-et-culture/E013-poser-un-lapin/final/CUR-E013-poser-un-lapin.mp4", "ordre": 13, "poster": "/_blob/44406d2e6b352cdec28107599f14279e", "publication": "# Publication · CUR-E013\n\n**Titre** : D'où vient « poser un lapin » ?\n\n**Légende** : « Poser un lapin » vient de l'argot du XIXe siècle : poser, c'était faire attendre, et un lapin, un paiement jamais versé. Le sens a glissé de l'argent attendu à la personne attendue. Sources : Eurêkoi (BPI), Le Figaro.\n\n**Commentaire épinglé (proposé)** : Et toi, le pire lapin qu'on t'ait posé ?\n\n**Hashtags** : #expression #languefrancaise #histoire #curiosites #lesavaistu\n", "script": "# CUR-E013 · D'où vient « poser un lapin » ?\n\nRubrique : Histoire, mots et culture · durée 23.1 s · 73 mots · statut : approuvé par Avishay le 23/11/2026 — texte mot pour mot\nVoix : provisoire (Kokoro ff_siwis, une seule prise, minutage mot à mot). Elle sera remplacée par ElevenLabs dès que la clé fonctionne.\n\n## Accroches\n- **A (retenue)** : Pourquoi dit-on « poser un lapin » à quelqu'un qui ne vient pas au rendez-vous ? (retenue : première phrase du texte approuvé)\n- **B** : « Poser un lapin » n'a pas toujours voulu dire ça. (variante, non montée)\n\n## Texte exact (mot pour mot)\n\nPourquoi dit-on « poser un lapin » à quelqu'un qui ne vient pas au rendez-vous ?\nAu XIXe siècle, en argot, « poser » voulait dire faire attendre, et un « lapin » désignait un paiement qu'on ne versait jamais.\nPoser un lapin, c'était donc partir sans payer ce qu'on devait.\nLe sens a glissé : d'une attente déçue, celle de l'argent, on est passé à une autre, celle de la personne.\nL'origine exacte reste discutée par les spécialistes.\n\n## Storyboard minuté\n\n| Temps | Texte dit | Image |\n|---|---|---|\n| 00,12–03,31 s | Pourquoi dit-on « poser un lapin » à quelqu'un qui ne vient pas au rendez-vous ? | Table de café, tasse, chaise vide, horloge qui tourne ; un lapin vient s'asseoir sur la chaise au mot « lapin » |\n| 03,63–09,25 s | Au XIXe siècle, en argot, « poser » voulait dire faire attendre, et un « lapin » désignait un paiement qu'on ne versait jamais. | Fiche de dictionnaire « Argot · XIXe siècle » : poser = faire attendre, lapin = paiement jamais versé (surlignés) |\n| 09,55–12,35 s | Poser un lapin, c'était donc partir sans payer ce qu'on devait. | Une note « à payer » reste sur la table, des pas s'éloignent, tampon « IMPAYÉ » |\n| 12,69–18,94 s | Le sens a glissé : d'une attente déçue, celle de l'argent, on est passé à une autre, celle de la personne. | « une attente déçue… » : case « l'argent » puis case « la personne », flèche de glissement |\n| 19,24–21,42 s | L'origine exacte reste discutée par les spécialistes. | Retour au café (même composition qu'au début) ; carton « L'origine exacte reste discutée » |\n| 21,42–23,12 s | (fin) | Carton : L'origine exacte reste discutée par les spécialistes. · Envoie-la à un retardataire. |\n", "serie": "Histoire, mots et culture", "sources": "# Sources · CUR-E013\n\nVérifiées le 23/11/2026.\n\n| Affirmation | Source |\n|---|---|\n| Origine argotique du XIXe siècle : poser = faire attendre, lapin = paiement non versé | Eurêkoi, Bibliothèque publique d'information : https://www.eurekoi.org/quelle-est-lorigine-de-lexpression-poser-un-lapin |\n| Glissement de sens et origine discutée | Le Figaro, langue française : https://www.lefigaro.fr/langue-francaise/expressions-francaises/2017/07/11/37003-20170711ARTFIG00010-mais-d-o-vient-poser-un-lapin.php |\n\n## Nuances\n- Le sens d'origine concernait la prostitution (un client qui ne payait pas). Le texte approuvé reste factuel sans le dire, et les images restent neutres (note impayée, pas de personnage). À trancher par Avishay si besoin.\n- L'origine exacte est discutée ; la vidéo le dit.\n", "titre": "Ép. 13 · D'où vient « poser un lapin » ?", "type": "video", "video": "/_blob/6f96c6de3b522204d3f8538f5bbc1d48"}, "banque-sujets": {"ajoute_le": "2026-11-23", "contenu": "# Banque de sujets — 55 pistes notées\n\nDate : 23/11/2026. Notes de 1 à 5 sur 8 critères (total sur 40). **Toutes les pistes non marquées PILOTE sont des hypothèses à vérifier** avant écriture : rien n'est publié sans au moins deux sources fiables, primaires si possible.\n\nCritères : Rec. = reconnaissance immédiate · Surp. = surprise réelle · Vis. = force du visuel · Clar. = clarté en < 1 min · Src = solidité des sources · Part. = valeur à enregistrer/partager · Sér. = potentiel de série · Com. = intérêt commercial pertinent (ne dicte jamais les faits). Obsolescence : vitesse à laquelle l'info vieillit.\n\nComptes : **AD** = compte principal « Ah d'accord » (curiosités, séries reconnaissables) · **IA** = « IA en vrai ».\n\n| # | Compte | Série | Question | Angle visuel | Rec | Surp | Vis | Clar | Src | Part | Sér | Com | **Total** | Obsol. | Notes de vérification |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | AD | Une carte, une histoire | Pourquoi les cartes d
