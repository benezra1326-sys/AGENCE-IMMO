n\n## Plans retenus (repères dans la vidéo source)\n| Reel | Source | Plan |\n| --- | --- | --- |\n| 0,0 – 1,9 s | 43,2 – 45,0 | Façade éclairée au crépuscule (accroche) |\n| 1,9 – 3,7 | 5,2 – 7,0 | Drone : villa et fairway |\n| 3,7 – 5,6 | 9,1 – 11,0 | Façade et piscine de jour |\n| 5,6 – 7,4 | 7,2 – 9,0 | Piscine vue du ciel |\n| 7,4 – 9,2 | 15,2 – 17,0 | Piscine au ras de l'eau |\n| 9,2 – 11,0 | 13,1 – 14,9 | Transats et parasols |\n| 11,0 – 12,9 | 17,1 – 19,0 | Séjour |\n| 12,9 – 13,8 | 20,1 – 21,0 | Cuisine |\n| 13,8 – 15,7 | 21,1 – 22,9 | Salle à manger |\n| 15,7 – 18,2 | 31,1 – 33,6 | Suite parentale |\n| 18,2 – 21,0 | 28,0 – 30,9 | Salle de bains et baignoire |\n| 21,0 – 22,9 | 39,1 – 41,0 | Terrasse, vue montagne |\n| 22,9 – 25,3 | 50,5 – 52,9 | Dîner extérieur de nuit |\n| 25,3 – 27,2 | 45,1 – 47,0 | Piscine éclairée |\n| 27,2 – 30,0 | 53,1 – 56,0 | Piscine et parasols + carton final |\nAutres bons plans non utilisés : 0–3 s (golf et montagne à travers les bananiers), 47–50 s (séjour et salle à manger de nuit).\n\n## Textes à l'écran\nFrontline golf. · 6 bedrooms / 702 m² built · 2,349 m² plot · Private pool / South-facing gardens · Main residence / 5 bedrooms, plus a separate 1-bedroom guest house · Master suite / with dressing room · 761 m² / of terraces, open to the mountains · Gated community / Golf Valley, Marbella · Fin : AB-0001 / Price on request / DM \"ALOHA\" for the brochure or a private viewing / @avishay.marbella · Levy & Goldman.\nVariante d'accroche (premier carton) : « A frontline golf villa in Aloha. »\n\n## Script de voix off (EN, à enregistrer par Avishay, environ 27 s, débit posé)\n| Reel | Texte |\n| --- | --- |\n| 0 – 4 s | Frontline golf, in the heart of Nueva Andalucía. |\n| 4 – 9 s | Six bedrooms, seven hundred square metres, on a plot of more than two thousand three hundred. |\n| 9 – 15 s | Bright living spaces open onto the garden, with a separate guest house for family and friends. |\n| 15 – 21 s | Upstairs, a master suite with its own dressing room. |\n| 21 – 26 s | And seven hundred and sixty square metres of terraces, facing the mountains. |\n| 26 – 30 s | For the full brochure or a private viewing, send me \"ALOHA\". |\nConseil : enregistre au calme avec ton micro, téléphone à 20 cm, une prise entière. Je cale la voix sur les plans et je baisse le son à 15 % sous ta voix.\n\n## Légende (EN)\nFrontline golf in Aloha, Nueva Andalucía.\n\nSix bedrooms, 702 m² built on a 2,349 m² plot, a separate guest house, 761 m² of south-facing terraces and a private pool, in a gated community of Marbella's Golf Valley.\n\nSend me \"ALOHA\" in a private message for the full brochure or a private viewing.\n\nPrice on request.\nIn collaboration with Levy & Goldman.\n\n#Marbella #NuevaAndalucia #GolfValley #MarbellaVilla #LuxuryVilla #CostaDelSol #MarbellaRealEstate #FrontlineGolf\n\n## Audio à la publication\nSon Instagram calme (cinématique ou deep house lente), en hausse (flèche), à environ 15 % sous la voix. À vérifier : type de compte (Créateur ou Entreprise), qui détermine la bibliothèque disponible.\n"}]}}, {"id": "C-2026-11-09-reel-villa-golf-v2", "tache_id": "2026-11-09-reel-villa-golf-v2", "activite": "immo", "titre": "Frontline golf villa, Nueva Andalucía (V2)", "format": "reel", "langue": "en", "statut": "a_valider", "date_prevue": null, "bien": "AB-0001", "fichiers": ["/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-V2-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-V2-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-couverture-A.jpg", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-couverture-B.jpg", "contenus/2026-11-10-reel-villa-golf-v2/textes-v2.md", "contenus/2026-11-10-reel-villa-golf-v2/plan-montage.json", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-V3-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/villa-golf-V3-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v4/villa-golf-V4-sans-musique.mp4", "/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v4/feuille-coupes-120bpm.md", "contenus/2026-11-10-reel-villa-golf-v4/plan-montage.coupes.md", "/mnt/project-files/agence-immo/contenus/2026-11-11-reel-villa-golf-v5/villa-golf-V5-sans-musique.mp4"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [], "apercu": {"medias": [{"type": "video", "url": "/_blob/bf5c99fcc9c981eae060d08055d72a6e", "poster": "/_blob/2247f059b229da76c657d388f97e4433", "libelle": "Musique calme 1 · Relax Beat (Arulo), calme · Mixkit, libre de droits. Dis-moi le numéro choisi."}, {"type": "video", "url": "/_blob/55a7dd3c5585021392b6360f0635aa26", "poster": "/_blob/2247f059b229da76c657d388f97e4433", "libelle": "Musique calme 2 · Valley Sunset (A. M.), doux · Mixkit, libre de droits. Dis-moi le numéro choisi."}, {"type": "video", "url": "/_blob/184c95ace892928f028601a97ede4904", "poster": "/_blob/2247f059b229da76c657d388f97e4433", "libelle": "Musique calme 3 · Romantic 04 (Lily J), piano · Mixkit, libre de droits. Dis-moi le numéro choisi."}, {"type": "image", "url": "/_blob/2247f059b229da76c657d388f97e4433", "libelle": "Couverture C"}], "textes": [{"titre": "Textes, légende et script voix off", "texte": "# Reel villa golf V2 (bien AB-0001) – à valider par Avishay, rien n'est publié\n\nFichiers (hors git) : `/mnt/project-files/agence-immo/contenus/2026-11-10-reel-villa-golf-v2/`\n- **V3 (10/11/2026, version actuelle)** : `villa-golf-V3-musique.mp4` et `villa-golf-V3-sans-musique.mp4`. Crépitement de la V2 corrigé (coupures nettes à chaque temps ; 0 clic détecté contre 93), nouvelle bande-son chill house 104 BPM (`bande-son-originale-v3-104bpm.wav`, -14 LUFS), textes centrés sur une même ligne.\n- `villa-golf-V2-musique.mp4` : 1080 × 1920, 28,5 s, bande-son originale.\n- `villa-golf-V2-sans-musique.mp4` : même montage, sans son (pour ta voix et/ou un son Instagram).\n- `villa-golf-couverture-A.jpg` (drone, villa et fairway) et `villa-golf-couverture-B.jpg` (façade au crépuscule).\nAucun nom de propriété à l'écran, dans la légende ni dans les noms de fichiers.\n\n## Prix\nAffiché : **9 950 000 €**, **à confirmer par Avishay** (disponibilité comprise).\nSources consultées le 9 novembre 2026 : fiche Solvilla en ligne (agence qui a l'exclusivité) à 9 950 000 € ; PrimeLocation (annonce ajoutée le 08/10/2026) et JamesEdition (mise à jour du 06/10/2026) à 9 950 000 € ; la fiche vitrine du dossier (14/07/2026) au même prix. Deux autres agences affichent encore 10 395 000 € (JamesEdition, mise à jour du 2 août ; DM Properties) : ce sont des annonces plus anciennes ou d'autres agences, à ignorer.\nRemarque : le prix associé à 702 m² et à la première ligne de golf suffit à retrouver le bien sur les portails, où il est publié sous son nom. Retirer le nom limite la recherche directe, mais ne rend pas le bien introuvable.\n\n## Direction éditoriale\n- Accroche : le drone montre en une image ce qui rend le bien rare, la villa posée sur le fairway. Puis la vue du jardin sur le golf et la montagne.\n- Le prix arrive à 4,3 s sur la façade éclairée au crépuscule, avec une seule ligne de données (6 bedrooms · 702 m² built).\n- 4 messages seulement : Frontline golf / prix / Space for family and guests / Terraces with mountain views, puis l'écran final. La répartition des chambres passe dans la légende.\n- Ordre de visite : extérieurs, piscine sous trois angles (ciel, ras de l'eau, transats) pour les volumes, séjour, salle à manger, suite, bain, terrasse, puis la soirée (dîner, piscine éclairée). Les plans durent de 1,8 à 3,6 s, avec des fondus de 0,4 s.\n- Textes dans la zone centrale (hors interface Instagram), dégradé sombre seulement derrière le texte.\n- Couvertures : texte dans le cadrage 4:5 de la grille du profil, signature discrète. A sous la villa, sur les arbres, pour ne pas la masquer. B sur la pelouse sombre, sous la piscine.\n\n## Plans (repères dans la vidéo source → dans le Reel)\nVoir `plan-montage.json` (champ `dans_le_reel`). Résumé : drone 5,2-7,1 → 0-1,9 ; golf et montagne 0-3 → 1,5-4,5 ; façade crépuscule 43,2-45 → 4,1-6 ; façade jour 9,1-11 → 5,6-7,5 ; piscine ciel 7,2-9 ; ras de l'eau 15,2-17 ; transats 13,1-14,9 ; séjour 17,1-20 ; salle à manger 21,1-23 ; suite 31,1-34,6 ; bain 29,2-31 ; terrasse 39,1-41 ; dîner de nuit 50,5-53 ; piscine éclairée 45,1-47 ; écran final sur piscine et parasols 53,1-56,7.\n\n## Bande-son\nComposée ici, par programme (`outils/musique_originale.py`) : deep house calme à 112 BPM. Elle ne contient ni échantillon ni morceau tiers, donc aucune autorisation n'est nécessaire. Mixage à -15 LUFS.\nSi tu préfères un son tendance d'Instagram, utilise la version sans musique.\n\n### Son tendance (choix d'Avishay, 09/11/2026)\nUn morceau connu ne peut pas être intégré dans le fichier : les droits ne sont couverts que si le son est ajouté dans l'application Instagram au moment de publier. Méthode :\n1. Importer `villa-golf-V2-sans-musique.mp4` (ou la version avec ta voix) dans un nouveau Reel.\n2. Bouton « Audio » : prendre un son marqué d'une flèche ↗ (tendance) dans « Tendances » ou « Pour vous », de style deep house, chill ou piano cinématique. Éviter les sons humoristiques ou à paroles fortes (ton premium).\n3. Avec voix off : son à 10-15 %, voix à 100 %. Sans voix : son à 100 %.\n4. Si le son n'apparaît pas, le compte est probablement de type Entreprise (bibliothèque limitée) : garder la bande-son originale.\n\n## Voix clonée\nElle n'est pas intégrée. VoiceStudio tourne en local sur ton Mac et le serveur ne peut pas l'appeler. Son rendu et ses droits commerciaux ne sont pas vérifiés, et aucun service de clonage n'est connecté côté serveur. Script prêt ci-dessous.\n\n## Script de voix off (EN) – 44 mots\nDébit naturel d'environ 2,4 mots/s, soit 18 à 20 s de parole sur 28,5 s, avec des respirations. Rien n'est accéléré.\n| Reel | Texte | Mots |\n| --- | --- | --- |\n| 0,3 – 3,5 s | Frontline golf, in Marbella's Golf Valley. | 6 |\n| 4,3 – 7,0 s | Six bedrooms. Seven hundred square metres. | 6 |\n| 11,5 – 15,0 s | Light-filled living spaces, open onto the garden. | 8 |\n| 15,5 – 19,0 s | A private suite upstairs. | 4 |\n| 19,8 – 23,5 s | And terraces with views to the mountains. | 7 |\n| 25,2 – 28,3 s | For details or a private viewing, send me \"GOLF\". | 9 |\nLe prix n'est pas lu (il est à l'écran), pour garder un rythme posé.\n\n## Légende (EN)\nFrontline golf in Nueva Andalucía, Marbella's Golf Valley.\n\nA six-bedroom villa with 702 m² built on a 2,349 m² plot: five bedrooms in the main residence, including a principal suite with dressing room, and a separate one-bedroom guest house. Private pool, landscaped gardens and 761 m² of terraces, in a gated community. The property faces south.\n\n€9,950,000\n\nDM \"GOLF\" for details or a private viewing.\n\nIn collaboration with Levy & Goldman.\n\n#Marbella #NuevaAndalucia #GolfValley #MarbellaVilla #FrontlineGolf #CostaDelSol #MarbellaRealEstate #LuxuryVilla\n\nVérification : la surface de terrasses (761 m²) et l'orientation sud de la propriété sont deux informations distinctes (fiche vitrine, fiche Solvilla). La légende ne dit plus que les terrasses sont orientées au sud.\n"}]}}, {"id": "C-2026-11-12-linkedin-semaine-1", "tache_id": "2026-11-12-linkedin-semaine-1", "activite": "immo", "titre": "LinkedIn – 3 posts semaine 1, V2 (3 erreurs, 3 façons de vivre, partenaires)", "format": "post linkedin", "langue": "fr", "statut": "a_valider", "date_prevue": null, "bien": null, "fichiers": ["contenus/2026-11-12-linkedin-semaine-1/legende-et-note.md"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [], "apercu": {"medias": [{"type": "image", "url": "/_blob/2d8290d098db9bacce987379eea23c61", "libelle": "Post 1 · villa au crépuscule"}, {"type": "image", "url": "/_blob/5c3b940ef007cf07e656881cb6cb1a61", "libelle": "Post 2 · la Concha au-dessus du golf"}, {"type": "image", "url": "/_blob/8b056f59b8c8214840e7baf2081615ae", "libelle": "Post 3 · terrasse au crépuscule"}], "textes": [{"titre": "Légende et note interne", "texte": "# LinkedIn – 3 posts, semaine 1 (V2 du 12/11/2026) – à valider par Avishay, rien n'est publié\n\nRefaits entièrement le 12/11 à ta demande (« le texte, la photo, tout ») : textes plus courts et plus directs, photos plein cadre tirées de la vidéo de la villa golf (fournie par Solvilla, droits de diffusion OK), presque sans texte sur l'image, signature Levy & Goldman discrète.\nPublic visé : agences, chasseurs immobiliers, conseillers en patrimoine (Paris, Lyon, Bruxelles, Casablanca, Rabat, Londres), et acheteurs francophones.\nPublication : par toi, depuis ton profil (brouillons Typefully dès que ton compte LinkedIn y est ajouté). Rythme proposé : mardi, jeudi, lundi suivant, vers 8 h 30.\nRègles respectées : aucun chiffre ni loi, aucune promesse de rendement, de financement ou de licence, aucun nom de bien, aucune mention de rémunération. Zone : Marbella et ses alentours, jusqu'à Estepona.\n\n---\n\n## Post 1 – Trois erreurs à éviter (mardi)\n\nVisuel : villa au crépuscule, piscine éclairée ; « Trois erreurs à éviter », Marbella · Estepona (v2-post1.jpg, 1080 × 1350).\n\n**FR**\nTrois erreurs que je vois souvent chez ceux qui découvrent Marbella.\n\n1. Choisir un quartier sur photo. Golden Mile, Nueva Andalucía, Estepona : trois ambiances, trois rythmes de vie. Il faut les voir.\n2. Enchaîner quinze visites en un week-end. On ressort fatigué, sans avoir rien comparé. Mieux vaut cinq biens bien choisis.\n3. Regarder le prix affiché sans le budget complet. Frais d'achat, taxes, notaire : faites-les chiffrer par un avocat avant l'offre.\n\nC'est pour ça que tout commence par une conversation, pas par une visite.\n\n**EN**\nThree mistakes I often see from people discovering Marbella.\n\n1. Choosing an area from photos. Golden Mile, Nueva Andalucía, Estepona: three atmospheres, three ways of living. You need to see them.\n2. Fifteen viewings in one weekend. You leave tired, having compared nothing. Five well-chosen homes are better.\n3. Looking at the asking price, not the full budget. Purchase costs, taxes, notary: have a lawyer work them out before you make an offer.\n\nThat is why everything starts with a conversation, not a viewing.\n\n---\n\n## Post 2 – Trois façons de vivre ici (jeudi)\n\nVisuel : la Concha au-dessus du golf, entre les bananiers ; « Trois façons de vivre ici », Marbella et ses alentours (v2-post2.jpg, 1080 × 1350).\n\n**FR**\nMarbella, ce n'est pas un seul endroit.\n\nGolden Mile : la plage, les restaurants, le centre de Marbella tout proche.\nNueva Andalucía : les golfs, le calme, des villas avec du terrain.\nEstepona : un rythme plus doux, la mer, un centre qui garde son caractère.\n\nLa bonne question n'est pas « où acheter ? » mais « comment voulez-vous vivre ? ». La réponse fait la moitié de la recherche.\n\n**EN**\nMarbella is not just one place.\n\nGolden Mile: the beach, the restaurants, Marbella town centre close by.\nNueva Andalucía: golf, calm, villas with land.\nEstepona: a gentler pace, the sea, a town centre that has kept its character.\n\nThe right question is not \"where should I buy?\" but \"how do you want to live?\". The answer is half of the search.\n\n---\n\n## Post 3 – Votre client reste votre client (lundi suivant)\n\nVisuel : table dressée sur la terrasse au crépuscule ; Agences · Conseillers (v2-post3.jpg, 1080 × 1350).\n\n**FR**\nAgents, chasseurs, conseillers en patrimoine : un de vos clients vous parle de Marbella ?\n\nVous n'avez pas à le laisser partir. Nous faisons le terrain avec vous : sélection de biens, y compris hors marché, visites sur place ou en vidéo, suivi à chaque étape. Vous restez son interlocuteur.\n\nVotre client reste votre client. Écrivez-moi, on en parle.\n\n**EN**\nAgents, buyer's agents, wealth advisers: one of your clients is talking about Marbella?\n\nYou do not have to let them go. We do the groundwork with you: a selection of homes, off-market included, viewings in person or by video, updates at every step. You remain their contact.\n\nYour client stays your client. Message me and let's talk.\n\n---\n\n## Note interne\n- Les invitations (15 par jour) restent envoyées par toi ; la liste de la semaine est dans `/mnt/project-files/prospection/2026-11-11-lot1-partenaires.md`.\n- V1 (accroche « vacances ou vivre », 5 questions, partenaires) refusée le 12/11 : remplacée en entier.\n- Les posts sur les programmes neufs Levy & Goldman sont préparés à part, par l'équipe contenu.\n"}]}}, {"id": "C-2026-11-12-reel-programme-new-golden-mile", "tache_id": "2026-11-12-reel-programme-new-golden-mile", "activite": "immo", "titre": "Programme neuf, New Golden Mile (AB-0002)", "format": "reel", "langue": "en", "statut": "remplace", "date_prevue": null, "bien": "AB-0002", "fichiers": ["contenus/2026-11-12-reel-programme-new-golden-mile/legende-et-note.md", "/mnt/project-files/agence-immo/contenus/2026-11-12-reel-programme-new-golden-mile/"], "maj_le": "2026-11-12T18:09:42+00:00", "retours": [{"decision": "note", "texte": "Remplacé par le Reel projet de villa Benahavís (AB-0004), le 18/11.", "canal": "équipe", "cree_le": "2026-11-18T13:22:00Z"}], "apercu": {"medias": [{"type": "video", "url": "/_blob/314281c8b96d6bd0a27befd7dd315fbd", "poster": "/_blob/7a1ffcb19aa0fec23c18107585a7c0f1", "libelle": "Nouvelle version (texte remonté, moins de détails) · deep house 1 : Autofahren. Dis-moi le numéro choisi. À confirmer : droit sur les images du site L&G et prix « From €745,000 »."}, {"type": "video", "url": "/_blob/92de94cfb69bd6206afedac29413b4ee", "poster": "/_blob/7a1ffcb19aa0fec23c18107585a7c0f1", "libelle": "Nouvelle version (texte remonté, moins de détails) · deep house 2 : Deep Urban. Dis-moi le numéro choisi. À confirmer : droit sur les images du site L&G et prix « From €745,000 »."}, {"type": "video", "url": "/_blo   async function sauver(type) {
    const fm = document.getElementById("form-saisie"); if (!fm || !DB) return;
    const d = Object.fromEntries(new FormData(fm).entries());
    if (type === "resultat" && !(d.base || "").trim()) return toast("Indique sur quelle base ce résultat est saisi.");
    if (type === "test" && !(d.hypothese || "").trim()) return toast("Écris l'hypothèse.");
    if (type === "campagne" && !(d.nom || "").trim()) return toast("Donne un nom à la campagne.");
    ["valeur", "budget_jour", "budget_total", "par_semaine"].forEach(k => { if (d[k] !== undefined && d[k] !== "") d[k] = Number(d[k]); else delete d[k]; });
    const col = { resultat: "resultats", test: "tests", campagne: "campagnes", frequence: "frequences" }[type];
    const doc = Object.assign(d, { par: "Avishay (back-office)", quand: new Date().toISOString(), source: "manuel" }, type === "campagne" ? { statut: "en_preparation" } : {});
    try { await DB.doc(col + "/" + type.slice(0, 3) + Date.now().toString(36)).set(doc); fiche.close(); toast("Enregistré."); }
    catch (e) { toast("Échec de l'enregistrement. Réessaie."); }
  }

    // Appelé dans le geste de clic : réveille la session de Claude qui suit ce tableau de bord.
    if (!DIRECT || !COMMENTS) return Promise.resolve(false);
    return COMMENTS.anchorFor(el).then(anchor => COMMENTS.sendToClaude({ anchor, text: `${docId.startsWith("decision ") ? "Back-office, " + docId : `Consigne d'Avishay (back-office, id ${docId})`} :\n${texte}`.slice(0, 3900) }))
      .then(() => true).catch(e => { if (e && ["forbidden", "claude_unavailable", "capability_removed"].includes(e.code)) DIRECT = false; return false; });
  }
  async function consigneBase(id) {
    const tx = document.getElementById(id), sel = document.getElementById(id + "-pour");
    const texte = tx.value.trim(); if (!texte) return toast("Dis ou écris la consigne d'abord.");
    const docId = "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const direct = envoyerAClaude(tx.closest(".consigne-bloc") || tx, texte, docId);
    const pour = sel && sel.value ? sel.value : null, propose = pour ? null : suggere(texte);
    const doc = { texte, quand: new Date().toISOString(), statut: "recue", pour, propose, canal: tx.dataset.dicte ? "voix" : "texte", objet: tx.dataset.objet || null };
    if (!STATIQUE) return poster("/api/consigne", { texte, agent: pour || propose || null }).then(() => { tx.value = ""; });
    try {
      await DB.doc("consignes/" + docId).set(doc); tx.value = ""; delete tx.dataset.dicte;
      if (!CONSIGNES.find(x => x._id === docId)) CONSIGNES.unshift(Object.assign({ _id: docId }, doc));
      ouvrirFiche("consigne", docId);
      if (await direct) {
        await DB.doc("consignes/" + docId).update({ direct: true, reponses: [{ de: "coordination", texte: "Reçu. Je m'en occupe maintenant et je te réponds ici.", quand: new Date().toISOString(), auto: true }] });
        toast("Consigne envoyée. Victor s'en occupe tout de suite.");
      } else { toast("Consigne envoyée à Victor."); reponseAgent(docId); }
    }
    catch (e) { toast("Échec de l'envoi de la consigne. Réessaie dans un instant."); }
  }


  // ---------- Mode serveur ----------
  async function charger() {
    if (STATIQUE) return rendre();
    try { const r = await fetch("/api/etat", { cache: "no-store" }); E = await r.json(); rendre(); rafraichirFiche(); }
    catch (e) { document.getElementById("vue-principale").innerHTML = `<div class="bandeau alerte">Le service ne répond pas. Vérifie qu'il tourne sur le serveur.</div>`; }
  }
  async function poster(url, corps) {
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps || {}) });
      const d = await r.json(); toast(d.message || (r.ok ? "Fait." : "Refusé.")); await charger();
    } catch (e) { toast("Échec de l'envoi : le service ne répond pas."); }
  }

  // ---------- Clics ----------
  const fiche = document.getElementById("fiche");
  fiche.addEventListener("close", () => { fiche.querySelectorAll("video").forEach(v => v.pause()); fiche._courant = null; PILE.length = 0; });
  fiche.addEventListener("click", ev => { if (ev.target === fiche) fiche.close(); });
  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-fiche],[data-fermer],[data-retour],[data-filtre],[data-filtre-lien],[data-valider],[data-ouvrir-modif],[data-envoyer],[data-reprendre],[data-envoyer-consigne],[data-micro],[data-repondre],[data-autoriser],[data-gerer-autorisations],[data-mois],[data-rapide],[data-ouvrir-menu],[data-fermer-menu],[data-periode],[data-raz],[data-regvue],[data-exporter],[data-audf],[data-calv],[data-semaine],[data-sauver],[data-theme-choix],[data-tagq]");
    if (!el) return;
    if (el.hasAttribute("data-ouvrir-menu")) { document.body.classList.add("menu-ouvert"); return; }
    if (el.hasAttribute("data-fermer-menu")) { document.body.classList.remove("menu-ouvert"); return; }
    if (el.dataset.periode) { FILTRE.periode = el.dataset.periode; garderFiltres(); return rendre(); }
    if (el.hasAttribute("data-raz")) { Object.assign(FILTRE, { activite: "", plateforme: "", compte: "", campagne: "", agent: "" }); garderFiltres(); return rendre(); }
    if (el.dataset.regvue) { REG.vue = el.dataset.regvue; return rendre(); }
    if (el.hasAttribute("data-exporter")) return exporterRegistre();
    if (el.dataset.audf) { AUDF = el.dataset.audf; return rendre(); }
    if (el.dataset.calv) { CALV = el.dataset.calv; return rendre(); }
    if (el.dataset.semaine) { const d = new Date(SEMAINE + "T12:00:00"); d.setDate(d.getDate() + Number(el.dataset.semaine)); SEMAINE = iso(d); return rendre(); }
    if (el.dataset.sauver) { ev.preventDefault(); if (!DB || !PEUT_ECRIRE) return; return sauver(el.dataset.sauver); }
    if (el.dataset.themeChoix) { document.documentElement.dataset.theme = el.dataset.themeChoix; try { localStorage.setItem("bo-theme", el.dataset.themeChoix); } catch (e) {} return rendre(); }
    if (el.matches("a.tag[data-tagq],button[data-tagq]")) { ev.preventDefault(); TAGQ = el.dataset.tagq; if (location.hash !== "#tags") location.hash = "#tags"; else rendre(); return; }
    if (el.dataset.rapide) { const tx = document.getElementById(el.dataset.rapide); if (!tx || (STATIQUE && (!DB || !PEUT_ECRIRE))) return; tx.value = el.dataset.texte; return consigneBase(el.dataset.rapide); }
    if (el.dataset.mois) { const [y, m] = MOIS.split("-").map(Number), d = new Date(y, m - 1 + Number(el.dataset.mois), 1); MOIS = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); return rendre(); }
    if (el.dataset.fiche) { ev.preventDefault(); return ouvrirFiche(el.dataset.fiche, el.dataset.id); }
    if (el.hasAttribute("data-fermer")) return fiche.close();
    if (el.hasAttribute("data-retour")) { const p = PILE.pop(); if (p) afficherFiche(p.type, p.id); return; }
    if (el.dataset.filtreLien) { filtres.taches = el.dataset.filtreLien; return; }
    if (el.dataset.filtre) { filtres.taches = el.dataset.filtre; return rendre(); }
    if (el.hasAttribute("data-ouvrir-modif")) { const f = document.getElementById("form-modif"); if (f) { f.hidden = !f.hidden; if (!f.hidden) { f.querySelector("textarea").focus(); if (DICT && !DICT.active()) basculerDictee("modif-texte"); } } return; }
    if (el.dataset.micro) return basculerDictee(el.dataset.micro);
    if (el.hasAttribute("data-autoriser") || el.hasAttribute("data-gerer-autorisations")) return autoriser(el.hasAttribute("data-gerer-autorisations") || AUTORISATION === "denied");
    if (el.dataset.repondre) { if (!DB || !PEUT_ECRIRE) return; return repondreConsigne(el.dataset.repondre); }
    if (el.dataset.envoyerConsigne) { if (STATIQUE && (!DB || !PEUT_ECRIRE)) return; return consigneBase(el.dataset.envoyerConsigne); }
    if (STATIQUE) {
      if (!DB || !PEUT_ECRIRE) return;
      if (el.dataset.valider) return deciderBase(el.dataset.valider, "valide");
      if (el.dataset.envoyer) { if (DICT && DICT.active()) DICT.stop().catch(() => {}); const tx = document.getElementById("modif-texte").value.trim(); if (!tx) return toast("Écris ce qu'il faut changer."); return deciderBase(el.dataset.envoyer, "modification", tx); }
      return;
    }
    if (el.dataset.valider) return poster(`/api/contenus/${encodeURIComponent(el.dataset.valider)}/valider`);
    if (el.dataset.envoyer) return poster(`/api/contenus/${encodeURIComponent(el.dataset.envoyer)}/modifier`, { texte: document.getElementById("modif-texte").value });
    if (el.dataset.reprendre) return poster(`/api/taches/${encodeURIComponent(el.dataset.reprendre)}/reprendre`);
  });
  async function lireAutorisation() {
    try { const p = await window.claude.use("permissions"); if (!p) return; AUTORISATION = await p.state("comments"); rendre(); } catch (e) { /* sans effet */ }
  }
  async function autoriser(panneau) {
    const aide = "Menu ⋯ de la page (en haut à droite) › Autorisations › Commentaires : « Toujours autoriser ».";
    try {
      const p = await window.claude.use("permissions"); if (!p) return toast(aide);
      let etat = "prompt";
      if (!panneau) { const r = await p.request(["comments"]); etat = (r && r.comments) || await p.state("comments"); }
      if (panneau || etat !== "granted") { try { await p.manage(); } catch (e) { AUTORISATION = "fait"; rendre(); return toast(aide); } etat = await p.state("comments"); }
      AUTORISATION = etat === "granted" ? "granted" : "fait"; rendre();
      toast(etat === "granted" ? "C'est autorisé : tes demandes partent sans fenêtre." : aide);
    } catch (e) { AUTORISATION = "fait"; rendre(); toast(aide); }
  }
  function basculerDictee(champ) {
    if (!DICT) return;
    if (DICT.active()) { DICT.stop().catch(() => {}); return; }
    CIBLE_DICTEE = champ;
    DICT.start().catch(e => {
      if (e.code === "not_granted") toast("Micro refusé pour cette page. Tu peux toujours écrire, ou l'autoriser dans le menu Autorisations.");
      else if (e.code === "unavailable") { toast("La dictée n'est pas disponible ici. Écris la consigne."); DICT = null; rendre(); }
      else if (e.code !== "stopped" && e.code !== "dismissed") toast("La dictée n'a pas démarré. Réessaie.");
    });
  }
  // Envoi automatique à la fin de la dictée : un seul geste pour Avishay
  function envoiAuto(champ) {
    const tx = champ && document.getElementById(champ); if (!tx || !tx.value.trim()) return;
    if (champ === "modif-texte") { const b = document.querySelector("#fiche [data-envoyer]"); if (b) b.click(); return; }
    if (tx.matches("[data-consigne]")) { const b = document.querySelector(`[data-envoyer-consigne="${champ}"]`); if (b && !b.disabled) b.click(); }
  }
  function brancherDictee(d) {
    DICT = d;
    d.onFinal(({ text }) => { const tx = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE); if (!tx) return; tx.value = tx.value ? tx.value + text : text.replace(/^\s+/, ""); tx.dataset.dicte = "1"; majProposition(CIBLE_DICTEE); });
    d.onPartial(({ text }) => { const p = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE + "-provisoire"); if (p) { p.hidden = !text; p.textContent = text; } });
    d.onState(({ state }) => {
      document.querySelectorAll("[data-micro]").forEach(b => { const on = state !== "idle" && b.dataset.micro === CIBLE_DICTEE; b.setAttribute("aria-pressed", on); b.querySelector("span").textContent = on ? (state === "finishing" ? "J'envoie…" : "J'écoute… touche pour envoyer") : "Dicter"; });
      if (state === "listening") brancherDictee.ecoute = true;
      if (state === "idle" && brancherDictee.ecoute) { brancherDictee.ecoute = false; setTimeout(envoiAuto, 250, CIBLE_DICTEE); }
      if (state === "idle") { const p = CIBLE_DICTEE && document.getElementById(CIBLE_DICTEE + "-provisoire"); if (p) p.hidden = true; }
    });
    rendre();
  }
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.matches("[data-consigne]")) majProposition(t.id);
    if (t.matches("input[data-reg]")) { REG[t.dataset.reg] = t.value; return rendre(); }
    if (t.matches("input[data-tagq]")) { TAGQ = t.value; return rendre(); }
  });
  document.addEventListener("change", ev => {
    const t = ev.target;
    if (t.matches("[data-f]")) { FILTRE[t.dataset.f] = t.value; garderFiltres(); return rendre(); }
    if (t.matches("select[data-reg]")) { REG[t.dataset.reg] = t.value; return rendre(); }
    if (t.matches("[data-calf]")) { CALF[t.dataset.calf] = t.value; return rendre(); }
  });
  document.addEventListener("change", ev => { if (ev.target.id && ev.target.id.endsWith("-pour")) majProposition(ev.target.id.slice(0, -5)); });
  window.addEventListener("hashchange", () => { document.body.classList.remove("menu-ouvert"); if (fiche.open) fiche.close(); entree(); rendre(); window.scrollTo(0, 0); });
  function entree() { const m = document.getElementById("vue-principale"); m.classList.remove("entree"); void m.offsetWidth; m.classList.add("entree"); clearTimeout(entree.h); entree.h = setTimeout(() => m.classList.remove("entree"), 900); }
  entree();
  document.getElementById("rafraichir").addEventListener("click", ev => { ev.currentTarget.classList.add("tourne"); setTimeout(() => location.reload(), 250); });
  charger();
  brancherBase();
  // Mode serveur : rafraîchit toutes les 30 s, sauf pendant une saisie
  if (!STATIQUE) setInterval(() => { if (![...document.querySelectorAll("textarea")].some(t => t.value)) charger(); }, 30000);
})();
</script>
