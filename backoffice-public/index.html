, démonstration | 5 | 5 | 3 | 4 | 3 | 4 | 4 | 1 | **29** | faible |  |\n| 51 | AD | D'où ça vient ? | Pourquoi dit-on « OK » ? | journal de Boston 1839 | 5 | 4 | 3 | 4 | 4 | 4 | 4 | 1 | **29** | faible |  |\n| 52 | AD | D'où ça vient ? | Pourquoi le @ s'appelle-t-il arobase ? | unité de mesure, histoire du signe | 5 | 4 | 4 | 4 | 3 | 4 | 4 | 1 | **29** | faible |  |\n| 53 | AD | D'où ça vient ? | Quel détail d'invention a changé son usage : le trombone | forme Gem, brevets | 5 | 4 | 4 | 4 | 3 | 3 | 4 | 1 | **28** | faible | l'inventeur est contesté : le dire |\n| 54 | AD | D'où ça vient ? | Pourquoi les crayons sont-ils jaunes ? | graphite de Chine, marketing | 4 | 4 | 4 | 4 | 3 | 4 | 4 | 1 | **28** | faible | récit souvent répété : vérifier avant |\n| 55 | AD | Le détail invisible | À quoi sert la languette trouée de la canette ? | pivot, levier | 4 | 3 | 4 | 5 | 3 | 3 | 4 | 1 | **27** | faible |  |\n\n## Écartées ou à traiter avec précaution\n- « Les bulles dans l'eau du robinet sont-elles dangereuses ? » : la question sanitaire est écartée du format court faute de pouvoir la traiter correctement ; seule la physique de la nucléation est retenue (ligne bulles).\n- Sujets santé/médicaments, histoire contestée et actualité politique : uniquement avec sources officielles, et seulement si la réponse tient en une minute sans simplification trompeuse.\n- Sujets dont la « révélation » est un mythe répandu (QWERTY et les tiges qui se coincent, inventeur du trombone) : traiter le mythe comme mythe, montrer l'incertitude.\n", "dossier": "videos/00_strategie/banque-de-sujets.md", "ordre": 10, "resume": "Les idées de vidéos, notées sur 8 critères, avec le compte et la série.", "titre": "Banque de sujets (55 pistes notées)", "type": "document"}, "calendrier": {"ajoute_le": "2026-11-23", "contenu": "# Calendrier de lancement · Curiosités du quotidien · 4 semaines (07/12/2026 → 03/01/2027)\n\nVersion 2, d'après l'audit d'Avishay du 23/11. Elle remplace le plan à 40 vidéos (archivé dans _brouillons).\n\n## Les règles de ce plan\n\n- **Un seul compte** : Curiosités du quotidien. « IA en pratique » reste en réserve jusqu'au bilan de cette série.\n- **3 vidéos par semaine** (lundi, mercredi, vendredi à 18h30), plus un 4e créneau optionnel le dimanche en semaines 3 et 4.\n- **Même vidéo sur TikTok, Reels et Shorts**, avec une couverture et une légende adaptées à chaque plateforme.\n- **Préparé une semaine à l'avance** : les vidéos d'une semaine sont prêtes le lundi précédent. C'est pourquoi le lancement passe au lundi 7/12 et non au 30/11 : la voix n'est pas encore choisie.\n- **Aucun rendu complet avant le choix de la voix.** Les vidéos déjà faites seront refaites avec la voix retenue, sans changer le texte.\n- **Pour chaque nouveau sujet** : fiche d'une page (question, réponse en une phrase, raison de partager, preuve visuelle, sources, deux accroches), puis script, puis aperçu de quelques scènes. La vidéo complète n'est lancée qu'après ces trois validations.\n- **Semaine 4 laissée ouverte** : les sujets seront choisis d'après les résultats des semaines 1 à 3, pas fixés à l'avance.\n\n## Ce qu'on note pour chaque vidéo, par plateforme\n\nMaintien à 3 secondes, durée moyenne regardée, taux de visionnage complet, partages et enregistrements pour 1 000 vues, abonnements pour 1 000 vues. On compare nos vidéos entre elles, pas à des seuils extérieurs. Aucune prévision de vues.\n\n## Pourquoi cet ordre\n\nLa série de lancement ouvre avec les trois sujets les plus visuels de la réserve (QR code, glaçons, cuillère), que l'audit cite comme ayant du potentiel. Le hublot passe en semaine 2, une fois la voix validée. La route d'avion et les chats attendent leur aperçu de scènes. Prix en 9, poser un lapin, bulles et oignons restent disponibles pour la semaine 4 si les résultats le justifient.\n\n## Semaine 1 · du 07/12 au 13/12 · série de lancement\n\n| Jour | Heure | Épisode | Sujet | Statut |\n|---|---|---|---|---|\n| lun 07/12 | 18:30 | CUR-E005 | Le QR code abîmé qui se lit encore | vidéo faite, à refaire avec la voix choisie |\n| mer 09/12 | 18:30 | CUR-E006 | Les glaçons qui craquent | vidéo faite, à refaire avec la voix choisie |\n| ven 11/12 | 18:30 | CUR-E004 | Cuillère en métal ou en bois | vidéo faite, à refaire avec la voix choisie |\n\n## Semaine 2 · du 14/12 au 20/12\n\n| Jour | Heure | Épisode | Sujet | Statut |\n|---|---|---|---|---|\n| lun 14/12 | 18:30 | CUR-E001 | Le petit trou du hublot | V3 faite, à refaire avec la voix choisie |\n| mer 16/12 | 18:30 | CUR-E011 | Les pattes du gecko | vidéo faite, à refaire avec la voix choisie |\n| ven 18/12 | 18:30 | CUR-E012 | Le rideau de douche qui colle | vidéo faite, à refaire avec la voix choisie |\n\n## Semaine 3 · du 21/12 au 27/12\n\n| Jour | Heure | Épisode | Sujet | Statut |\n|---|---|---|---|---|\n| lun 21/12 | 18:30 | CUR-E007 | La route d'avion en arc | aperçu de scènes à valider |\n| mer 23/12 | 18:30 | CUR-E008 | Les chats dans le noir | script validé, aperçu à faire |\n| ven 25/12 | 18:30 | à décider | Selon les résultats des semaines 1-2 | à décider |\n| dim 27/12 | 18:30 | à décider | Créneau optionnel (4e vidéo) | optionnel |\n\n## Semaine 4 · du 28/12 au 03/01\n\n| Jour | Heure | Épisode | Sujet | Statut |\n|---|---|---|---|---|\n| lun 28/12 | 18:30 | à décider | Selon les résultats des semaines 1-3 | à décider |\n| mer 30/12 | 18:30 | à décider | Selon les résultats des semaines 1-3 | à décider |\n| ven 01/01 | 18:30 | à décider | Selon les résultats des semaines 1-3 | à décider |\n| dim 03/01 | 18:30 | à décider | Créneau optionnel (4e vidéo) | optionnel |\n", "dossier": "videos/00_strategie/calendrier-4-semaines.md", "ordre": 11, "resume": "07/12/2026 → 03/01/2027 : Curiosités seul, 3 vidéos par semaine (+1 optionnelle en semaines 3-4), semaine 4 choisie selon les résultats.", "titre": "Calendrier des 4 premières semaines (v2)", "type": "document"}, "condense-actu": {"ajoute_le": "2026-11-23", "alerte": "En pause : rien à valider pour l'instant.", "contenu": "# Condensé quotidien de l'actualité · proposition à valider (aucune production)\n\nPréparé le 23/11/2026. Rien n'est produit ni publié avant ta validation.\n\n## 1. Où le mettre : ma recommandation\n\n**Un compte à part**, pas une rubrique de Curiosités du quotidien.\n\n- Curiosités promet des vidéos intemporelles, qu'on enregistre et revoit. L'actu promet l'inverse : périmée en 24 h. Mélanger les deux brouille ce que l'abonné attend.\n- L'actu attire des commentaires polarisés (politique, conflits, justice). Les garder hors du compte principal protège son ambiance et ses signaux d'engagement.\n- Instagram et Threads limitent par défaut la recommandation des contenus « politiques » aux non‑abonnés. Sur un compte séparé, cette limite ne pèse pas sur Curiosités.\n\nAlternative moins chère : une rubrique « L'actu du jour » dans Curiosités pendant un pilote de 2 semaines, puis on décide. Je la déconseille pour les raisons ci‑dessus, mais elle évite d'ouvrir un compte tout de suite.\n\nNoms possibles (à vérifier sur chaque plateforme avant ouverture) : « Le condensé du jour », « Trois infos, une minute ».\n\n## 2. Format\n\n- **3 infos, 45 à 60 s**, environ 120 à 130 mots (plus que les 70 à 100 de Curiosités, car trois sujets).\n- Structure fixe : date + « trois infos, une minute » → 1/3, 2/3, 3/3 → « Sources en description. À demain. »\n- Choix des infos : ce qui touche le plus de monde en France ce jour‑là, avec un équilibre France / monde. Pas de faits divers sans portée générale.\n- Même DA que le reste : fond bleu nuit, texte ivoire, citron vert pour les chiffres et le compteur 1/3. Exception : l'orange de vigilance Météo‑France, utilisé seulement quand c'est l'information elle‑même.\n- Visuels 100 % maison : cartes vectorielles, pictogrammes, chiffres en objets graphiques, date en tampon. Aucune photo ni vidéo d'actualité (voir section 5).\n- Ton sobre : pas de bruitages « pop » ni de musique enjouée sur un sujet grave (victimes, conflits, justice).\n\n## 3. Rythme d'une journée (proposition)\n\n| Heure (Paris) | Étape |\n|---|---|\n| 17h00 | Je relève l'actu du jour et vérifie les sources |\n| 17h30 | Script + storyboard + sources dans le back‑office, « À valider » |\n| Dès ta validation | Production (voix, rendu, mixage) : environ 20 à 30 min |\n| 19h30 | Vidéo prête à publier (publication par toi, ou programmée si tu le valides plus tard) |\n| 21h00 | Sans validation, rien n'est publié ce jour‑là : l'actu ne se rattrape pas |\n\nIl faudra une tâche planifiée chaque jour à 17h. Je ne la crée qu'avec ton accord.\n\n## 4. Politique de sources et neutralité\n\n- Chaque fait est **recoupé par deux sources indépendantes**, dont une primaire quand elle existe (Météo‑France, ONU/CCNUCC, décision de justice, communiqué officiel). Médias de référence : franceinfo, Le Monde, AFP via la presse, Reuters.\n- **Si les sources se contredisent, le fait n'est pas dit.** Si la date d'une info ne peut pas être confirmée, l'info est écartée.\n- Formulation neutre : verbes factuels (« a annoncé », « a été condamné »), pas d'adjectifs d'opinion, pas de commentaire.\n- Justice : présomption d'innocence avant jugement, mention de l'appel possible après.\n- Chiffres provisoires signalés comme tels (« au moins », « selon… »).\n- Erreur : correction épinglée en commentaire et dans la description le jour même.\n- Toutes les sources (titre du média + lien) en description.\n\n## 5. Droits : ce qu'on s'interdit\n\n- **Aucune image ou vidéo de presse ou de télévision** (AFP, Reuters, JT, photos d'agence) : elles sont protégées, et les plateformes retirent ou démonétisent ces extraits.\n- Pas de copie de dépêche : on reformule toujours avec nos mots (les textes d'agence sont protégés eux aussi). Une citation courte et attribuée reste possible.\n- Pas de logos de médias à l'image : la source est citée en texte, en description.\n- Pas de visage de personnes réelles dessiné ou généré par IA, pour éviter toute confusion avec une vraie image.\n\n## 6. Exemple : l'édition du dimanche 22 novembre 2026\n\nDurée visée environ 50 s · 125 mots · voix posée.\n\n### Accroches\n- **A** : « Dimanche 22 novembre : trois infos, une minute. »\n- **B** : « Ce qu'il fallait retenir de ce dimanche, en trois points. »\n\n### Texte proposé (mot pour mot)\n\nDimanche 22 novembre : trois infos, une minute.\nUn. La COP31 s'est terminée à Antalya, en Turquie, sans déclaration finale commune. Le texte proposé ne mentionnait pas explicitement la sortie des énergies fossiles. Plusieurs pays, dont l'Union européenne et des États insulaires, l'ont rejeté.\nDeux. Météo-France a placé l'Ain et le Jura en vigilance orange pluie-inondation, et le Pas-de-Calais en vigilance orange crues. Jusqu'à cent millimètres de pluie étaient attendus sur le Haut-Jura. Fin des pluies prévue lundi matin.\nTrois. Vendredi, les trois policiers jugés pour l'agression du producteur Michel Zecler, en 2020, ont été condamnés. Le tribunal a reconnu le caractère raciste des violences. La décision peut faire l'objet d'un appel.\nSources en description. À demain.\n\n### Storyboard minuté (estimé, recalé sur la voix réelle)\n\n| Temps | Texte dit | Image | Son |\n|---|---|---|---|\n| 0–3 s | Dimanche 22 novembre : trois infos, une minute. | Tampon date « DIM 22 NOV » qui se pose en haut ; trois pastilles 1 · 2 · 3 s'allument. Titre « 3 infos, 1 minute » | tic léger |\n| 3–15 s | Un. La COP31… l'ont rejeté. | Compteur 1/3. Carte de la Turquie, point citron vert sur Antalya, zoom. Une feuille « Texte final » apparaît, une ligne en pointillés vide marquée « sortie des énergies fossiles ? ». Puis pictogrammes « UE » et « États insulaires » avec une croix sur la feuille. Titre « COP31 : pas d'accord final » | nappe sobre |\n| 15–28 s | Deux. Météo-France… lundi matin. | Compteur 2/3. Carte de France : Ain et Jura se colorent en orange, puis le Pas‑de‑Calais. Jauge verticale qui monte jusqu'à « 100 mm » sur le Haut‑Jura. Étiquette « Fin prévue : lundi matin ». Titre « Vigilance orange : 3 départements » | gouttes discrètes |\n| 28–40 s | Trois. Vendredi… d'un appel. | Compteur 3/3. Pictogramme de balance, date « ven. 20 nov. ». Deux étiquettes successives : « 3 policiers condamnés », « caractère raciste reconnu ». Petite mention « appel possible ». Aucun visage. Titre « Affaire Zecler : le jugement » | aucun bruitage, musique baissée |\n| 40–45 s | Sources en description. À demain. | Carton final : « Sources en description · À demain » | motif de fin court |\n\n### Sources (consultées le 23/11/2026)\n\n1. COP31 sans déclaration finale, texte sans mention explicite de sortie des fossiles, rejet par l'UE et des pays insulaires : [Le Club des Juristes](https://www.leclubdesjuristes.com/en-bref/achevement-de-la-cop31-absence-dun-accord-sur-les-energies-fossiles-18557/) ; [Vert](https://vert.eco/climat/lune-des-pires-de-lhistoire-la-cop31-sacheve-sans-accord/).\n2. Vigilance orange Ain et Jura (pluie‑inondation), Pas‑de‑Calais (crues), jusqu'à 100 mm, fin lundi matin : [France 3 Auvergne‑Rhône‑Alpes](https://france3-regions.franceinfo.fr/auvergne-rhone-alpes/ain/meteo-l-ain-place-en-vigilance-orange-pluie-inondation-a-partir-de-ce-dimanche-apres-midi-3453906.html) ; [Le Journal de la Météo de l'Ain](https://www.lejma.fr/2026/11/22/ain-et-jura-jusqua-100-mm-de-pluie-attendus-vigilance-orange-des-cet-apres-midi/). À confirmer sur le bulletin Météo‑France avant production.\n3. Affaire Zecler, condamnation des trois policiers et caractère raciste reconnu : [franceinfo](https://www.franceinfo.fr/replay-jt/france-2/13-heures/proces-zecler-prison-ferme-pour-agression-raciste-pour-les-trois-policiers_8293742.html) ; [Outre‑mer La 1ère](https://la1ere.franceinfo.fr/martinique/six-ans-apres-l-agression-de-michel-zecler-verdict-pour-trois-policiers-1759908.html).\n\n### Ce que j'ai écarté, et pourquoi (la règle appliquée)\n\n- **Les peines dans l'affaire Zecler** : franceinfo et La 1ère donnent des peines différentes. Je dis donc « condamnés » sans chiffre.\n- **Retrait israélien d'un village du Sud‑Liban** : je n'ai trouvé aucune source datée du 22 novembre qui le confirme.\n- **Soupçons de fuites visant un préfet** : accusations sans décision, sujet politique sensible, à ne traiter qu'avec des faits établis.\n- **Drone sur un immeuble près de Kyiv** : date de la dépêche non confirmée.\n\nNuance : l'affaire Zecler date de vendredi. Dans l'édition réelle, elle aurait été dans le condensé de vendredi. Je la garde ici pour montrer comment on traite un sujet de justice.\n\n## 7. Ce que j'attends de toi\n\n1. Compte à part ou rubrique dans Curiosités ?\n2. Horaire : condensé du soir (19h30) ou du matin pour la veille (7h30) ?\n3. Le texte et le storyboard d'exemple te conviennent‑ils comme modèle ?\n", "dossier": "videos/00_strategie/condense-actu-proposition.md", "ordre": 5, "resume": "EN PAUSE (23/11) : priorité au seul compte Curiosités. Proposition conservée pour plus tard : 3 infos en une minute chaque jour, compte à part recommandé, règles de sources et de droits, exemple du 22 novembre.", "titre": "Condensé quotidien de l'actualité · proposition à valider", "type": "document"}, "lignes-editoriales": {"ajoute_le": "2026-11-23", "contenu": "# Lignes éditoriales et identité (brief du 23/11/2026)\n\n## Deux comptes\n- **Curiosités du quotidien** (compte principal) : une question familière, un détail surprenant, une démonstration visuelle, une réponse claire.\n- **IA en pratique** : des tâches réelles, avec le résultat et les limites. Fonctions, noms de modèles et prix vérifiés au moment de l'écriture. Aucune promesse publicitaire.\n\n## Rubriques du compte principal (un petit pictogramme citron vert par rubrique)\nObjets et mécanismes · Science du quotidien · Corps, perception et nature · Cartes et géographie · Histoire, mots et culture · Technologie du quotidien.\n\n## Écriture\n- Texte dit exact, 70 à 100 mots, deux variantes d'accroche.\n- Storyboard minuté plan par plan.\n- Une source fiable par affirmation, nuances signalées, conclusion utile et invitation discrète.\n- Les sujets, sources, textes et storyboards sont proposés d'abord et produits seulement après validation. Un texte validé n'est jamais réécrit.\n\n## Direction artistique\n- Fond bleu nuit (#0A0F1C), texte ivoire (#F3EEDF), accent citron vert (#C6F432).\n- Typographie sans empattement lisible (Inter Tight pour les titres, Inter pour le texte).\n- Un concept visuel par scène, exploré par zooms et révélations plutôt que par coupes. Un événement visuel toutes les 1 à 1,5 s, jamais plus de 2 s figé.\n- Titre court en haut dès la première image (7 mots maximum), sujet déjà visible, pas d'intro.\n- Sous-titres mot à mot, mot clé en citron vert, dans les zones sûres des plateformes.\n- Chiffres clés traités comme des objets graphiques (étiquettes, jauges, compteurs).\n- Pas de mouvement gratuit, pas d'images de banque au hasard, pas de copie d'autres créateurs.\n\n## Son\nVoix devant la musique. Musique originale générée par code (piano feutré calme pour Curiosités), bruitages originaux, mixage à -14 LUFS. Voix ElevenLabs (voix provisoire signalée tant qu'elle n'est pas branchée).\n", "dossier": "videos/00_strategie/lignes-editoriales.md", "ordre": 12, "resume": "Deux comptes, six rubriques, règles d’écriture, direction artistique et son (brief du 23/11/2026).", "titre": "Lignes éditoriales et identité", "type": "document"}, "propositions-lot-2": {"ajoute_le": "2026-11-23", "contenu": "# Lot 2 · Fiches sujets à valider (avant tout script)\n\nPréparé le 23/11/2026 par Jeanne · Sujet, révisé après ton audit du jour.\nNouveau circuit : **fiche (cette page) → script → aperçu de quelques scènes → vidéo complète.** Tu valides chaque étape avant la suivante.\n\nCe qui change par rapport à la première version du lot 2 :\n- **IA en pratique est en pause** : les 4 sujets IA sont retirés et gardés en réserve, sans production.\n- **Plus de script à ce stade.** Les textes déjà écrits sont mis de côté (`_brouillons/scripts-lot-2-en-attente.md`) et ne serviront que si tu valides la fiche ; ils seront alors raccourcis à la version la plus courte qui explique bien.\n- **Test de partage appliqué** : « À qui je l'envoie, et qu'est-ce que cette personne apprend en une phrase ? » Les sujets sont classés du plus fort au plus faible ; ma recommandation est en bas.\n- **Ouverture sur le phénomène** : chaque fiche dit ce qu'on voit à l'image 0, la question apparaît en même temps.\n- Signature proposée : « Le détail banal qui cache un mécanisme étonnant », démonstration en trois étapes. J'indique si chaque sujet entre dans cette signature.\n\n---\n\n## F1 · Pourquoi ton plat est brûlant au bord et froid au milieu ?\nRubrique : Science du quotidien · Signature : oui · Durée probable : 20–30 s\n\n- **Réponse en une phrase** : dans le four, les ondes rebondissent et se croisent, ce qui crée des points chauds et des points froids toujours aux mêmes endroits ; le plateau et le temps de repos servent à compenser.\n- **Test de partage** : à la personne qui se plaint de son plat froid au milieu. Elle apprend qu'il existe une « carte » fixe de points chauds dans son micro-ondes, et pourquoi il faut remuer puis attendre.\n- **Preuve visuelle possible** : image 0 = assiette vue du dessus avec sa carte de chaleur (bords chauds, centre froid). Démonstration en 3 temps : ondes qui rebondissent → grille de points chauds/froids → plateau qui fait passer le plat dans les points chauds. Option filmée qui aide à y croire : une plaque de fromage râpé chauffée sans plateau, qui fond par taches régulières (à tourner nous-mêmes, pas d'image trouvée).\n- **Accroche A** : Brûlant au bord, froid au milieu : ton micro-ondes n'est pas cassé.\n- **Accroche B** : Ton micro-ondes a des endroits qui ne chauffent presque pas.\n- **Sources** : USDA FSIS, « Cooking with microwave ovens » (cuisson inégale, « cold spots », remuer, temps de repos ; utile même avec un plateau) https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/cooking-microwave-ovens · COMSOL, « Why does a microwave heat food unevenly? » (motif de zones de champ fort et faible) https://www.comsol.com/blogs/why-does-a-microwave-heat-food-unevenly/ · Penn State, « Microwave your foods safely » (ondes qui interfèrent et s'annulent) https://www.psu.edu/news/campus-life/story/microwave-your-foods-safely\n- **Nuances** : les bords chauffent aussi plus à cause de la forme du plat. Certains fours n'ont pas de plateau mais un brasseur d'ondes caché.\n\n---\n\n## F2 · Fixe ce cœur rouge, puis regarde le blanc\nRubrique : Corps, perception et nature · Signature : oui (le mécanisme est dans ton œil) · Durée probable : 25–30 s (dont ~12 s à fixer)\n\n- **Réponse en une phrase** : à force de fixer le rouge, les capteurs de ta rétine les plus sensibles au rouge s'adaptent et répondent moins ; sur du blanc, les autres dominent un instant et tu vois la couleur opposée, vert-bleu.\n- **Test de partage** : à n'importe qui, avec « fais le test ». La personne vit l'effet elle-même puis apprend que c'est sa rétine qui « fatigue ». C'est le sujet le plus partageable du lot, parce qu'il se fait, pas seulement qu'il s'écoute.\n- **Preuve visuelle possible** : image 0 = grand cœur rouge avec un point noir au centre et l'instruction écrite. Compte à rebours, puis écran blanc avec un simple contour : le spectateur voit lui-même le cœur vert-bleu. Ensuite un schéma court (blanc = rouge + vert + bleu, le rouge atténué).\n- **Accroche A** : Fixe le point noir pendant 12 secondes. Puis regarde le blanc.\n- **Accroche B** : Ce cœur est rouge. Dans 12 secondes, tu le verras vert-bleu.\n- **Sources** : Exploratorium, « Bird in a Cage » (fixer un oiseau rouge 15 à 30 s, puis un mur blanc : image bleu-vert) https://annex.exploratorium.edu/exhibits/bird_in_a_cage/bird_in_a_cage.html · Exploratorium, « Find complementary colors in afterimages » https://annex.exploratorium.edu/colorfest/trythis.php · Étude 2025, Communications Psychology (Université de Southampton) : la couleur des images rémanentes suit l'adaptation des cônes https://eprints.soton.ac.uk/507287/1/s44271-025-00331-5.pdf\n- **Nuances** : la part exacte de la rétine et du cerveau est encore débattue. L'effet varie selon l'écran et les personnes (plus faible chez certaines personnes daltoniennes). Les sources parlent de 15 à 30 s ; 12 s est un pari à tester sur téléphone avant validation de l'aperçu. Aucune image clignotante.\n\n---\n\n## F3 · Le pays qui a le plus de fuseaux horaires, c'est la France\nRubrique : Cartes et géographie · Signature : non (révélation géographique, pas un mécanisme) · Durée probable : 20–25 s\n\n- **Réponse en une phrase** : grâce à ses territoires d'outre-mer répartis sur tous les océans, la France compte 12 fuseaux horaires (13 quand Saint-Pierre-et-Miquelon passe à l'heure d'été), plus que la Russie et les États-Unis (11).\n- **Test de partage** : à l'ami qui répondrait « la Russie ». Il apprend que c'est la France, et pourquoi. Le public français a une raison de plus de partager.\n- **Preuve visuelle possible** : image 0 = planisphère avec la Russie et les États-Unis en avant, et la question. Puis les territoires français s'allument un par un, compteur jusqu'à 12. Fin : deux horloges, midi à Paris, 1 h du matin à Tahiti (en hiver). Carte exacte, projection à surfaces justes.\n- **Accroche A** : Le pays qui a le plus de fuseaux horaires ? Ni la Russie, ni les États-Unis.\n- **Accroche B** : Quand il est midi à Paris, il est une heure du matin en France.\n- **Sources** : Guinness World Records, « Country with the most time zones » (France 12, 13 une partie de l'année ; Russie et États-Unis 11) https://www.guinnessworldrecords.com/world-records/584626-country-with-the-most-time-zones · timeanddate.com, « Which country has the most time zones? » https://www.timeanddate.com/time/country-with-the-most-time-zones.html\n- **Nuances** : le décompte inclut la Terre Adélie (revendication en Antarctique). Deux des fuseaux américains sont non officiels selon Guinness. Ce sujet ne suit pas la signature « mécanisme » : à garder si tu acceptes quelques révélations de cartes dans la série.\n\n---\n\n## F4 · Comment ta carte sans contact marche sans pile ?\nRubrique : Technologie du quotidien · Signature : oui · Durée probable : 25–30 s\n\n- **Réponse en une phrase** : le terminal crée un champ magnétique qui, par induction, fait naître un petit courant dans l'antenne cachée dans la carte ; c'est lui qui allume la puce, et seulement à quelques centimètres.\n- **Test de partage** : à quelqu'un qui paie sans contact tous les jours. Il apprend que sa carte est éteinte et que c'est le terminal qui l'allume au moment de payer.\n- **Preuve visuelle possible** : image 0 = carte vue en transparence (puce + antenne qui fait le tour de la carte), pile barrée. Démonstration en 3 temps : le terminal émet un champ → l'antenne capte un courant → la puce s'allume, puis s'éteint quand on éloigne la carte. Option filmée : vraie carte devant une lampe forte, où l'antenne se devine parfois (à tester, toutes les cartes ne le montrent pas).\n- **Accroche A** : Ta carte bancaire n'a pas de pile. Alors d'où vient son énergie ?\n- **Accroche B** : Le terminal ne lit pas seulement ta carte : il l'allume.\n- **Sources** : Ministère de l'Économie, « Paiement sans contact : comment ça fonctionne ? » (puce couplée à une antenne, moins de 4 cm) https://www.economie.gouv.fr/particuliers/paiement-sans-contact-comment-ca-fonctionne · arXiv 2001.08143 (alimentation de la puce passive par induction mutuelle entre la bobine du lecteur et celle de la carte) https://arxiv.org/pdf/2001.08143 · Brevet US 8 056 804 (cartes sans contact sans batterie, alimentées par induction) https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/8056804\n- **Nuances** : quelques cartes spéciales ont une batterie. La forme de l'antenne varie selon les fabricants.\n\n---\n\n## F5 · « OK » est né d'une blague de journal\nRubrique : Histoire, mots et culture · Signature : non (histoire d'un mot) · Durée probable : 20–25 s\n\n- **Réponse en une phrase** : en 1839, des journaux de Boston s'amusaient à abréger des fautes volontaires ; « O.K. » voulait dire « oll korrect », une façon ridicule d'écrire « all correct ».\n- **Test de partage** : à quelqu'un qui répond toujours « ok ». Il apprend que le mot vient d'une faute d'orthographe faite exprès.\n- **Preuve visuelle possible** : image 0 = bulle de message « ok » qui se transforme en une de journal de 1839 reconstituée (signalée comme reconstitution). « O.K. » se déplie en « Oll Korrect », puis se corrige en « All Correct ».\n- **Accroche A** : Tu écris « ok » tous les jours. C'est une faute d'orthographe.\n- **Accroche B** : « OK » est né d'une blague de journalistes, en 1839.\n- **Sources** : Smithsonian Magazine (travaux d'Allen Walker Read) https://www.smithsonianmag.com/smart-news/how-one-man-discovered-the-obscure-origins-of-the-word-ok-180953258/ · Merriam-Webster, « The hilarious history of OK » https://www.merriam-webster.com/wordplay/the-hilarious-history-of-ok-okay · HISTORY.com (23 mars 1839, Boston Morning Post) https://www.history.com/this-day-in-history/march-23/ok-enters-national-vernacular\n- **Nuances** : l'explication de Read est le consensus des linguistes ; d'autres hypothèses ont circulé mais sont généralement rejetées. Peu de mouvement possible : c'est le sujet le plus « parlé » du lot.\n\n---\n\n## F6 · Pourquoi le fond des canettes est creux ?\nRubrique : Objets et mécanismes · Signature : oui · Durée probable : 20–25 s\n\n- **Réponse en une phrase** : la boisson gazeuse pousse sur les parois très fines ; un fond plat se bomberait et la canette basculerait, alors qu'un dôme résiste comme une voûte avec peu de métal.\n- **Test de partage** : faible. On l'enverrait à quelqu'un qui boit une canette, mais la réponse (« ça résiste à la pression ») est correcte sans être mémorable. **Je le propose en réserve, pas en priorité.**\n- **Preuve visuelle possible** : image 0 = canette qui se retourne, gros plan sur le creux. Comparaison fond plat qui gonfle et vacille / dôme qui tient.\n- **Accroche A** : Retourne ta canette : ce creux n'est pas là pour faire joli.\n- **Accroche B** : Avec un fond plat, ta canette ne tiendrait pas debout.\n- **Sources** : The Christian Science Monitor, « Now you know » (parois d'environ 0,005 pouce, fond concave « comme un barrage-voûte ») https://www.csmonitor.com/2005/0408/p18s02-hfgn.html · Brevet US 3 979 009 « Container bottom structure » https://patents.google.com/patent/US3979009 · Brevet US 6 132 155 (plus de résistance avec moins de matière) https://patents.google.com/patent/US6132155\n- **Nuances** : l'épaisseur « couverture de magazine » vaut pour les parois, pas pour le fond. Sources surtout journalistiques et brevets : pas de source institutionnelle.\n\n---\n\n## Ma recommandation\n\n1. **À valider en priorité** : F2 cœur rouge, F1 micro-ondes, F4 carte sans contact. Les trois suivent la signature « détail banal → mécanisme étonnant » et ont une révélation qu'on peut dire en une phrase.\n2. **Selon ton choix de ligne** : F3 fuseaux horaires et F5 « OK » sont de bonnes révélations, mais ce ne sont pas des mécanismes. Je les garde si tu veux quelques épisodes « carte » et « mot » dans la série.\n3. **En réserve** : F6 canette.\n4. **IA en pratique** : 4 sujets en pause (ticket entre colocs, tableau blanc → compte rendu, relevé bancaire masqué → budget, menus à 50 € vérifiés). On les reprendra seulement avec de vraies démos, leurs coûts et leurs limites.\n\nDès qu'une fiche est validée, j'écris son script dans la version la plus courte qui explique bien, puis je le soumets avant tout aperçu.\n", "dossier": "videos/00_strategie/fiches-lot-2.md", "ordre": 6, "resume": "Fiches d'une page pour Curiosités : question, réponse en une phrase, test de partage, preuve visuelle, 2 accroches, sources. Classées ; IA en pratique en pause. Aucun script avant ta validation de la fiche.", "titre": "Lot 2 · 6 fiches sujets à valider (avant script)", "type": "document"}, "propositions-reserve": {"ajoute_le": "2026-11-23", "contenu": "# Sujets de réserve · propositions à valider (aucune production)\n\nCompte : Curiosités du quotidien. Préparé le 23/11/2026, sources vérifiées le même jour.\nChaque fiche suit la formule question familière → détail surprenant → démonstration visuelle → réponse claire. Les textes font entre 70 et 100 mots. Rien ne sera produit tant que tu n'as pas validé le texte.\n\n---\n\n## R1 · Pourquoi les glaçons craquent dans ton verre ?\nRubrique : Science du quotidien\n\n- **Accroche A** : Tu as déjà entendu ton glaçon craquer en versant ta boisson ?\n- **Accroche B** : Ce petit « crac » dans ton verre, c'est un glaçon qui se déchire.\n\n**Texte proposé (82 mots)** : Tu as déjà entendu ton glaçon craquer en versant ta boisson ? Ce n'est pas le choc du liquide. Un glaçon sort du congélateur vers moins dix-huit degrés. Au contact de la boisson, sa surface se réchauffe d'un coup et se dilate, alors que son cœur reste glacé. Les deux parties tirent l'une contre l'autre. Si la glace contient de petits défauts, la tension l'ouvre en deux. Le craquement, c'est cette fissure. Un glaçon plus tempéré craque moins.\n\n**Storyboard** : 0–3 s glaçon qui tombe, « crac » ; 3–9 s coupe du glaçon, thermomètre −18 °C ; 9–16 s surface qui vire au chaud, cœur bleu, flèches de tension ; 16–22 s la fissure part d'un défaut ; 22–26 s glaçon « tempéré » qui ne craque pas.\n\n**Sources** : BBC Science Focus (R. Matthews) https://www.sciencefocus.com/science/why-do-ice-cubes-crack-when-you-put-them-in-water · The Conversation, Curtin University https://theconversation.com/curious-kids-why-does-ice-make-a-cracking-sound-when-water-is-poured-on-it-92844\n**Nuance** : « un glaçon plus tempéré craque moins » découle du mécanisme, mais je ne l'ai pas trouvé chiffré dans une source institutionnelle. À retirer si tu veux zéro extrapolation.\n\n---\n\n## R2 · D'où viennent les bulles sur la paroi de ton verre d'eau ?\nRubrique : Science du quotidien\n\n- **Accroche A** : Pourquoi des bulles apparaissent dans un verre d'eau plate ?\n- **Accroche B** : Ton eau plate contient de l'air. La preuve est collée au verre.\n\n**Texte proposé (80 mots)** : Pourquoi des bulles apparaissent dans un verre d'eau plate laissé sur la table ? L'eau du robinet contient de l'air dissous, invisible. Quand elle se réchauffe, elle en garde moins, et cet air doit sortir. Mais une bulle a du mal à naître en plein liquide. Elle se forme là où c'est plus facile : sur les minuscules rayures, poussières ou fibres de la paroi. On appelle ces points des sites de nucléation. Les bulles ne viennent pas du verre : elles viennent de l'eau.\n\n**Storyboard** : 0–3 s verre d'eau, bulles qui apparaissent en accéléré ; 3–9 s points d'air dissous dans l'eau ; 9–15 s thermomètre qui monte, les points cherchent la sortie ; 15–22 s zoom sur la paroi, rayures et fibres, une bulle grossit ; 22–26 s conclusion.\n\n**Sources** : BBC Science Focus https://www.sciencefocus.com/science/what-are-the-small-bubbles-that-form-in-a-glass-of-water · Hong Kong Observatory (nucléation) https://www.hko.gov.hk/en/education/earth-science/physics-in-daily-life/00395-bubbles-in-a-soft-drink-part-i.html · CERN, ressources éducatives https://educational-resources.web.cern.ch/states-of-matter\n**Nuance** : le lien « eau qui se réchauffe = moins d'air dissous » est de la physique standard (solubilité des gaz), cité ici sans source dédiée ; je peux en ajouter une si tu gardes le sujet.\n\n---\n\n## R3 · Pourquoi la route de ton avion fait une courbe sur la carte ?\nRubrique : Cartes et géographie\n\n- **Accroche A** : Paris–Los Angeles passe près du Groenland. Ce n'est pas un détour.\n- **Accroche B** : Sur l'écran de l'avion, ta route fait un arc. C'est pourtant le plus court.\n\n**Texte proposé (78 mots)** : Sur l'écran de l'avion, ta route dessine une grande courbe vers le nord. On dirait un détour. En réalité, c'est souvent le chemin le plus court. La Terre est ronde, et le plus court chemin entre deux points d'une sphère suit un « grand cercle ». Quand on aplatit la Terre sur une carte, ce chemin se déforme et devient un arc. Pose une ficelle sur un globe entre deux villes : tu retrouves la même courbe.\n\n**Storyboard** : 0–3 s écran de vol, arc vers le nord ; 3–8 s ligne droite sur la carte plate vs arc ; 8–15 s globe, ficelle tendue entre deux villes ; 15–22 s on déroule le globe en carte, la ficelle devient un arc ; 22–26 s conclusion.\n\n**Sources** : MathWorks, documentation Mapping Toolbox (grands cercles et loxodromies) https://www.mathworks.com/help/map/rhumb-lines.html · Patrick Smith, pilote de ligne, Ask the Pilot https://askthepilot.com/questionanswers/great-circles\n**Nuance** : les vraies routes s'écartent du grand cercle à cause des vents, des couloirs aériens et des règles de sécurité. Le texte dit « souvent ».\n\n---\n\n## R4 · Pourquoi la cuillère en métal paraît plus froide que celle en bois ?\nRubrique : Science du quotidien\n\n- **Accroche A** : Ces deux cuillères sont à la même température. Pourtant…\n- **Accroche B** : Ta main est un mauvais thermomètre.\n\n**Texte proposé (80 mots)** : Ces deux cuillères sont posées dans la même cuisine, à la même température. Pourtant, celle en métal paraît plus froide. Ta main est plus chaude que la pièce, donc la chaleur passe de ta peau vers l'objet. Le métal conduit très bien la chaleur : il l'emporte vite, ta peau se refroidit, et tu sens du froid. Le bois conduit mal : ta peau reste presque à sa température. Ce que tu sens, ce n'est pas la température de l'objet, c'est la chaleur que tu perds.\n\n**Storyboard** : 0–3 s deux cuillères, deux thermomètres identiques ; 3–9 s main, flèches de chaleur ; 9–16 s métal : flèches rapides, peau qui bleuit ; 16–22 s bois : flèches lentes ; 22–26 s conclusion.\n\n**Sources** : American Physical Society https://www.aps.org/learning-resources/getting-warmer-colder · Exploratorium https://www.exploratorium.edu/snacks/cold-metal · BBC Bitesize https://www.bbc.co.uk/bitesize/articles/zh63ydm\n\n---\n\n## R5 · Pourquoi un QR code abîmé fonctionne encore ?\nRubrique : Technologie du quotidien\n\n- **Accroche A** : Il manque un coin à ce QR code. Et il marche quand même.\n- **Accroche B** : Un QR code peut perdre jusqu'à environ 30 % de lui-même.\n\n**Texte proposé (77 mots)** : Il manque un morceau à ce QR code, et ton téléphone le lit quand même. Ce n'est pas de la chance. Un QR code contient tes données, plus des données de secours calculées à partir d'elles. Si une partie est sale ou déchirée, le lecteur reconstruit ce qui manque. Selon le niveau choisi à la création, on peut récupérer environ 7 à 30 % des données. Le QR code se répare tout seul, dans une certaine limite.\n\n**Storyboard** : 0–3 s QR code déchiré, scan réussi ; 3–9 s le carré se sépare en données + données de secours ; 9–16 s on efface des modules, le lecteur les recolore ; 16–22 s jauge 7 % / 15 % / 25 % / 30 % ; 22–26 s trop abîmé : échec, limite.\n\n**Sources** : DENSO WAVE (inventeur du QR code), page Error correction https://www.qrcode.com/en/about/error_correction.html · DENSO WAVE, spécification https://www.qrcode.com/en/about/standards.html\n**Nuance** : les pourcentages portent sur les « mots de code », pas exactement sur la surface. Les trois carrés de repérage doivent rester lisibles.\n\n---\n\n## R6 · Pourquoi tant de prix finissent par 9 ?\nRubrique : Histoire, mots et culture\n\n- **Accroche A** : 2,99 € au lieu de 3 €. Ce centime change ta perception.\n- **Accroche B** : Ton cerveau lit les prix de gauche à droite, et ça compte.\n\n**Texte proposé (76 mots)** : 2,99 € au lieu de 3 €. Un seul centime d'écart, mais ce prix paraît nettement moins cher. Les chercheurs appellent ça l'effet du chiffre de gauche. On lit un prix de gauche à droite, et le premier chiffre pèse plus que les autres. 2,99 commence par 2, donc on le range dans les « deux euros ». L'effet joue surtout quand le premier chiffre change. Le 9 n'est pas magique : il exploite la manière dont on lit.\n\n**Storyboard** : 0–3 s étiquettes 2,99 € et 3,00 € ; 3–9 s balance qui penche, 1 centime ; 9–16 s le regard lit de gauche à droite, le « 2 » grossit ; 16–22 s contre-exemple 2,49 vs 2,50 : effet faible ; 22–26 s conclusion.\n\n**Sources** : Thomas et Morwitz (2005), Journal of Consumer Research https://academic.oup.com/jcr/article/32/1/54/1796360 · Sokolova, Seenivasan et Thomas (2020), Journal of Marketing Research https://journals.sagepub.com/doi/full/10.1177/0022243720932532\n**Nuance** : l'effet existe mais varie selon les produits et les études (signalé dans la publication de 2020). Pas de chiffre de hausse des ventes dans le texte.\n\n---\n\n## R7 · Comment les chats voient dans le noir ?\nRubrique : Corps, perception et nature\n\n- **Accroche A** : Un chat ne voit pas dans le noir complet. Mais presque.\n- **Accroche B** : Pourquoi les yeux du chat brillent sur tes photos ?\n\n**Texte proposé (82 mots)** : Les yeux de ton chat brillent sur les photos de nuit. C'est la clé de sa vision. Derrière sa rétine, il a une couche qui agit comme un miroir. La lumière qui n'a pas été captée rebondit et traverse la rétine une deuxième fois. Ajoute des pupilles qui s'ouvrent très grand et beaucoup de cellules sensibles à la faible lumière. Résultat : il voit dans une pénombre où tu ne vois presque rien. Mais dans le noir complet, lui non plus.\n\n**Storyboard** : 0–3 s yeux qui brillent dans l'ombre ; 3–10 s coupe de l'œil, rayon qui rebondit sur le miroir ; 10–16 s pupille qui s'élargit, cellules en bâtonnets ; 16–22 s même pièce vue par toi / par le chat ; 22–26 s noir complet : écran noir pour les deux.\n\n**Sources** : The Conversation (Curious Kids, vétérinaire) https://theconversation.com/why-do-cats-eyes-glow-in-the-dark-179531 · PetMD, avis d'ophtalmologue vétérinaire https://www.petmd.com/cat/general-health/cat-vision\n**Nuance** : The Conversation cite « 16 % de la lumière nécessaire à l'humain ». Je ne mets pas de chiffre à l'écran tant qu'une deuxième source ne le confirme pas.\n\n---\n\n## R8 · Pourquoi le rideau de douche vient se coller à toi ?\nRubrique : Science du quotidien\n\n- **Accroche A** : Tu ouvres la douche, et le rideau t'attaque.\n- **Accroche B** : Ce rideau a valu un prix à un chercheur.\n\n**Texte proposé (82 mots)** : Tu ouvres la douche, et le rideau vient se coller à tes jambes. Pendant longtemps, personne n'était d'accord sur la raison. En 2001, un chercheur a simulé une douche sur ordinateur. Son résultat : le jet entraîne l'air et crée un tourbillon couché, comme une petite tornade horizontale. Au centre de ce tourbillon, la pression baisse, et le rideau léger est aspiré. Il existe d'autres explications, comme l'air chaud qui monte. Mais le rideau bouge aussi avec de l'eau froide.\n\n**Storyboard** : 0–3 s douche, rideau qui gonfle vers l'intérieur ; 3–8 s points d'interrogation, théories ; 8–16 s simulation : flèches d'air, tourbillon horizontal ; 16–22 s zone de basse pression, rideau aspiré ; 22–26 s eau froide : le rideau bouge quand même.\n\n**Sources** : Scientific American, explication de David Schmidt (UMass Amherst) https://www.scientificamerican.com/article/why-does-the-shower-curta/ · Museum of Science Boston https://www.mos.org/video/scientific-mystery-behind-shower-curtain-effect\n**Nuance** : sujet encore discuté, d'où « un chercheur a simulé » plutôt que « la science a prouvé ». Le prix (Ig Nobel 2001) peut aller en commentaire épinglé.\n\n---\n\n## R9 · Comment le gecko tient au plafond ?\nRubrique : Corps, perception et nature\n\n- **Accroche A** : Le gecko marche au plafond sans colle et sans ventouse.\n- **Accroche B** : Le secret du gecko tient dans des poils minuscules.\n\n**Texte proposé (82 mots)** : Le gecko marche au plafond sans colle et sans ventouse. Le secret est sous ses doigts. Ils sont couverts de millions de poils microscopiques, qui se divisent encore en pointes des centaines de fois plus fines qu'un cheveu. Ces pointes touchent la surface de si près que de minuscules forces d'attraction entre molécules s'additionnent. Une seule est négligeable, des milliards suffisent à le tenir. Et pour décoller, il lui suffit de changer l'angle de son doigt.\n\n**Storyboard** : 0–3 s gecko au plafond ; 3–8 s zoom sur le doigt, lamelles ; 8–15 s zoom sur les poils puis les pointes ; 15–21 s forces entre molécules, compteur qui monte ; 21–26 s doigt qui pivote et se décolle.\n\n**Sources** : Autumn et al. (2000), Nature https://www.nature.com/articles/35015073 · Autumn et al. (2002), PNAS https://www.pnas.org/doi/10.1073/pnas.192252799\n**Nuance** : des travaux plus récents montrent que l'humidité et d'autres interactions jouent aussi (PNAS 2005, Journal Club PNAS 2021). Le texte dit « forces d'attraction entre molécules », ce qui reste exact. « Des centaines de fois plus fines qu'un cheveu » : pointes de 0,2 à 0,5 µm (Nature 2000), cheveu d'environ 70 µm.\n\n---\n\n## R10 · D'où vient « poser un lapin » ?\nRubrique : Histoire, mots et culture\n\n- **Accroche A** : Pourquoi un lapin quand quelqu'un ne vient pas au rendez-vous ?\n- **Accroche B** : « Poser un lapin » n'a pas toujours voulu dire ça.\n\n**Texte proposé (79 mots)** : Pourquoi dit-on « poser un lapin » à quelqu'un qui ne vient pas au rendez-vous ? Au XIXe siècle, en argot, « poser » voulait dire faire attendre, et un « lapin » désignait un paiement qu'on ne versait jamais. Poser un lapin, c'était donc partir sans payer ce qu'on devait. Le sens a glissé : d'une attente déçue, celle de l'argent, on est passé à une autre, celle de la personne. L'origine exacte reste discutée par les spécialistes.\n\n**Storyboard** : 0–3 s table de café, chaise vide, horloge ; 3–9 s dictionnaire d'argot 1883 « poser = faire attendre » ; 9–15 s « lapin = paiement jamais versé » ; 15–22 s flèche de glissement entre deux attentes ; 22–26 s mention « origine discutée ».\n\n**Sources** : Eurêkoi, Bibliothèque publique d'information https://www.eurekoi.org/quelle-est-lorigine-de-lexpression-poser-un-lapin · Le Figaro, langue française https://www.lefigaro.fr/langue-francaise/expressions-francaises/2017/07/11/37003-20170711ARTFIG00010-mais-d-o-vient-poser-un-lapin.php\n**Nuance** : le sens d'origine concerne la prostitution (client qui ne payait pas). Le texte reste factuel sans le dire. À toi de voir si c'est adapté au compte.\n", "dossier": "videos/00_strategie/propositions-reserve.md", "ordre": 4, "resume": "10 sujets avec 2 accroches, texte proposé, storyboard, sources et nuances. Aucune production avant ta validation.", "titre": "Sujets de réserve · 10 propositions à valider", "type": "document"}, "voix-atma-hublot": {"ajoute_le": "2026-11-23", "contenu": "# Atma · Le petit trou du hublot, deux rythmes\n\n| Version | Débit | Durée de parole | Comment |\n|---|---|---|---|\n| **A** | 2,7 mots/s | 25 s | même prise qu'avant (modèle eleven_v4), avec des respirations ajoutées aux points et aux virgules |\n| **B** | 2,2 mots/s | 32 s | autre modèle (eleven_multilingual_v2), qui lit naturellement plus lentement |\n\nRepère : 2,5 à 2,7 mots/s est le débit confortable pour de la vulgarisation. La première prise était à 3,2.\n\nUne fois ton choix fait, je l'applique aux 12 épisodes.", "ordre": 0, "resume": "La première prise d'Atma allait vite (3,2 mots/s). Deux versions plus posées, audio seul, même texte. Clique « Choisir la voix » sur celle que tu préfères.", "titre": "Voix Atma, plus lente : choisis A ou B (hublot complet)", "type": "document", "voix": [{"lettre": "A", "libelle": "Atma · respirations", "note": "2,7 mots/s · 25 s de parole", "url": "/_blob/8984e11269b112831e225faa13a95940"}, {"lettre": "B", "libelle": "Atma · plus lente", "note": "2,2 mots/s · 32 s de parole", "url": "/_blob/eaa1bb67d14de8c0479dc204cc2db324"}]}, "voix-elevenlabs": {"ajoute_le": "2026-11-23", "contenu": "# Sélecteur de voix ElevenLabs\n\nExtrait : « Tu as déjà remarqué ce minuscule trou au bas du hublot ? Ce n’est pas un défaut. Un hublot comporte plusieurs panneaux… »\n\nRéglages identiques pour toutes : stabilité 0,45, similarité 0,75, style 0. Une fois la voix choisie, je règle le débit et l'intonation sur un épisode complet avant de lancer les autres.\n\nOffre ElevenLabs : Creator (licence commerciale incluse).", "ordre": 0, "resume": "Même début du script du hublot, lu par chacune des voix françaises de ta bibliothèque ElevenLabs (modèle eleven_v4). Écoute, puis clique « Choisir la voix » sur celle que tu veux.", "titre": "Choisis ta voix ElevenLabs (12 voix françaises de ton compte)", "type": "document", "voix": [{"lettre": "A", "libelle": "AVI TEST", "note": "homme, parisien · VyhE2nEdeqFB3uMJK3vz", "url": "/_blob/fec64de0f220f423154df249d7cd6855"}, {"lettre": "B", "libelle": "Claire", "note": "femme, conversationnelle, décontractée · NEjemlRxgWmL5ZGJetsB", "url": "/_blob/9a6848477569176a3691085bcab92bdd"}, {"lettre": "C", "libelle": "Anna B", "note": "femme, parisienne, assurée, réseaux sociaux · nVPCtAFzgyMX3FZKNzH0", "url": "/_blob/0d0e89d52ee11a9ae99a68af176b1c26"}, {"lettre": "D", "libelle": "Nova", "note": "homme, calme · BVBq6HVJVdnwOMJOqvy9", "url": "/_blob/a3e8c4793cf27bdddf44afce891359f7"}, {"lettre": "E", "libelle": "Alexandre", "note": "homme, parisien, calme et chaleureux · gP52hjM48hyNoVCbizxO", "url": "/_blob/4bd1cc048340a34bb31a92ccdbf04758"}, {"lettre": "F", "libelle": "Hugo", "note": "homme jeune, décontracté · IbbR6Av0dWuQJS0b8JVT", "url": "/_blob/b27cd3a57ef65ec691d87137ee3ff4ba"}, {"lettre": "G", "libelle": "Marcel", "note": "homme, décontracté · kENkNtk0xyzG09WW40xE", "url": "/_blob/ccee0c476a9402ab0c3ba9ded58e7811"}, {"lettre": "H", "libelle": "Marie", "note": "femme, narratrice, assurée · sANWqF1bCMzR6eyZbCGw", "url": "/_blob/7103fb4973edc4aa3c724d6592dfb653"}, {"lettre": "I", "libelle": "Martin Dupont Intime", "note": "homme, narrateu
