<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #000; --ink: #fff; --font-display: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .shot img { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 100%); }
      .txt { position: absolute; left: 90px; right: 90px; bottom: 300px; color: var(--ink);
             text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
      .kicker { font-weight: 500; font-size: 30px; letter-spacing: .35em; opacity: .9; }
      .big { font-weight: 600; font-size: 78px; letter-spacing: .06em; line-height: 1.1; margin-top: 18px; }
      #end { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; }
      #end img { width: 600px; height: auto; }
      #end p { color: #fff; font-weight: 300; font-size: 30px; letter-spacing: .3em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="s1" class="clip shot" data-start="0" data-duration="3"><img src="assets/s1.jpg" /><div class="shade"></div>
        <div class="txt"><div class="kicker">Marbella</div><div class="big">Golf valley<br/>living</div></div></div>
      <div id="s2" class="clip shot" data-start="3" data-duration="2.5"><img src="assets/s4.jpg" /><div class="shade"></div>
        <div class="txt"><div class="big">Light.<br/>Space.</div></div></div>
      <div id="s3" class="clip shot" data-start="5.5" data-duration="2.5"><img src="assets/s3.jpg" /><div class="shade"></div>
        <div class="txt"><div class="big">Private<br/>gardens</div></div></div>
      <div id="s4" class="clip shot" data-start="8" data-duration="2.5"><img src="assets/s2.jpg" /><div class="shade"></div>
        <div class="txt"><div class="big">Interiors<br/>with character</div></div></div>
      <div id="s5" class="clip shot" data-start="10.5" data-duration="1.5"><img src="assets/s6.jpg" /><div class="shade"></div>
        <div class="txt"><div class="kicker">Private viewing</div><div class="big">On request</div></div></div>
      <div id="end" class="clip" data-start="12" data-duration="2"><img src="assets/logo.png" /><p>Marbella</p></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const shots = [["#s1",0,3,1],["#s2",3,2.5,-1],["#s3",5.5,2.5,1],["#s4",8,2.5,-1],["#s5",10.5,1.5,1]];
      shots.forEach(([id, t, d, dir]) => {
        tl.fromTo(id + " img", { scale: 1.0, xPercent: -1.5 * dir }, { scale: 1.08, xPercent: 1.5 * dir, duration: d, ease: "none" }, t);
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, t);
        tl.fromTo(id + " .txt > *", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "power3.out" }, t + 0.25);
      });
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 12);
      tl.fromTo("#end img, #end p", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.2, ease: "power2.out" }, 12.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
